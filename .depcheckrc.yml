ignores:
  - "alepha"
  - "@alepha/ui"
  - "@alepha/mantine"
  - "@alepha/mqtt"
  - "@alepha/devtools"
  # The root devDependency is what makes Yarn link `node_modules/.bin/lore`,
  # so every `yarn lore ...` step in CI stops resolving the moment somebody
  # deletes it as unused. Nothing at the root imports the package, and
  # nothing should: `lore` is a binary now, not a plugin.
  - "@alepha/lore"
  # `@alepha/lore` devDepends on `lore` to type `@alepha/lore/cli` against
  # Lore's own controllers. The edge is `import type` and nothing else, so it
  # is erased before anything runs and depcheck reads the manifest entry as
  # unused. Removing the entry would not simplify anything: it would drop the
  # types the CLI is built on and leave the deep import resolving by luck.
  - "lore"
  - "@vitejs/plugin-react"
  - "jsdom"
  - "@vitest/coverage-v8"
  - "drizzle-kit"
  - "swagger-ui-dist"
  - "vite"
  # Reached through `createRequire(import.meta.url)("vite-bundle-analyzer")`
  # in `ViteUtils.importAnalyzer`, so depcheck sees no import at all. Lazy
  # for the same reason as `vite` above: `--stats` is the only path that
  # touches it, and a static import drags its report template into every
  # consumer of the CLI barrel.
  - "vite-bundle-analyzer"
  - "@types/react"
  - "animate.css"
  - "marked-highlight"
  - "highlight.js"
  - "oxfmt"
  - "oxlint"
  # Never imported: oxlint discovers and spawns the `tsgolint` binary itself
  # when `options.typeAware` is set.
  - "oxlint-tsgolint"
  - "typescript"
  - "vitest"
  - "react-is"
  - "@playwright/test"
  - "wrangler"
  - "vercel"
  - "@fontsource/jetbrains-mono"
  - "@types/bun"
  - "better-sqlite3"
  - "surge"
  - "bun"
  - "bun:sqlite"
  - "bun:test"
  - "cloudflare:workers"
  - "tailwindcss"
  - "@tailwindcss/vite"
  - "@types/react-dom"
  - "@types/react-is"
  - "@fontsource-variable/archivo"
  - "@fontsource-variable/inter"
  - "@fontsource-variable/jetbrains-mono"
  - "date-fns"
  - "tw-animate-css"
  - "shadcn"
  - "yjs"

ignore-patterns:
  - "dist"
  - "assets"
