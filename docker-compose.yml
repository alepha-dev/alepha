services:

  redis:
    restart: always
    image: redis:latest
    ports:
      - "6379:6379"

  postgres:
    restart: always
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  azurite:
    restart: always
    image: mcr.microsoft.com/azure-storage/azurite
    pull_policy: "always"
    ports:
      - "10000:10000"
