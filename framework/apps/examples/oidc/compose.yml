# Keycloak with the `acme` realm imported, for running this example against a
# real identity provider: `yarn keycloak`, then `yarn dev` in another terminal,
# then open http://localhost:3316 and sign in as `ada` / `ada`.
#
# Not part of `framework/compose.yml`, which `yarn v` starts on every run: CI
# signs in against the mock provider of `alepha/testing/oidc` instead.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
