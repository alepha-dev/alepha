ignores:
  - "alepha"
  - "@alepha/ui"
  # `@alepha/mqtt/topic` imports the client from its own package name.
  - "@alepha/mqtt"
  # The root devDependency is what makes Yarn link `node_modules/.bin/lore`,
  # so every `yarn lore ...` step in CI stops resolving the moment somebody
  # deletes it as unused. Nothing at the root imports the package, and
  # nothing should: `lore` is a binary now, not a plugin.
  - "@alepha/lore"
  - "@vitejs/plugin-react"
  - "jsdom"
  - "@vitest/coverage-v8"
  - "drizzle-kit"
  - "vite"
  # Reached through `createRequire(import.meta.url)("vite-bundle-analyzer")`
  # in `ViteUtils.importAnalyzer`, so depcheck sees no import at all. Lazy
  # for the same reason as `vite` above: `--stats` is the only path that
  # touches it, and a static import drags its report template into every
  # consumer of the CLI barrel.
  - "vite-bundle-analyzer"
  - "@types/react"
  - "highlight.js"
  - "oxfmt"
  - "oxlint"
  # Never imported: oxlint discovers and spawns the `tsgolint` binary itself
  # when `options.typeAware` is set.
  - "oxlint-tsgolint"
  - "typescript"
  - "vitest"
  - "react-is"
  - "@playwright/test"
  - "wrangler"
  # Every font is pulled by an `@import` in a `.css` file, which depcheck does
  # not read, so all of them look unused. Self-hosted rather than fetched from
  # a CDN, so the manifest entry is what actually ships the files.
  - "@fontsource/jetbrains-mono"
  - "@fontsource/ibm-plex-mono"
  - "@fontsource/space-grotesk"
  - "@fontsource/spectral"
  - "@types/bun"
  - "bun"
  - "bun:ffi"
  - "bun:sqlite"
  - "bun:test"
  - "cloudflare:workers"
  - "tailwindcss"
  - "@tailwindcss/vite"
  - "@types/react-dom"
  - "@fontsource-variable/archivo"
  - "@fontsource-variable/inter"
  - "@fontsource-variable/jetbrains-mono"
  - "date-fns"
  - "tw-animate-css"
  # Capacitor platforms and plugins a native app installs: the iOS and
  # Android projects load them (through Swift Package Manager and Gradle), and
  # `@alepha/capacitor/core` reaches the plugins through the bridge, so no
  # JavaScript of the app imports them by name.
  - "@capacitor/android"
  - "@capacitor/ios"
  - "@capacitor/app"
  - "@capacitor/device"
  - "@capacitor/haptics"
  - "@capacitor/splash-screen"
  - "@aparajita/capacitor-secure-storage"

ignore-patterns:
  - "dist"
  - "assets"
  # The desktop e2e's fixture app is copied into a throwaway project that
  # installs its own dependencies (react, the packed @alepha/desktop); none of
  # them belong to the e2e-cli workspace that carries the files.
  - "src/fixtures/desktop"
