services:
  # A private npm registry, for `node scripts/rehearse-lore-global.ts`: it
  # publishes the packed `@alepha/lore` here and installs it globally with
  # four package managers. Config and reasoning in `scripts/verdaccio.yaml`.
  verdaccio:
    image: verdaccio/verdaccio:latest
    ports:
      - "14873:4873"
    volumes:
      - ./scripts/verdaccio.yaml:/verdaccio/conf/config.yaml:ro
