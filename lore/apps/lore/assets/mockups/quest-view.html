  <script>
    
document.addEventListener('DOMContentLoaded', async () => {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', (e) => {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    const trustedOrigin = (e) => {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    };
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    const mountPage = (el, frag, text) => {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    };
    const deliverPage = (uuid, text) => {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    };
    const ownFrameWindows = () => {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    };
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          const list = had || [];
          pendingFrames[m[1]] = list;
          list.push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise((r) => { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

yBtn }}\" style-hover=\"background:#fff\"><i data-lucide=\"{{ primaryIcon }}\" style=\"width:15px;height:15px\"><\u002Fi>{{ primaryLabel }}<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ noop }}\" style=\"{{ iconBtn }}\" style-hover=\"background:oklch(0.269 0 0)\"><i data-lucide=\"more-horizontal\" style=\"width:16px;height:16px\"><\u002Fi><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ blocked }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:oklch(0.4 0.09 70 / 22%);box-shadow:inset 0 0 0 1px oklch(0.769 0.188 70.08 / 35%)\">\n<i data-lucide=\"link-2\" style=\"width:15px;height:15px;color:oklch(0.769 0.188 70.08)\"><\u002Fi>\n<span style=\"font-size:13px\">Blocked by <code>#1204<\u002Fcode> <span style=\"color:oklch(0.708 0 0)\">Folio menubar — move the Move dialog<\u002Fspan><\u002Fspan>\n<span style=\"flex:1\"><\u002Fspan>\n<span style=\"font-size:12.5px;color:oklch(0.708 0 0)\">Open the questline<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<i data-lucide=\"file-text\" style=\"width:15px;height:15px;color:oklch(0.708 0 0)\"><\u002Fi>\n<span style=\"font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:oklch(0.708 0 0)\">Description<\u002Fspan>\n<span style=\"flex:1;height:1px;background:oklch(1 0 0 / 10%)\"><\u002Fspan>\n\n<\u002Fdiv>\n<div style=\"font-family:Literata,Georgia,serif;font-size:15.5px;line-height:1.75\">\n<p style=\"margin:0 0 14px\">From feedback #62.<\u002Fp>\n<p style=\"margin:0 0 14px\"><code>FolioMetaBar<\u002Fcode> — the row under the folio title carrying the directory chip, the tag chips, <code>#id · N words · N revisions<\u002Fcode> and the view/edit toggle — goes away entirely. The only survivor is the edit toggle, which becomes a <strong>larger floating control at the top right<\u002Fstrong> of the document pane.<\u002Fp>\n<h3 style=\"margin:22px 0 8px;font-family:Inter,system-ui,sans-serif;font-size:15px;font-weight:600\">Scope<\u002Fh3>\n<p style=\"margin:0 0 10px\"><strong>1. Delete the meta bar.<\u002Fstrong> <code>FolioMetaBar.tsx<\u002Fcode> is deleted. The Move dialog is not orphaned — <code>folio.move<\u002Fcode> is already in the menubar.<\u002Fp>\n<p style=\"margin:0\"><strong>2. Remove the folio tag feature app-wide<\u002Fstrong> — UI, HTTP, MCP, markdown export and both locales. The DB columns stay, deliberately: dropping one forces a SQLite table rebuild.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<i data-lucide=\"list-checks\" style=\"width:15px;height:15px;color:oklch(0.708 0 0)\"><\u002Fi>\n<span style=\"font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:oklch(0.708 0 0)\">Objectives<\u002Fspan>\n<span style=\"font-size:12px;color:oklch(0.708 0 0);font-variant-numeric:tabular-nums\">{{ objDone }} of {{ objTotal }}<\u002Fspan>\n<span style=\"width:120px;height:5px;border-radius:9999px;background:oklch(0.269 0 0);overflow:hidden\"><span style=\"{{ objBar }}\"><\u002Fspan><\u002Fspan>\n<span style=\"flex:1;height:1px;background:oklch(1 0 0 / 10%)\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:2px\">\n<sc-for list=\"{{ objectives }}\" as=\"o\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ o.toggle }}\" style=\"{{ o.row }}\" style-hover=\"background:oklch(0.269 0 0 / 55%)\">\n<span style=\"{{ o.box }}\"><sc-if value=\"{{ o.done }}\" hint-placeholder-val=\"{{ false }}\"><i data-lucide=\"check\" style=\"width:12px;height:12px;color:oklch(0.205 0 0)\"><\u002Fi><\u002Fsc-if><\u002Fspan>\n<span style=\"{{ o.text }}\">{{ o.title }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:10px\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<i data-lucide=\"paperclip\" style=\"width:15px;height:15px;color:oklch(0.708 0 0)\"><\u002Fi>\n<span style=\"font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:oklch(0.708 0 0)\">Attachments<\u002Fspan>\n<span style=\"flex:1;height:1px;background:oklch(1 0 0 / 10%)\"><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;gap:8px\">\n<span style=\"display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;background:oklch(0.269 0 0);font-size:12px\"><i data-lucide=\"image\" style=\"width:13px;height:13px;color:oklch(0.708 0 0)\"><\u002Fi>metabar-before.png<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;background:oklch(0.269 0 0);font-size:12px\"><i data-lucide=\"file\" style=\"width:13px;height:13px;color:oklch(0.708 0 0)\"><\u002Fi>folio-audit.txt<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;border:1px dashed oklch(1 0 0 / 18%);font-size:12px;color:oklch(0.708 0 0)\"><i data-lucide=\"plus\" style=\"width:13px;height:13px\"><\u002Fi>Attach<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<i data-lucide=\"message-square\" style=\"width:15px;height:15px;color:oklch(0.708 0 0)\"><\u002Fi>\n<span style=\"font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:oklch(0.708 0 0)\">Discussion<\u002Fspan>\n<span style=\"flex:1;height:1px;background:oklch(1 0 0 / 10%)\"><\u002Fspan>\n<div style=\"display:flex;align-items:stretch;height:26px;padding:2px;border:1px solid oklch(1 0 0 / 10%);border-radius:8px;background:oklch(0.269 0 0 / 40%);font-size:12px\">\n<button type=\"button\" sc-camel-on-click=\"{{ showAll }}\" style=\"{{ tabAll }}\">Everything<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ showComments }}\" style=\"{{ tabComments }}\">Comments only<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column\">\n<sc-for list=\"{{ thread }}\" as=\"t\" hint-placeholder-count=\"5\">\n<div style=\"{{ t.wrap }}\">\n<span style=\"{{ t.avatar }}\"><i data-lucide=\"{{ t.icon }}\" style=\"width:13px;height:13px\"><\u002Fi><\u002Fspan>\n<div style=\"flex:1;min-width:0\">\n<div style=\"display:flex;align-items:baseline;gap:8px\">\n<span style=\"font-size:13px;font-weight:600\">{{ t.who }}<\u002Fspan>\n<span style=\"font-size:12.5px;color:oklch(0.708 0 0)\">{{ t.what }}<\u002Fspan>\n<span style=\"flex:1\"><\u002Fspan>\n<span style=\"font-size:11.5px;color:oklch(0.708 0 0)\">{{ t.when }}<\u002Fspan>\n<\u002Fdiv>\n<sc-if value=\"{{ t.hasBody }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"{{ t.bodyStyle }}\">{{ t.body }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:12px;padding-top:4px\">\n<span style=\"width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;background:oklch(0.269 0 0);color:oklch(0.708 0 0)\"><i data-lucide=\"user\" style=\"width:14px;height:14px\"><\u002Fi><\u002Fspan>\n<div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:8px\">\n<textarea rows=\"3\" placeholder=\"Leave a comment — @mention a member, [[link]] a folio, or #1204 another quest\" value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" style=\"box-sizing:border-box;width:100%;resize:vertical;padding:11px 12px;border:1px solid oklch(1 0 0 / 12%);border-radius:10px;background:oklch(0.205 0 0);color:oklch(0.985 0 0);font:400 13.5px/1.6 Inter,system-ui,sans-serif\"><\u002Ftextarea>\n<div style=\"display:flex;align-items:center;gap:10px\">\n<span style=\"font-size:11.5px;color:oklch(0.708 0 0)\">Markdown supported<\u002Fspan>\n<span style=\"flex:1\"><\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ addComment }}\" style=\"{{ commentBtn }}\" style-hover=\"background:#fff\"><i data-lucide=\"send\" style=\"width:14px;height:14px\"><\u002Fi>Comment<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fmain>\n\n<aside style=\"width:308px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;gap:0;padding:28px 20px 40px;border-left:1px solid oklch(1 0 0 / 10%);background:oklch(0.205 0 0 / 30%);overflow:auto\">\n\n<sc-if value=\"{{ timerOn }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:18px;border-radius:10px;background:oklch(0.205 0 0);box-shadow:inset 0 0 0 1px oklch(1 0 0 / 12%)\">\n<i data-lucide=\"clock\" style=\"width:15px;height:15px;color:oklch(0.708 0 0)\"><\u002Fi>\n<span style=\"flex:1;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums\">{{ timerLabel }}<\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleTimer }}\" style=\"{{ timerBtn }}\" style-hover=\"background:oklch(0.269 0 0)\"><i data-lucide=\"{{ timerIcon }}\" style=\"width:14px;height:14px\"><\u002Fi><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-for list=\"{{ props }}\" as=\"p\" hint-placeholder-count=\"10\">\n<div style=\"display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid oklch(1 0 0 / 8%)\">\n<span style=\"width:104px;flex:none;display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:oklch(0.708 0 0)\"><i data-lucide=\"{{ p.icon }}\" style=\"width:13px;height:13px\"><\u002Fi>{{ p.label }}<\u002Fspan>\n<span style=\"{{ p.valueStyle }}\">{{ p.value }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 0\">\n<span style=\"display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:9999px;background:oklch(0.269 0 0);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px\">chore<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:9999px;background:oklch(0.269 0 0);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px\">ux<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:9999px;background:oklch(0.269 0 0);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px\">folios<\u002Fspan>\n<span style=\"display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:9999px;border:1px dashed oklch(1 0 0 / 18%);font-size:11.5px;color:oklch(0.708 0 0)\"><i data-lucide=\"plus\" style=\"width:11px;height:11px\"><\u002Fi>tag<\u002Fspan>\n<\u002Fdiv>\n\n<sc-if value=\"{{ reminderOn }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:20px;padding-top:16px;border-top:1px solid oklch(1 0 0 / 10%)\">\n<div style=\"display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:11.5px;color:oklch(0.708 0 0)\"><i data-lucide=\"bell-ring\" style=\"width:13px;height:13px\"><\u002Fi>Reminder<\u002Fdiv>\n<div style=\"display:flex;align-items:stretch;height:28px;padding:2px;border:1px solid oklch(1 0 0 / 10%);border-radius:8px;background:oklch(0.269 0 0 / 40%);font-size:12px\">\n<sc-for list=\"{{ reminders }}\" as=\"r\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ r.pick }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:7px;font-size:11.5px;color:oklch(0.708 0 0)\">{{ reminderNote }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"margin-top:20px;padding-top:16px;border-top:1px solid oklch(1 0 0 / 10%);display:flex;flex-direction:column;gap:6px\">\n<button type=\"button\" sc-camel-on-click=\"{{ noop }}\" style=\"{{ sideAction }}\" style-hover=\"background:oklch(0.269 0 0)\"><i data-lucide=\"copy\" style=\"width:14px;height:14px;color:oklch(0.708 0 0)\"><\u002Fi>Duplicate quest<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ noop }}\" style=\"{{ sideAction }}\" style-hover=\"background:oklch(0.269 0 0)\"><i data-lucide=\"archive\" style=\"width:14px;height:14px;color:oklch(0.708 0 0)\"><\u002Fi>Shelve<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ noop }}\" style=\"{{ sideActionDanger }}\" style-hover=\"background:oklch(0.704 0.191 22.216 / 14%)\"><i data-lucide=\"trash-2\" style=\"width:14px;height:14px\"><\u002Fi>Abandon<\u002Fbutton>\n<\u002Fdiv>\n<\u002Faside>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;new&quot;,&quot;accepted&quot;,&quot;completed&quot;,&quot;shelved&quot;],&quot;default&quot;:&quot;accepted&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Quest state&quot;},&quot;due&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;soon&quot;,&quot;overdue&quot;],&quot;default&quot;:&quot;soon&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Quest state&quot;},&quot;showTimer&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Project features&quot;},&quot;showReminder&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Project features&quot;}}\">\nconst G = \"oklch(0.708 0 0)\";\nconst CARD = \"oklch(0.205 0 0)\";\nconst RING = \"oklch(1 0 0 / 12%)\";\n\nconst OBJECTIVES = [\n  \"Delete FolioMetaBar.tsx and re-mount the edit toggle\",\n  \"Strip tags from the folio draft form and atoms\",\n  \"Drop the tag routes, MCP tool and export frontmatter\",\n  \"Remove folios.editor.tag.* from both locales\",\n];\n\nconst SEED_THREAD = [\n  { kind: \"event\", who: \"You\", what: \"created the quest from feedback #62\", when: \"2 days ago\", icon: \"sunrise\" },\n  { kind: \"comment\", who: \"marie\", what: \"commented\", when: \"2 days ago\", icon: \"user\",\n    body: \"The Move dialog worries me — losing the directory chip removes the only visible path to it for anyone who never opens the menubar. Worth a keyboard hint in the empty state?\" },\n  { kind: \"event\", who: \"You\", what: \"took the quest\", when: \"yesterday\", icon: \"signature\" },\n  { kind: \"comment\", who: \"You\", what: \"commented\", when: \"yesterday\", icon: \"user\",\n    body: \"folio.move is in the menubar under Folio → Move…, and ⌘⇧M is bound. I'll keep the chip's tooltip copy in the menubar item so the wording doesn't drift.\" },\n  { kind: \"event\", who: \"thomas\", what: \"completed the objective “Strip tags from the folio draft form and atoms”\", when: \"4 hours ago\", icon: \"check-square\" },\n];\n\nconst REMINDERS = [\"Off\", \"Daily\", \"Weekly\", \"Monthly\"];\n\nclass Component extends DCLogic {\n  state = {\n    done: [false, true, false, false],\n    filter: \"all\",\n    draft: \"\",\n    comments: [],\n    timerRunning: true,\n    seconds: 4 * 3600 + 12 * 60,\n    reminder: \"Weekly\",\n  };\n\n  componentDidMount() {\n    this.paint();\n    this.tick = setInterval(() => {\n      if (this.state.timerRunning) this.setState((s) => ({ seconds: s.seconds + 1 }));\n    }, 1000);\n  }\n  componentWillUnmount() { clearInterval(this.tick); }\n  componentDidUpdate() { this.paint(); }\n  paint() { if (window.lucide) window.lucide.createIcons(); }\n\n  fmt(total) {\n    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;\n    if (h > 0) return `${h}h ${m}m`;\n    if (m > 0) return `${m}m ${s}s`;\n    return `${s}s`;\n  }\n\n  renderVals() {\n    const status = this.props.status ?? \"accepted\";\n    const due = this.props.due ?? \"soon\";\n    const st = this.state;\n\n    const pill = (bg, ring, color) =>\n      `display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9999px;font-size:12px;font-weight:500;background:${bg};box-shadow:inset 0 0 0 1px ${ring};color:${color}`;\n\n    const statusMap = {\n      new: { label: \"New\", icon: \"circle-dashed\", style: pill(\"oklch(0.269 0 0)\", \"oklch(1 0 0 / 14%)\", \"oklch(0.985 0 0)\") },\n      accepted: { label: \"In progress\", icon: \"circle-dot\", style: pill(\"oklch(0.4 0.12 250 / 30%)\", \"oklch(0.68 0.16 245 / 45%)\", \"oklch(0.985 0 0)\") },\n      completed: { label: \"Completed\", icon: \"swords\", style: pill(\"oklch(0.4 0.12 150 / 28%)\", \"oklch(0.696 0.17 162 / 45%)\", \"oklch(0.985 0 0)\") },\n      shelved: { label: \"Shelved\", icon: \"archive\", style: pill(\"oklch(0.269 0 0)\", \"oklch(1 0 0 / 14%)\", G) },\n    };\n    const s = statusMap[status] ?? statusMap.accepted;\n\n    const dueMap = {\n      none: { label: \"No due date\", style: pill(\"transparent\", \"oklch(1 0 0 / 14%)\", G) },\n      soon: { label: \"Due Friday · in 2 days\", style: pill(\"oklch(0.4 0.09 70 / 20%)\", \"oklch(0.769 0.188 70.08 / 35%)\", \"oklch(0.985 0 0)\") },\n      overdue: { label: \"Overdue by 3 days\", style: pill(\"oklch(0.45 0.15 25 / 26%)\", \"oklch(0.704 0.191 22.216 / 50%)\", \"oklch(0.985 0 0)\") },\n    };\n    const d = dueMap[due] ?? dueMap.soon;\n\n    const primary =\n      status === \"new\" ? { label: \"Take the quest\", icon: \"signature\" }\n      : status === \"accepted\" ? { label: \"Complete\", icon: \"swords\" }\n      : status === \"shelved\" ? { label: \"Back in play\", icon: \"archive-restore\" }\n      : { label: \"Reopen\", icon: \"rotate-ccw\" };\n\n    const objDone = st.done.filter(Boolean).length;\n    const objectives = OBJECTIVES.map((title, i) => {\n      const done = st.done[i];\n      return {\n        title, done,\n        row: \"display:flex;align-items:center;gap:10px;padding:7px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left\",\n        box:\n          \"width:17px;height:17px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;\" +\n          (done ? \"background:oklch(0.922 0 0);border:1px solid oklch(0.922 0 0)\" : \"border:1px solid oklch(1 0 0 / 22%)\"),\n        text: done\n          ? \"font-size:13.5px;color:oklch(0.708 0 0);text-decoration:line-through\"\n          : \"font-size:13.5px\",\n        toggle: () => this.setState((prev) => {\n          const next = prev.done.slice();\n          next[i] = !next[i];\n          return { done: next };\n        }),\n      };\n    });\n\n    const mine = st.comments.map((c) => ({ kind: \"comment\", who: \"You\", what: \"commented\", when: \"just now\", icon: \"user\", body: c }));\n    const all = [...SEED_THREAD, ...mine];\n    const items = st.filter === \"comments\" ? all.filter((t) => t.kind === \"comment\") : all;\n\n    const thread = items.map((t) => ({\n      who: t.who,\n      what: t.what,\n      when: t.when,\n      icon: t.icon,\n      hasBody: !!t.body,\n      body: t.body ?? \"\",\n      wrap:\n        \"display:flex;gap:12px;padding:12px 0;border-bottom:1px solid oklch(1 0 0 / 8%)\" +\n        (t.kind === \"comment\" ? \"\" : \";opacity:0.86\"),\n      avatar:\n        \"width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:9999px;color:\" + G +\n        (t.kind === \"comment\" ? \";background:oklch(0.269 0 0)\" : \";box-shadow:inset 0 0 0 1px oklch(1 0 0 / 14%)\"),\n      bodyStyle:\n        \"margin-top:8px;padding:11px 13px;border-radius:10px;background:\" + CARD +\n        \";box-shadow:inset 0 0 0 1px \" + RING + \";font-size:13.5px;line-height:1.65\",\n    }));\n\n    const seg = (active) =>\n      \"display:inline-flex;align-items:center;padding:0 10px;border:0;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;\" +\n      (active ? \"background:oklch(0.922 0 0);color:oklch(0.205 0 0)\" : \"background:transparent;color:\" + G);\n\n    const rowValue = \"flex:1;min-width:0;font-size:13px\";\n\n    const properties = [\n      { icon: \"circle-dot\", label: \"Status\", value: s.label },\n      { icon: \"user\", label: \"Assignee\", value: status === \"new\" ? \"Unassigned\" : \"You\" },\n      { icon: \"flame\", label: \"Priority\", value: \"Medium\" },\n      { icon: \"swords\", label: \"Rank\", value: \"B · difficulty 2 of 5\" },\n      { icon: \"hourglass\", label: \"Estimate\", value: \"~2h\" },\n      { icon: \"calendar-clock\", label: \"Due\", value: d.label },\n      { icon: \"map-pin\", label: \"Area\", value: \"Folios\" },\n      { icon: \"layers\", label: \"Epic\", value: \"#4 Folio simplification\" },\n      { icon: \"flag\", label: \"Milestone\", value: \"0.26.1\" },\n      { icon: \"link-2\", label: \"Questline\", value: \"blocked by #1204 · unlocks #1211\" },\n      { icon: \"book-open\", label: \"Folio\", value: \"Folio chrome audit (#88)\" },\n    ].map((p) => ({ ...p, valueStyle: rowValue }));\n\n    return {\n      nav: [\n        { icon: \"grid-3x3\", label: \"Quests\", count: \"15\", active: true },\n        { icon: \"layers\", label: \"Epics\", count: \"\", active: false },\n        { icon: \"bug\", label: \"Blights\", count: \"6\", active: false },\n        { icon: \"inbox\", label: \"Feedback\", count: \"\", active: false },\n        { icon: \"flag\", label: \"Milestones\", count: \"\", active: false },\n        { icon: \"book-open\", label: \"Folios\", count: \"\", active: false },\n        { icon: \"bar-chart-3\", label: \"Reports\", count: \"\", active: false },\n      ].map((n) => ({\n        ...n,\n        style:\n          \"position:relative;display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;\" +\n          (n.active ? \"background:oklch(0.308 0 0)\" : \"color:\" + G),\n      })),\n\n      statusLabel: s.label, statusIcon: s.icon, statusPill: s.style,\n      dueLabel: d.label, duePill: d.style,\n      primaryLabel: primary.label, primaryIcon: primary.icon,\n      blocked: status !== \"completed\",\n\n      objectives, objDone, objTotal: OBJECTIVES.length,\n      objBar: `display:block;width:${Math.round((objDone / OBJECTIVES.length) * 100)}%;height:100%;background:oklch(0.922 0 0)`,\n\n      thread,\n      tabAll: seg(st.filter === \"all\"),\n      tabComments: seg(st.filter === \"comments\"),\n      showAll: () => this.setState({ filter: \"all\" }),\n      showComments: () => this.setState({ filter: \"comments\" }),\n\n      draft: st.draft,\n      onDraft: (e) => this.setState({ draft: e.target.value }),\n      addComment: () => {\n        const text = this.state.draft.trim();\n        if (!text) return;\n        this.setState((prev) => ({ comments: [...prev.comments, text], draft: \"\" }));\n      },\n\n      props: properties,\n\n      timerOn: (this.props.showTimer ?? true) && status === \"accepted\",\n      timerLabel: this.fmt(st.seconds),\n      timerIcon: st.timerRunning ? \"pause\" : \"play\",\n      toggleTimer: () => this.setState((prev) => ({ timerRunning: !prev.timerRunning })),\n      timerBtn:\n        \"display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:oklch(0.985 0 0);cursor:pointer\",\n\n      reminderOn: (this.props.showReminder ?? true) && status !== \"completed\",\n      reminders: REMINDERS.map((label) => ({\n        label,\n        style: seg(st.reminder === label) + \";flex:1;justify-content:center\",\n        pick: () => this.setState({ reminder: label }),\n      })),\n      reminderNote: st.reminder === \"Off\" ? \"No reminder set\" : `Next reminder in 5 days`,\n\n      primaryBtn:\n        \"display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-radius:9px;\" +\n        \"background:oklch(0.922 0 0);color:oklch(0.205 0 0);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap\",\n      ghostBtn:\n        \"display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid oklch(1 0 0 / 12%);border-radius:9px;\" +\n        \"background:transparent;font-size:13.5px;cursor:pointer;white-space:nowrap\",\n      iconBtn:\n        \"display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid oklch(1 0 0 / 12%);\" +\n        \"border-radius:9px;background:transparent;color:\" + G + \";cursor:pointer\",\n      commentBtn:\n        \"display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border:0;border-radius:9px;\" +\n        \"background:oklch(0.922 0 0);color:oklch(0.205 0 0);font-size:13px;font-weight:500;cursor:pointer\",\n      sideAction:\n        \"display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border:0;border-radius:8px;background:transparent;\" +\n        \"font-size:13px;cursor:pointer;text-align:left\",\n      sideActionDanger:\n        \"display:flex;align-items:center;gap:9px;height:32px;padding:0 9px;border:0;border-radius:8px;background:transparent;\" +\n        \"font-size:13px;color:oklch(0.704 0.191 22.216);cursor:pointer;text-align:left\",\n      noop: () => {},\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
