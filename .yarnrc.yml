checksumBehavior: throw

enableHardenedMode: true

# `@rolldown/plugin-babel` declares `rolldown` as a hard peer, but Vite 8 is
# rolldown-vite and always carries it in the tree; `alepha` loads the plugin
# lazily for the `reactCompiler` option and must not pin a second rolldown
# next to Vite's own.
packageExtensions:
    '@rolldown/plugin-babel@*':
        peerDependenciesMeta:
            rolldown:
                optional: true

enableScripts: false

enableTelemetry: false

nodeLinker: node-modules
