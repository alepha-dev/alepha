checksumBehavior: throw

# `enableHardenedMode` is deliberately NOT set here.
#
# It is Yarn's defence against a poisoned lockfile in a pull request from a
# FORK, and Yarn turns it on by itself in exactly that case. Forcing it to
# `true` turned it on for every install instead, including local dev, which
# sends each one to the registry to re-resolve the whole lockfile.
#
# That traffic is what Yarn's `onCancel` crash rides on: a registry request
# that errors after its promise settled schedules a retry on a timer, the
# retry attaches a cancel handler to the settled promise, and the throw from
# inside the timer kills the process. Seventeen jobs per Verify run, each
# resolving the whole tree, gave the race seventeen chances; it cost at least
# six jobs, three of them on main, and a red job on main skips the Lore deploy.
#
# Measured on 2026-09-20: this repository is public with zero forks, and no
# pull request has ever come from one (every PR to date is same-repo or
# dependabot). So the forced flag has never protected anything here. Leaving
# it unset keeps the protection precisely where it was designed to apply.
enableScripts: false

enableTelemetry: false

nodeLinker: node-modules
