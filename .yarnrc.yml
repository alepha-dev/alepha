# Use a classic node_modules layout instead of Yarn PnP.
# Trades PnP's strict isolation for broad tooling compatibility
# (Vite, Vitest, TS, React Native, etc.).
nodeLinker: node-modules

# Disable lifecycle scripts (postinstall/preinstall/prepare) globally.
# This is the main supply-chain attack surface for npm packages.
# Packages that genuinely need to build native code must opt-in
# explicitly via `dependenciesMeta.<name>.built: true` in their
# parent package.json.
enableScripts: false

# Validate the lockfile against the remote registry on install.
# Catches tampered lockfiles and packages whose published content
# no longer matches what we resolved. Slightly slower installs.
enableHardenedMode: true

# Refuse to silently fix a checksum mismatch — fail loudly instead.
# Protects against corrupted cache entries and registry tampering.
checksumBehavior: throw

# Opt out of Yarn's anonymous usage telemetry.
enableTelemetry: false
