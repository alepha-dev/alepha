<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Alepha</title>
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<script>
		// Prevent flash of incorrect theme by setting it before CSS loads
		(() => {
			var stored = localStorage.getItem('alepha-docs-mode');
			var theme = stored === 'light' || stored === 'dark'
				? stored
				: window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
					? 'light'
					: 'dark';
			document.documentElement.setAttribute('data-theme', theme);
		})();
	</script>
	<link rel="stylesheet" href="/src/styles.css"/>

	<meta name="description" content="Alepha is a TypeScript-first framework with React SSR, schema validation, and modern backend tools." />

	<!-- Canonical -->
	<link rel="canonical" href="https://alepha.dev/" />

	<!-- OpenGraph for social share -->
	<meta property="og:type" content="website" />
	<meta property="og:url" content="https://alepha.dev/" />
	<meta property="og:title" content="Alepha Framework" />
	<meta property="og:description" content="A TypeScript-first framework with React SSR, schema validation, and modern backend tools." />
	<meta property="og:image" content="https://alepha.dev/favicon.png" />

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:url" content="https://alepha.dev/" />
	<meta name="twitter:title" content="Alepha Framework" />
	<meta name="twitter:description" content="A TypeScript-first framework with React SSR, schema validation, and modern backend tools." />
	<meta name="twitter:image" content="https://alepha.dev/favicon.png" />

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="/favicon.png" />
</head>
<body>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
