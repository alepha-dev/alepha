name: Deploy Framework

permissions:
  contents: read

# ---------------------------------------------------------------------------
# The framework's deploys: the showcase at ui.alepha.dev and the shop demo at
# shop.alepha.dev. "Deploy latest" (`deploy-latest.yml`) until #Q2946.
#
# The deploy half, split out of `ci.yml` on 2026-09-09. `verify-framework.yml`
# (workflow "Verify Framework") is the other half and this file is downstream
# of it: nothing here decides whether the code is good, only where it goes.
#
# By hand, `gh workflow run deploy-framework.yml --ref main`, or through
# `deploy-all.yml`, it ships `main` as it stands without waiting for Verify
# Framework: for a redeploy, or a hotfix whose branch was already green. A
# dispatch from any other ref is skipped.
#
# **Why a second file at all.** An agent works in a worktree, pushes a
# `claude/**` branch and watches CI. When the deploys lived in the same
# workflow they still ran as jobs and were skipped by an `if:` - correct, but
# four grey nodes on every branch run, and one edit away from not being
# skipped. Downstream, with the branch filter below, no run is created at all
# unless Verify Framework ran on main.
#
# ⚠️ **Four things about `workflow_run` that are not obvious. Two of them have
# already cost this repository a silent missed deploy, a third would have
# shipped a fork:**
#
#  1. It fires on FAILURE as well as success. Every job below checks
#     `conclusion == 'success'` itself; there is no workflow-level gate.
#  2. `github.ref` is the DEFAULT BRANCH, not the branch that ran. Never gate
#     on it and never check out from it - use `workflow_run.head_branch` and
#     `workflow_run.head_sha`, which is what every job below does.
#  3. The file that runs is always the DEFAULT BRANCH's copy of this one. That
#     is a feature: deploy logic cannot be edited from a branch, so a branch
#     cannot teach itself to deploy.
#  4. `head_branch` is a branch NAME, and a fork can have one called `main`.
#     Verify Framework runs on `pull_request`, fork PRs included, so a green
#     fork PR from its own `main` passed the branch checks alone and would
#     have deployed the fork's `head_sha` with this repository's secrets
#     (#Q2946). Every job below also requires the run to come from this
#     repository, and from a push or a dispatch (Release starts one on
#     `main` after its push, #Q2948), never a PR.
#
# ⚠️ **Per-deploy gating could not survive the split.** A `workflow_run` gate
# is atomic - Verify Framework passed or it did not. ui and shop used to need only
# `[checks, test]` and could ship while e2e was still running. They now wait
# for all of Verify Framework, which costs them a minute or two and is arguably more
# honest.
#
# ⚠️ **The docs at `alepha.dev` are not deployed from here (#Q2480).** They
# document the framework, and a project installs the last npm version, not
# `main`. A site that moved with every push described APIs nobody could
# install yet, so `release.yml` deploys it, with the version it publishes.
# ---------------------------------------------------------------------------
on:
  workflow_run:
    # By NAME: renaming Verify Framework without this line stops every deploy,
    # silently. A run called by `verify-all.yml` is filed under "Verify All"
    # and never lands here.
    workflows: ["Verify Framework"]
    types:
      - completed
    # ⚠️ This filter reads the head branch of the TRIGGERING run, not
    # `github.ref` (which point 2 above says is always the default branch). It
    # is the only place `workflow_run` will tell you the real branch before a
    # run exists, and that is the point: without it every `claude/**` push
    # created a deploy run that skipped all four jobs in four seconds,
    # filed under `main` because of point 2, and left a grey line in the run
    # list next to the Verify run it belonged to. Those runs decided nothing.
    # With it, no run is created at all.
    #
    # The `head_branch == 'main'` checks on the jobs below stay. They are not
    # redundant: the filter keeps the history clean, the job conditions keep
    # the deploy correct, and only one of them survives someone adding a
    # second trigger to this block.
    branches:
      - main
  workflow_dispatch:
  # `deploy-all.yml`. A called run sees the caller's event, `workflow_dispatch`,
  # and its ref, so the dispatch half of each job's gate covers it.
  workflow_call:

concurrency:
  # ⚠️ Keyed on the HEAD BRANCH, never on `github.ref` - see point 2 above.
  # `github.ref` is the default branch for every `workflow_run`, so a group
  # built from it would put every branch's deploy in one bucket and cancel
  # them against each other.
  # A dispatch has no `workflow_run`, and falls back to the ref it ran on; both
  # land in `deploy-framework-main`, so a hand deploy queues behind an
  # automatic one rather than racing it.
  group: deploy-framework-${{ github.event.workflow_run.head_branch || github.ref_name }}
  # Deliberately NOT cancel-in-progress. A deploy that is halfway through
  # `deploy` has already run migrations; cancelling it leaves the
  # database ahead of the Worker. A superseded deploy is wasteful, an
  # interrupted one is a broken production.
  cancel-in-progress: false

# Where a `lore` command in this workflow would report, named once so no step
# can forget. None runs here since Lore's own deploy left with Lore for
# github.com/alepha-dev/lore (#E72); the variable stays so this file,
# `verify-framework.yml` and `release.yml` keep naming the same project.
#
# It used to come from `lore({ project: "alepha" })` in `alepha.config.ts`,
# which meant it came from whichever directory a step happened to run in.
# Lore's own config named no project, so its artifact push died on
# `No Lore project named`, `continue-on-error` swallowed it, and the 0.28.0
# release shipped green without Lore's own artifact. A workflow-level default
# is the shape that cannot do that again.
#
# Not a secret: a project slug is in every URL Lore serves. `LORE_API_KEY` is
# the secret, and it stays on the individual steps that need it.
env:
  LORE_PROJECT: alepha

# Every `run` step works inside `framework/`: the repository holds the
# framework, Lore and Bay side by side (#Q2765), and this workflow is the
# framework's. A step's own `working-directory` is relative to the repository
# root, so it names `framework/` too.
defaults:
  run:
    working-directory: framework

jobs:
  # ---------------------------------------------------------------------------
  # The component showcase at `ui.alepha.dev`, and the shop demo at
  # `shop.alepha.dev`, deployed with `alepha deploy` through Lore (#Q2778),
  # the way `docs.yml` deploys `alepha.dev`.
  #
  # Each app's `lore({ project: "alepha", estate: "cf-feunard" })` deploys its
  # copy (`ui/production`, `shop/production`) in Lore project `alepha`, and
  # Lore names the Worker `alepha-<app>-production`, the one `cloudflare()`
  # deployed before (#Q2576), so it is taken over in place. Lore holds the
  # Cloudflare credential (the estate), so the job needs `LORE_API_KEY` alone,
  # a repository secret. Each app's own secrets live in its GitHub environment,
  # reach `alepha deploy` through the job env, and are sealed into the copy
  # before the run starts.
  # ---------------------------------------------------------------------------
  deploy-ui-production:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
      || (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ui-production

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # Copy `ui/production`, Worker `alepha-ui-production` (#Q2778).
      - name: Deploy
        working-directory: framework/apps/ui
        run: yarn alepha deploy --env production
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

  deploy-shop-production:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.head_branch == 'main'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event))
      || (github.event_name == 'workflow_dispatch'
        && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: shop-production

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # A demo: its data is disposable. Secrets come from the `shop-production`
      # environment; `deploy` reads each key the build manifest declares from
      # the job env and seals it into copy `shop/production` (#Q2778).
      - name: Deploy
        working-directory: framework/apps/examples/shop
        run: yarn alepha deploy --env production
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
