name: Docs

permissions:
  contents: read

# alepha.dev: the site in `docs/`, documenting the three products from their
# own folders (#Q2766). Its checks run on any change to the site or to a
# product's pages; the deploy runs on `main` only.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "framework/docs/**"
      - "lore/docs/**"
      - "bay/docs/**"
      - ".github/workflows/docs.yml"
      - ".github/actions/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".nvmrc"
  # Every pull request into main, with no `paths` filter (#Q3633): `gate`
  # below is a required check, and a workflow a `paths` filter skips never
  # reports one, which leaves the pull request waiting forever. The `changes`
  # job applies the same list instead, and skips the real jobs when the pull
  # request touches none of it. A pull request is how every change reaches
  # main, so a branch push alone runs nothing: `push` is for main only.
  pull_request:
    branches:
      - main
  # A hand-run rebuild of alepha.dev from `main`, pinned like the push one.
  workflow_dispatch:
  # `deploy-all.yml`. A called run sees the caller's event, `workflow_dispatch`,
  # and its ref, so the `deploy` job's gate covers it.
  workflow_call:

concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LORE_PROJECT: alepha

# Every `run` step works inside `docs/`. A step's own `working-directory` is
# relative to the repository root.
defaults:
  run:
    working-directory: docs

jobs:
  # Whether this pull request touches this workflow's part of the tree (#Q3633).
  # Any other event runs everything. The list is the `push` trigger's `paths`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(docs/|framework/docs/|lore/docs/|bay/docs/|\.github/workflows/docs\.yml$|\.github/actions/|package\.json$|yarn\.lock$|\.yarnrc\.yml$|\.nvmrc$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No file of this workflow's part of the tree changed: its jobs skip."
          fi

  # The site as `main` has it, every section from the working tree: lint,
  # types, unit specs, the build and the end-to-end suite.
  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # `gen:docs` then `gen:tree`: the framework's generated reference and
      # the tree of all three products, which everything below reads.
      # `gen:tree` reads the changelog from the published Lore releases
      # (#Q3638). A fork's pull request has no secret, and builds the page
      # from the sample instead.
      - name: Prepare
        run: yarn copy
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

      - name: Lint Site
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Test Site
        run: yarn test

      - name: Build Site
        run: yarn build

      - name: Setup Playwright
        uses: ./.github/actions/playwright
        with:
          working-directory: docs

      - name: Run E2E Tests
        timeout-minutes: 15
        run: yarn e2e

  # alepha.dev from `main`, each section pinned to how its product ships:
  # the framework and Bay at the latest release tag (one tag for both,
  # #Q2776), Lore at `main`. So a Lore page fix ships now, and an unreleased
  # framework or Bay page does not. `release.yml`
  # deploys the same way at each framework release.
  deploy:
    needs: check
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags and their history, for the pinned checkout and
          # each page's last-modified date.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Pin the released docs at the latest release tag
        run: yarn pin

      # `gen:tree` reads the pinned checkout through DOCS_RELEASE_ROOT;
      # `gen:llms` follows every build, which does not write the llms.txt
      # files itself.
      - name: Build for workerd
        env:
          DOCS_RELEASE_ROOT: docs/.content/release
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
        run: |
          yarn alepha gen:tree
          yarn alepha build --runtime=workerd
          yarn alepha gen:llms

      - name: Deploy docs
        run: yarn alepha deploy --env production --prebuilt
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

  # latest.alepha.dev from `main`, with no pin: every section is the working
  # tree, for projects that vendor Alepha rather than install a release
  # (#Q3028). ⚠️ It shares `docs-deploy` with the job above because Lore keeps
  # one `latest` tag per app: two deploys at once could ship one build to the
  # other's copy.
  deploy-latest:
    needs: check
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Each page's last-modified date.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build for workerd
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          PUBLIC_URL: https://latest.alepha.dev
          VITE_DOCS_SITE: latest
        run: |
          yarn alepha gen:tree
          yarn alepha build --runtime=workerd
          yarn alepha gen:llms

      - name: Deploy docs
        run: yarn alepha deploy --env latest --prebuilt
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

  # The one check the `main` ruleset requires of this workflow (#Q3633). It
  # always runs, so a pull request that skipped every job still reports, and
  # it fails when any job failed or was cancelled. A skipped job is a pass.
  gate:
    name: gate (docs)
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled." >&2
          exit 1
      - run: echo "Green."
