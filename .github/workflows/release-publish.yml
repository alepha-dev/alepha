name: Release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: 'minor'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: yarn

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build
        run: yarn build

      - name: Convert to JavaScript
        run: yarn convert js

      - name: Copy agent templates
        run: |
          cp packages/alepha/assets/agents-template.md packages/alepha/CLAUDE.md
          cp packages/alepha/assets/agents-template.md packages/alepha/AGENTS.md

      - name: Publish to NPM
        run: |
          yarn workspaces foreach --no-private -Apt exec npm publish --access=public
