name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Without this, the only CI run that ever happens is the one on `main` - the
  # same event that deploys Lore to production, so a branch could only be
  # proven green by shipping it. PRs get test/e2e/bay; the deploys opt out.
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

concurrency:
  # `workflow_run` runs get a group of their own, and that separation is the
  # whole point of this expression.
  #
  # `github.ref` for a `workflow_run` event is the DEFAULT BRANCH, so a Release
  # completing resolved to `ci-refs/heads/main` - the same group a push to main
  # uses. With `cancel-in-progress`, the Release follow-up then cancelled the
  # push run still mid-test, and that push run is the only one carrying
  # `deploy-lore-production`. Lore silently did not ship, and the evidence was
  # a run marked `cancelled` that looks exactly like "a newer push superseded
  # this one".
  #
  # Keyed on `head_branch` rather than a constant so two Releases in a row
  # still supersede each other.
  #
  # One line, deliberately: a folded `>-` block keeps the newlines of any
  # more-indented continuation, so a "tidier" multi-line version smuggles
  # literal `\n` into the expression.
  group: ci-${{ github.event_name == 'workflow_run' && format('followup-{0}', github.event.workflow_run.head_branch) || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Checks + tests. What `yarn v` runs, minus the build and e2e half.
  #
  # Coverage is measured here rather than in a second job running the same
  # 850 files a second time. Instrumentation costs roughly two minutes on top
  # of the plain run, which is cheaper than the duplicate suite it replaces,
  # and it means one red X per broken test instead of two.
  # ──────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    # A hang detector, not a budget. Public-repo minutes are free and the
    # GitHub cap is 6 hours, so a generous number costs nothing while a tight
    # one costs a blocked deploy: a job killed on the timeout reports as the
    # failure the deploys gate on.
    timeout-minutes: 30
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

      emqx:
        image: emqx/emqx
        ports:
          - 11883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: i18n Catalog Check
        run: yarn check:i18n

      - name: DB Migrations Check
        run: yarn check:migrations

      - name: Conventions Check
        run: yarn check:conventions

      - name: Docs Check
        run: yarn check:docs

      # Writes coverage/coverage-summary.json and coverage/test-results.json.
      # Those paths are the convention the push step below reads; neither is
      # passed as an argument.
      - name: Test Project
        run: yarn alepha test --coverage

      - name: Test Bun Providers
        run: yarn test:bun

      # This repository is public and CI runs on `pull_request`. Fork PRs get
      # no secrets, so the push would fail on a missing LORE_API_KEY by
      # construction. Same guard `deploy-docs-production` uses.
      #
      # The credential is on THIS step only. A job-wide `env:` would put a
      # full-admin Lore key in the environment of the test run itself, which
      # executes every spec in the repository.
      - name: Push Coverage To Lore
        if: github.event_name != 'pull_request'
        run: yarn alepha lore quality push
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

  # ──────────────────────────────────────────────────────────────────────
  # Build + E2E. The long pole, and the half of `yarn v` the job above skips.
  # ──────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

      emqx:
        image: emqx/emqx
        ports:
          - 11883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build Project
        run: yarn build

      # Keyed on the exact Playwright version rather than on the lockfile: the
      # lockfile churns constantly in a monorepo this size, and a miss that
      # only costs a re-download is not worth taking on every dependency bump.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(yarn playwright --version | tr -d '\n' | sed 's/.* //')"
          [ -n "$version" ] || { echo "could not resolve the Playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # `--with-deps` is deliberately absent. On `ubuntu-latest` every shared
      # library chromium needs is already on the image; all the flag adds is
      # nine font packages, and it pays for them by putting `apt-get update`
      # against `azure.archive.ubuntu.com` on the critical path. On 2026-08-19
      # that mirror flapped and took the e2e job of three consecutive pushes
      # with it, at up to 12min per fetch, each run reported `cancelled` with
      # no test output and each skipping the Lore deploy.
      #
      # The suites render Latin text only and there is no screenshot
      # comparison anywhere, so nothing can observe a glyph. If a runner image
      # ever does drop a real chromium dependency the failure is a missing
      # `.so` at browser launch - restore the flag then, off the critical path.
      - name: Install Playwright
        timeout-minutes: 4
        run: yarn playwright install chromium

      # Bounded on the step, not just the job. Playwright's `globalTimeout`
      # covers the tests but not teardown, and teardown is where this hangs: a
      # failing run once printed its results and then sat five minutes holding
      # orphaned wrangler and browser processes until the job cap killed
      # everything, which reads as "CI is slow" rather than "two tests failed".
      - name: Run E2E Tests
        timeout-minutes: 20
        run: yarn e2e

      # Its own step: `e2e-cli` packs the workspace with `yarn pack` and
      # installs the tarball into a throwaway project, so a failure here means
      # a packaging bug rather than a UI one.
      - name: Run CLI E2E Tests
        timeout-minutes: 10
        run: yarn e2e-cli

  # ──────────────────────────────────────────────────────────────────────
  # Bay - the Go control plane. Nothing in the yarn pipeline compiles or tests
  # it, which is how a `.gitignore` pattern that swallowed the whole
  # `cmd/bay/` directory reached a commit unnoticed.
  #
  # Cross-compiles as well as builds: Bay is developed on macOS and only ever
  # runs on Linux, so a Linux-only compile error would otherwise surface on
  # the VPS rather than here.
  # ──────────────────────────────────────────────────────────────────────
  bay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/bay

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: apps/bay/go.mod
          cache-dependency-path: apps/bay/go.sum

      - name: Verify Formatting
        # `gofmt -l` lists misformatted files and exits 0 either way, so the
        # test has to be on its output.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile for the targets Bay actually runs on
        run: |
          for target in amd64 arm64; do
            echo "→ linux/$target"
            GOOS=linux GOARCH=$target CGO_ENABLED=0 go build -o /dev/null ./cmd/bay
          done

  # ---------------------------------------------------------------------------
  # Cloudflare Workers deploy of the docs at `alepha.dev`.
  #
  # This replaced a job that published the same `dist/public` to GitHub Pages.
  # Pages is gone as a target because it cannot host the one thing the site
  # needs: a same-origin `POST /api/sigil/ingest`, which is where the visitor's
  # IP becomes a salted hash and where the sigil credential stays instead of
  # shipping to every reader.
  #
  # The cutover was a Worker *Route* (`alepha.dev/*`), not a Custom Domain, so
  # the apex DNS records were never touched - see the `platform()` block in
  # `apps/docs/alepha.config.ts` for why, and for how to roll back.
  # ---------------------------------------------------------------------------
  deploy-docs-production:
    # Doesn't require e2e - only that the codebase is lint/typecheck-clean and
    # the tests pass.
    needs: [test]
    # Deploying is a real side effect, so it must not fire for a proposed
    # change. Phrased as "not a PR" rather than copying
    # `deploy-lore-production`'s `push && ref == main`: docs also deploy on the
    # `workflow_run` (Release) trigger, and that has to keep working.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes the app's own secrets to this job. Without it `secrets.SIGIL_*`
    # resolve to empty and the deploy pushes nothing - the worker keeps
    # whatever it had, so the failure is a config that silently stops tracking
    # `.env.production` rather than anything that goes red.
    environment: docs-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Delivered straight from `process.env` by the deploy, which reads the
      # app's `$env` declarations as the allowlist. Kept in the GitHub
      # environment by `alepha platform secrets apply`, because
      # `.env.production` is gitignored and CI has no other way to see them.
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
      SIGIL_CONFIG: ${{ secrets.SIGIL_CONFIG }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job's artifact is deployed, and `alepha.meta.version` reads
          # the git tag on the built commit. The default checkout fetches
          # shallow and passes --no-tags, so without this every deploy would
          # report "latest". The other jobs deploy nothing and need no tags.
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # Build and deploy are split on purpose. `gen:llms` writes `llms.txt`,
      # `llms-full.txt` and the raw markdown into `dist/public` *after* the
      # bundle, and `alepha platform up` cleans `dist/` before building - so
      # letting it build would delete them. Build first, fill `dist/public`,
      # then deploy with `--prebuilt`, which skips the bundle and only
      # regenerates `wrangler.jsonc` before uploading.
      - name: Build Documentation
        working-directory: apps/docs
        run: yarn alepha build -t cloudflare && yarn alepha gen:llms

      - name: Deploy
        working-directory: apps/docs
        run: yarn alepha platform up --env production --prebuilt

  deploy-lore-production:
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lore-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The key is the whole enrolment: it authorises the reporting and names
      # the project, so nothing has to be kept in sync with it. SIGIL_CONFIG is
      # optional switches, and SIGIL_SINK is unset because Lore reports to the
      # default sink, which is itself. Absent, the module goes inert rather
      # than failing, so a missing one here costs telemetry and nothing else.
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
      SIGIL_CONFIG: ${{ secrets.SIGIL_CONFIG }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same as the docs deploy: without the tags `alepha.meta.version`
          # reports "latest".
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy
        working-directory: apps/lore
        run: yarn alepha platform up --env production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # No SIGIL_SINK here on purpose. Lore IS the sink, and a Cloudflare
          # Worker cannot fetch its own hostname, so pointing Lore at an origin
          # would make every flush a failed subrequest. It still reports: the
          # key above enrols it, and `LoreSigilSinkProvider` routes its own
          # batches in process instead of over HTTP.
