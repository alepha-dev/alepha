  verify-windows:
    # Smoke-test the build/lint/typecheck/CLI flow on Windows.
    # `yarn test` is intentionally omitted: GitHub `services:` (Postgres, Redis,
    # S3-mock, EMQX) only attach on Linux runners, so the integration tests
    # that need those services would fail here. Linux already covers them.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enable Corepack
        run: |
          npm uninstall -g yarn
          corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check-dependencies

      - name: Build Project
        run: yarn build

      - name: Run CLI E2E Tests
        run: yarn e2e-cli
