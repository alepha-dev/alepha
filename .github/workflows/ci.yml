name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:

      redis:
        image: redis
        ports:
          - 6379:6379

      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 9090:9090

    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check-dependencies

      - name: Test Project
        run: yarn test
        env:
          VITEST_ARGS: --coverage --reporter=verbose --reporter=junit --outputFile=test-report.junit.xml

      - name: Build Project
        run: yarn build

      - name: Install Playwright
        run: yarn playwright install chromium --with-deps

      - name: Run E2E Tests
        run: yarn e2e

      - name: Run CLI E2E Tests
        run: yarn e2e-cli

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy-docs:
    needs: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      - name: Build Documentation
        run: cd apps/docs && yarn build && yarn alepha gen:llms

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: './apps/docs/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  deploy-roadmap:
    needs: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: roadmap-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy Roadmap
        run: yarn w roadmap alepha platform up --env production

        # Generated by alepha — environment: roadmap-production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          POSTGRES_SCHEMA: ${{ secrets.POSTGRES_SCHEMA }}

          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Git Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: |
          npm uninstall -g yarn
          corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check-dependencies

      - name: Build Project
        run: yarn build

      - name: Run CLI E2E Tests
        run: yarn e2e-cli
