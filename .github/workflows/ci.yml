name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Fast checks — lint, typecheck, dep / i18n / migration audits.
  # No services needed. Runs in parallel with `test` and `e2e`.
  # ──────────────────────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: i18n Catalog Check
        run: yarn check:i18n

      - name: DB Migrations Check
        run: yarn check:migrations

  # ──────────────────────────────────────────────────────────────────────
  # Unit + integration tests (Vitest, Bun providers).
  # Needs services for the integration tests that hit real backends.
  # ──────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:

      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Test Project
        run: yarn test

      - name: Test Bun Providers
        run: yarn test:bun

  # ──────────────────────────────────────────────────────────────────────
  # Build + E2E. The long pole.
  # ──────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:

      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build Project
        run: yarn build

      - name: Install Playwright
        run: yarn playwright install chromium --with-deps

      - name: Run E2E Tests
        run: yarn e2e

      - name: Run CLI E2E Tests
        run: yarn e2e-cli

  deploy-docs:
    # Docs deploy doesn't require the e2e job — only that the codebase
    # is lint/typecheck-clean and tests pass.
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      - name: Build Documentation
        run: cd apps/docs && yarn build && yarn alepha gen:llms

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './apps/docs/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  deploy-lore-production:
    needs: [checks, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lore-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy
        working-directory: apps/lore
        run: yarn alepha platform up --env production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
