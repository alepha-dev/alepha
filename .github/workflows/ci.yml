name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Without this, the only CI run that ever happens is the one on `main` - the
  # same event that deploys Lore to production, so a branch could only be
  # proven green by shipping it. PRs get test/e2e/bay; the deploys opt out.
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

concurrency:
  # Namespaced by event, because `github.ref` for a `workflow_run` is the
  # DEFAULT BRANCH: a Release follow-up used to land in the push-to-main group
  # and cancel that run mid-test, and the push run is the only one carrying
  # `deploy-lore-production`. Lore silently did not ship, and the evidence was
  # a run marked `cancelled` that reads exactly like "superseded by a newer
  # push". Two Releases in a row still supersede each other: both land in the
  # `workflow_run` group, on the same ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Where every `lore` command in this workflow reports, named once so no step
# can forget. A step that means to push somewhere else passes `--project`, and
# exactly one does.
#
# It used to come from `lore({ project: "alepha" })` in `alepha.config.ts`,
# which meant it came from whichever directory a step happened to run in.
# `apps/lore`'s config named no project, so its artifact push died on
# `No Lore project named`, `continue-on-error` swallowed it, and the 0.28.0
# release shipped green without Lore's own artifact. A workflow-level default
# is the shape that cannot do that again.
#
# Not a secret: a project slug is in every URL Lore serves. `LORE_API_KEY` is
# the secret, and it stays on the individual steps that need it.
env:
  LORE_PROJECT: alepha

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # The `yarn v` pipeline, minus its build and e2e half - which is the job
  # below. Named to match: a red `verify` here is the same red you would
  # have got locally.
  #
  # Coverage is measured here rather than in a second job running the same
  # 850 files a second time. Instrumentation costs roughly two minutes on top
  # of the plain run, which is cheaper than the duplicate suite it replaces,
  # and it means one red X per broken test instead of two.
  # ──────────────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    # A hang detector, not a budget. Public-repo minutes are free and the
    # GitHub cap is 6 hours, so a generous number costs nothing while a tight
    # one costs a blocked deploy: a job killed on the timeout reports as the
    # failure the deploys gate on.
    timeout-minutes: 30
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: i18n Catalog Check
        run: yarn check:i18n

      - name: DB Migrations Check
        run: yarn check:migrations

      - name: Conventions Check
        run: yarn check:conventions

      - name: Docs Check
        run: yarn check:docs

      # Writes coverage/coverage-summary.json and coverage/test-results.json.
      # Those paths are the convention the push step below reads; neither is
      # passed as an argument.
      - name: Test Project
        run: yarn alepha test --coverage

      - name: Test Bun Providers
        run: yarn test:bun

      # This repository is public and CI runs on `pull_request`. Fork PRs get
      # no secrets, so the push would fail on a missing LORE_API_KEY by
      # construction. Same guard `deploy-docs-production` uses.
      #
      # The credential is on THIS step only. A job-wide `env:` would put a
      # full-admin Lore key in the environment of the test run itself, which
      # executes every spec in the repository.
      # Never fatal. This step RECORDS what landed; it must not decide what
      # lands, and it is the last step of the job both deploys gate on.
      #
      # It deadlocked exactly once, which is what this line is for: the push
      # calls `pushQualityRun` on the deployed Lore, that endpoint ships with
      # Lore, and Lore ships from `deploy-lore-production` - which needs this
      # job green. A missing endpoint failed the push, the push failed the job,
      # the job skipped the deploy, and the deploy was the only thing that
      # could have created the endpoint. Nothing in the loop could break it.
      #
      # A failure now shows as a warning annotation on an otherwise green run.
      - name: Push Coverage To Lore
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: yarn lore quality push
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

  # ──────────────────────────────────────────────────────────────────────
  # Build + E2E. The long pole, and the half of `yarn v` the job above skips.
  # ──────────────────────────────────────────────────────────────────────
  # No service containers, deliberately. Only `vitest.config.ts` points at
  # them, and that is `verify` above: every app this job builds is SQLite or
  # nothing (shop injects `:memory:`, lore and docs inject no
  # `DATABASE_URL` at all, and `alepha/orm` picks SQLite unless the URL starts
  # with `d1:`). Nothing here references REDIS_URL or S3_ENDPOINT, and
  # `node dist` does not read `.env`, so the containers were unreachable
  # rather than merely unused.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build Project
        run: yarn build

      # Keyed on the exact Playwright version rather than on the lockfile: the
      # lockfile churns constantly in a monorepo this size, and a miss that
      # only costs a re-download is not worth taking on every dependency bump.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(yarn playwright --version | tr -d '\n' | sed 's/.* //')"
          [ -n "$version" ] || { echo "could not resolve the Playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # `--with-deps` is deliberately absent. On `ubuntu-latest` every shared
      # library chromium needs is already on the image; all the flag adds is
      # nine font packages, and it pays for them by putting `apt-get update`
      # against `azure.archive.ubuntu.com` on the critical path. On 2026-08-19
      # that mirror flapped and took the e2e job of three consecutive pushes
      # with it, at up to 12min per fetch, each run reported `cancelled` with
      # no test output and each skipping the Lore deploy.
      #
      # The suites render Latin text only and there is no screenshot
      # comparison anywhere, so nothing can observe a glyph. If a runner image
      # ever does drop a real chromium dependency the failure is a missing
      # `.so` at browser launch - restore the flag then, off the critical path.
      - name: Install Playwright
        timeout-minutes: 4
        run: yarn playwright install chromium

      # Bounded on the step, not just the job. Playwright's `globalTimeout`
      # covers the tests but not teardown, and teardown is where this hangs: a
      # failing run once printed its results and then sat five minutes holding
      # orphaned wrangler and browser processes until the job cap killed
      # everything, which reads as "CI is slow" rather than "two tests failed".
      - name: Run E2E Tests
        timeout-minutes: 20
        run: yarn e2e

      # The Bay end-to-end in e2e-cli builds the real bay binary natively
      # (apps/e2e-cli/src/bay.e2e.spec.ts) and fails loudly without go, on
      # purpose: a skipped Go test is how a green run lies. The bay job has Go
      # and no Node, this one has Node and no Go, so Go is added here.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/bay/go.mod
          cache-dependency-path: apps/bay/go.sum

      # Its own step: `e2e-cli` packs the workspace with `yarn pack` and
      # installs the tarball into a throwaway project, so a failure here means
      # a packaging bug rather than a UI one.
      - name: Run CLI E2E Tests
        timeout-minutes: 10
        run: yarn e2e-cli

      # ────────────────────────────────────────────────────────────────
      # Build in, artifact out. `yarn build` above already produced
      # `apps/lore/dist`, so this packs it and stores it in the project's
      # registry: `lore artifacts push` packs the workspace itself
      # rather than requiring a separate step, because a tarball on disk and
      # the build in `dist/` can differ and the push would happily ship the
      # older one.
      #
      # ⚠️ **Lore does not build.** The registry is a place to keep an
      # artifact, not a builder: no git clone, no install, no build step on
      # the far side. GitHub Actions already does that well and for free, and
      # duplicating it would mean per-project repo credentials, dependency
      # caching and an unbounded cost surface. See folio #73.
      #
      # ⚠️ **This is deliberately NOT in `deploy-lore-production`.** That job's
      # value is its `needs: [verify, e2e]` gate on an app that ships to
      # production with no human in the loop, and Lore deploying itself
      # THROUGH Lore is circular: a release that boots broken takes out the
      # only way to repair it. This runs alongside and places nothing.
      #
      # The artifact is therefore the `node` build this job already made, not
      # the workerd bundle `platform up` produces. Its manifest says so, which
      # is the whole reason the runtime is read from the manifest and never
      # from a flag or a filename.
      #
      # ⚠️ `vars.LORE_ARTIFACT_PROJECT` gates it, and the gate is the point.
      # The step ships INERT: set the variable to a throwaway project, watch a
      # run land, and only then point it at a real one. It is also the ONLY
      # step in this workflow that overrides the `LORE_PROJECT` default, and
      # it has to: the whole idea is that this artifact lands somewhere
      # disposable until it is proven. That is quest #1202's
      # "prove it on a throwaway project before any real one" expressed as a
      # property of the workflow rather than as a note somebody has to
      # remember.
      #
      # `continue-on-error` and skipped on pull requests, like the coverage
      # push above and for the same reason: a red push is a warning annotation
      # that blocks no deploy and reddens no fork PR. The secret is passed
      # through `env` and never echoed - the command prints the digest, not
      # the credential.
      #
      # Tagged `latest`, which replaces in place and IS the retention policy:
      # one row and one stored object per app, with no sweep job. A per-commit
      # tag is deliberately absent - every tag but `latest` is write-once, so
      # tagging each commit would keep every build ever made, which is exactly
      # the "keep everything" degeneration quest #1518 was written to end. The
      # commit is recorded ON the row instead, and the push writes the sha256
      # to `$GITHUB_OUTPUT` for a later step that means to pin these exact
      # bytes. A version tag belongs on a release, not on a commit.
      - name: Push Artifact To Lore
        if: github.event_name != 'pull_request' && vars.LORE_ARTIFACT_PROJECT != ''
        continue-on-error: true
        working-directory: apps/lore
        run: >-
          yarn lore artifacts push
          --project "$LORE_ARTIFACT_PROJECT"
          --app lore
          --tag latest
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          LORE_ARTIFACT_PROJECT: ${{ vars.LORE_ARTIFACT_PROJECT }}

  # ──────────────────────────────────────────────────────────────────────
  # The self-hosted Lore image. `docker run -p 3000:3000 -v lore:/data <image>`
  # is the whole promise of that image, and nothing in `yarn v` exercises it:
  # a build producing an image that cannot boot is exactly as green as one
  # that works.
  #
  # Here rather than in the Release workflow, because the release only builds
  # the image when someone dispatches it and the push step sits AFTER
  # `npm publish` - so a broken Dockerfile would be found on release day, past
  # the irreversible half of the pipeline. Here rather than in `e2e-cli`,
  # because that runs inside `yarn v` and a docker build does not fit the
  # 10-minute budget. The runners already have a docker daemon (the `verify`
  # job's `services:` need one) and public-repo minutes are free.
  #
  # ⚠️ **`deploy-lore-production` deliberately does NOT gate on this job.**
  # That job ships a Cloudflare Worker and touches nothing this one builds, so
  # adding it to `needs` would let a docker flake or a slow image build block a
  # production deploy with no relationship to the image. "The deploys gate on
  # everything else" is the obvious assumption; this is the exception, on
  # purpose.
  # ──────────────────────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # `alepha build --target=docker --image`: the bundle, the generated
      # Dockerfile and `docker build` in one step, with the tag and the OCI
      # labels coming from `apps/lore/alepha.config.ts`.
      - name: Build the image
        run: yarn w lore build:docker

      - name: Smoke test the image
        run: bash scripts/docker-smoke.sh

      # ⚠️ Both are needed by the size check below, and by nothing else here.
      # The generated Dockerfile is not RUN-free: `mkdir -p /data && chown`
      # prepares the volume, so building for the other architecture executes
      # a shell command under emulation and needs the binfmt handlers.
      # `setup-buildx` is separately required because the default `docker`
      # driver refuses a multi-platform build outright.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Builds BOTH architectures, which is the only place outside a
      # dispatched Release where the multi-arch build the release performs is
      # exercised at all. The size gate rides along on the result.
      - name: Check the image size budget
        run: node scripts/docker-size.ts

  # ──────────────────────────────────────────────────────────────────────
  # Bay - the Go control plane. Nothing in the yarn pipeline compiles or tests
  # it, which is how a `.gitignore` pattern that swallowed the whole
  # `cmd/bay/` directory reached a commit unnoticed.
  #
  # Cross-compiles as well as builds: Bay is developed on macOS and only ever
  # runs on Linux, so a Linux-only compile error would otherwise surface on
  # the VPS rather than here.
  # ──────────────────────────────────────────────────────────────────────
  bay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/bay

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: apps/bay/go.mod
          cache-dependency-path: apps/bay/go.sum

      - name: Verify Formatting
        # `gofmt -l` lists misformatted files and exits 0 either way, so the
        # test has to be on its output.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile for the targets Bay actually runs on
        run: |
          for target in amd64 arm64; do
            echo "→ linux/$target"
            GOOS=linux GOARCH=$target CGO_ENABLED=0 go build -o /dev/null ./cmd/bay
          done

  # ---------------------------------------------------------------------------
  # Cloudflare Workers deploy of the docs at `alepha.dev`.
  #
  # This replaced a job that published the same `dist/public` to GitHub Pages.
  # Pages is gone as a target because it cannot host the one thing the site
  # needs: a same-origin `POST /api/sigil/ingest`, which is where the visitor's
  # IP becomes a salted hash and where the sigil credential stays instead of
  # shipping to every reader.
  #
  # The cutover was a Worker *Route* (`alepha.dev/*`), not a Custom Domain, so
  # the apex DNS records were never touched - see the `platform()` block in
  # `apps/docs/alepha.config.ts` for why, and for how to roll back.
  # ---------------------------------------------------------------------------
  deploy-docs-production:
    # Doesn't require e2e - only that the codebase is lint/typecheck-clean and
    # the tests pass.
    needs: [verify]
    # Deploying is a real side effect, so it must not fire for a proposed
    # change. Phrased as "not a PR" rather than copying
    # `deploy-lore-production`'s `push && ref == main`: docs also deploy on the
    # `workflow_run` (Release) trigger, and that has to keep working.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes the app's own secrets to this job. Without it `secrets.SIGIL_*`
    # resolve to empty and the deploy pushes nothing - the worker keeps
    # whatever it had, so the failure is a config that silently stops tracking
    # `.env.production` rather than anything that goes red.
    environment: docs-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Delivered straight from `process.env` by the deploy, which reads the
      # app's `$env` declarations as the allowlist. Kept in the GitHub
      # environment by `alepha platform secrets apply`, because
      # `.env.production` is gitignored and CI has no other way to see them.
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
      SIGIL_CONFIG: ${{ secrets.SIGIL_CONFIG }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job's artifact is deployed, and `alepha.meta.version` reads
          # the git tag on the built commit. The default checkout fetches
          # shallow and passes --no-tags, so without this every deploy would
          # report "latest". The other jobs deploy nothing and need no tags.
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # Build and deploy are split on purpose. `gen:llms` writes `llms.txt`,
      # `llms-full.txt` and the raw markdown into `dist/public` *after* the
      # bundle, and `alepha platform up` cleans `dist/` before building - so
      # letting it build would delete them. Build first, fill `dist/public`,
      # then deploy with `--prebuilt`, which skips the bundle and only
      # regenerates `wrangler.jsonc` before uploading.
      - name: Build Documentation
        working-directory: apps/docs
        run: yarn alepha build -t cloudflare && yarn alepha gen:llms

      - name: Deploy
        working-directory: apps/docs
        run: yarn alepha platform up --env production --prebuilt

  # ---------------------------------------------------------------------------
  # Cloudflare Workers deploy of the component showcase at `ui.alepha.dev`.
  #
  # A Custom Domain rather than a Worker Route, which is the opposite of the
  # docs job above. Docs needs a Route because the apex still holds the GitHub
  # Pages A and AAAA records and a Custom Domain owns its DNS record, so
  # Cloudflare would refuse to create one without deleting those first.
  # `ui.alepha.dev` is a fresh subdomain with nothing to preserve, so the simpler
  # form applies and Cloudflare manages the record and the certificate. That
  # choice lives in `apps/ui/alepha.config.ts` as the ABSENCE of a `zone`.
  #
  # Gated on `verify` only, like docs and unlike Lore: the showcase has no
  # database, no auth and no migrations, so an e2e failure elsewhere in the
  # repository should not hold a documentation site.
  # ---------------------------------------------------------------------------
  deploy-ui-production:
    needs: [verify]
    # Deploying is a real side effect, so it must not fire for a proposed
    # change. Phrased as "not a PR" for the same reason the docs job is: this
    # also has to keep working on the `workflow_run` (Release) trigger.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes the app's own secrets to this job. Without it `secrets.SIGIL_*`
    # resolve to empty and the deploy pushes nothing - the worker keeps whatever
    # it had, so the failure is a site that silently stops reporting rather than
    # anything that goes red.
    environment: ui-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The key is the whole enrolment: it authorises the reporting and names
      # the project, so nothing has to be kept in sync with it. Absent, the
      # sigil module goes inert rather than failing, so a missing one here costs
      # telemetry and nothing else.
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
      SIGIL_CONFIG: ${{ secrets.SIGIL_CONFIG }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job's artifact is deployed, and `alepha.meta.version` reads the
          # git tag on the built commit. The default checkout fetches shallow
          # and passes --no-tags, so without this every deploy would report
          # "latest".
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # Built and deployed in one step, unlike the docs job. That one splits
      # them because `gen:llms` writes into `dist/public` after the bundle and
      # `platform up` cleans `dist/` before building; nothing writes into this
      # app's output after its build, so there is nothing to protect.
      - name: Deploy
        working-directory: apps/ui
        run: yarn alepha platform up --env production

  deploy-lore-production:
    needs: [verify, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lore-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The key is the whole enrolment: it authorises the reporting and names
      # the project, so nothing has to be kept in sync with it. SIGIL_CONFIG is
      # optional switches, and SIGIL_SINK is unset because Lore reports to the
      # default sink, which is itself. Absent, the module goes inert rather
      # than failing, so a missing one here costs telemetry and nothing else.
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
      SIGIL_CONFIG: ${{ secrets.SIGIL_CONFIG }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same as the docs deploy: without the tags `alepha.meta.version`
          # reports "latest".
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy
        working-directory: apps/lore
        run: yarn alepha platform up --env production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # No SIGIL_SINK here on purpose. Lore IS the sink, and a Cloudflare
          # Worker cannot fetch its own hostname, so pointing Lore at an origin
          # would make every flush a failed subrequest. It still reports: the
          # key above enrols it, and `LoreSigilSinkProvider` routes its own
          # batches in process instead of over HTTP.
