name: Build
permissions: write-all

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    services:

      redis:
        image: redis
        ports:
          - 6379:6379

      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 9090:9090

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check-dependencies

      - name: Test Project
        run: yarn test
        env:
          VITEST_ARGS: --coverage --reporter=verbose --reporter=junit --outputFile=test-report.junit.xml

      - name: Build Project
        run: yarn build

      - name: Install Playwright
        run: yarn playwright install chromium --with-deps

      - name: Run E2E Tests
        run: yarn e2e

      - name: Run CLI E2E Tests
        run: yarn e2e-cli

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  deploy-docs:
    needs: verify-linux
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn

      - name: Build Documentation
        run: cd apps/docs && yarn build && yarn alepha gen:llms
        env:
          UMAMI_URL: ${{ secrets.UMAMI_URL }}
          UMAMI_UUID: ${{ secrets.UMAMI_UUID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './apps/docs/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-roadmap:
    needs: verify-linux
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn

      - name: Build Roadmap
        run: yarn w @alepha/roadmap build

      - name: Deploy to Vercel
        run: cd apps/roadmap/dist && npx vercel --token ${{ secrets.VERCEL_TOKEN }} --prod

  verify-windows:
    runs-on: windows-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: |
          npm uninstall -g yarn
          corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn

      - name: Clean
        run: yarn clean

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check-dependencies

      - name: Build Project
        run: yarn build

      - name: Run CLI E2E Tests
        run: yarn e2e-cli

