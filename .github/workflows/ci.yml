name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Without this, the only CI run that ever happens is the one on `main` — the
  # same event that deploys Lore to production. Verification and deployment
  # were literally the same moment, so a branch could only be proven green by
  # shipping it. PRs get the full checks/test/bay/e2e matrix; the deploy jobs
  # opt out below.
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Fast checks — lint, typecheck, dep / i18n / migration audits.
  # No services needed. Runs in parallel with `test` and `e2e`.
  # ──────────────────────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: i18n Catalog Check
        run: yarn check:i18n

      - name: DB Migrations Check
        run: yarn check:migrations

  # ──────────────────────────────────────────────────────────────────────
  # Unit + integration tests (Vitest, Bun providers).
  # Needs services for the integration tests that hit real backends.
  # ──────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    # 12, not 8. The suite itself runs in ~4m30s, but `Setup` is 36s on a cache
    # hit and 2m20s on a miss — and every dependency bump is a miss, because the
    # lockfile is the cache key. At 8 the job had no room for that: the first
    # `chore(deps)` after this budget was set got cancelled mid-suite, which
    # reports as a cancelled run with no conclusion rather than as a failure.
    #
    # The number to watch is `Test Project`. If that alone approaches 8 minutes,
    # the suite has genuinely regressed and raising this again is the wrong move.
    timeout-minutes: 12
    services:

      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

      emqx:
        image: emqx/emqx
        ports:
          - 11883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Test Project
        run: yarn test

      - name: Test Bun Providers
        run: yarn test:bun

  # ──────────────────────────────────────────────────────────────────────
  # Bay — the Go control plane. Nothing in the yarn pipeline compiles or
  # tests it, which is how a `.gitignore` pattern that swallowed the whole
  # `cmd/bay/` directory reached a commit unnoticed: the working tree built
  # fine because the files were there.
  #
  # Cross-compiles as well as builds: Bay is developed on macOS and only ever
  # runs on Linux, so a Linux-only compile error would otherwise surface on
  # the VPS rather than here.
  # ──────────────────────────────────────────────────────────────────────
  bay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/bay

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: apps/bay/go.mod
          cache-dependency-path: apps/bay/go.sum

      - name: Verify Formatting
        # `gofmt -l` lists misformatted files and exits 0 either way, so the
        # test has to be on its output.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile for the targets Bay actually runs on
        run: |
          for target in amd64 arm64; do
            echo "→ linux/$target"
            GOOS=linux GOARCH=$target CGO_ENABLED=0 go build -o /dev/null ./cmd/bay
          done

  # ──────────────────────────────────────────────────────────────────────
  # Build + E2E. The long pole.
  # ──────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:

      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

      emqx:
        image: emqx/emqx
        ports:
          - 11883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build Project
        run: yarn build

      - name: Install Playwright
        run: yarn playwright install chromium --with-deps

      # Bounded on the step, not just the job. Playwright's `globalTimeout`
      # covers the tests; it does not cover teardown, and teardown is where
      # this hangs — a failing run once printed its results and then sat for
      # five minutes holding orphaned wrangler and browser processes until the
      # job cap killed everything. That reads as "CI is slow" rather than
      # "two tests failed", and it costs the whole remaining budget.
      #
      # Slightly under half the job's 15, so a hang is reported as a failed
      # step with the test output intact, and the CLI suite below still gets
      # its turn.
      - name: Run E2E Tests
        timeout-minutes: 7
        run: yarn e2e

      - name: Run CLI E2E Tests
        timeout-minutes: 5
        run: yarn e2e-cli

  deploy-docs:
    # Docs deploy doesn't require the e2e job — only that the codebase
    # is lint/typecheck-clean and tests pass.
    needs: [checks, test]
    # Publishing to GitHub Pages is a real side effect, so it must not fire for
    # a proposed change. Phrased as "not a PR" rather than copying
    # `deploy-lore-production`'s `push && ref == main`: docs also deploy on the
    # `workflow_run` (Release) trigger, and that has to keep working.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      - name: Build Documentation
        run: cd apps/docs && yarn build && yarn alepha gen:llms

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './apps/docs/dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  deploy-docs-cloudflare:
    # Runs alongside `deploy-docs`, not instead of it: `alepha.dev` stays on
    # GitHub Pages until `docs.alepha.dev` has proven itself, and the two
    # deploy the same commit from the same sources.
    needs: [checks, test]
    # Same condition as `deploy-docs` rather than lore's `push && ref == main`,
    # so the two docs deploys never diverge — including on the `workflow_run`
    # (Release) trigger.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # Build and deploy are split on purpose. `gen:llms` writes `llms.txt`,
      # `llms-full.txt` and the raw markdown into `dist/public` *after* the
      # bundle, and `alepha platform up` cleans `dist/` before building — so
      # letting it build would delete them. Build first, fill `dist/public`,
      # then deploy with `--prebuilt`, which skips the bundle and only
      # regenerates `wrangler.jsonc` before uploading.
      - name: Build Documentation
        working-directory: apps/docs
        run: yarn alepha build -t cloudflare && yarn alepha gen:llms

      - name: Deploy
        working-directory: apps/docs
        run: yarn alepha platform up --env production --prebuilt

  deploy-lore-production:
    needs: [checks, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lore-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy
        working-directory: apps/lore
        run: yarn alepha platform up --env production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # No SIGIL_SINK / SIGIL_KEY here on purpose. Lore is the sink, and a
          # Cloudflare Worker cannot fetch its own hostname — pointing Lore at
          # itself would make every flush a failed subrequest. It reports
          # nothing; other apps report to it.
