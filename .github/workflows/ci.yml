name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - main
  # Without this, the only CI run that ever happens is the one on `main` — the
  # same event that deploys Lore to production. Verification and deployment
  # were literally the same moment, so a branch could only be proven green by
  # shipping it. PRs get the full checks/test/bay/e2e matrix; the deploy jobs
  # opt out below.
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

concurrency:
  # `workflow_run` runs get a group of their own, and that separation is the
  # whole point of this expression.
  #
  # `github.ref` for a `workflow_run` event is the DEFAULT BRANCH — so a
  # Release completing resolved to `ci-refs/heads/main`, the same group a push
  # to main uses. With `cancel-in-progress`, the Release follow-up then
  # cancelled the push run that was still mid-test, and that push run is the
  # only one carrying `deploy-lore-production`. Lore silently did not ship, and
  # the evidence was a run marked `cancelled` that looks exactly like the
  # ordinary "a newer push superseded this one".
  #
  # Keyed on `head_branch` rather than a constant so two Releases in a row
  # still supersede each other, which is the behaviour worth keeping.
  #
  # One line, deliberately: a folded `>-` block keeps the newlines of any
  # more-indented continuation, so a "tidier" multi-line version smuggles
  # literal `\n` into the expression.
  group: ci-${{ github.event_name == 'workflow_run' && format('followup-{0}', github.event.workflow_run.head_branch) || github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Fast checks — lint, typecheck, dep / i18n / migration audits.
  # No services needed. Runs in parallel with `test` and `e2e`.
  # ──────────────────────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: i18n Catalog Check
        run: yarn check:i18n

      - name: DB Migrations Check
        run: yarn check:migrations

      # The two checks `yarn v` runs that this job did not: a `throw new
      # Error` / `Date.now()` regression or a doc-breaking JSDoc change used to
      # reach main (and the Lore deploy) whenever nobody ran `yarn v` locally.
      - name: Conventions Check
        run: yarn check:conventions

      - name: Docs Check
        run: yarn check:docs

  # ──────────────────────────────────────────────────────────────────────
  # Unit + integration tests (Vitest, Bun providers).
  # Needs services for the integration tests that hit real backends.
  # ──────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    # 20, not 12. This is a hang detector, not a budget: public-repo minutes are
    # free and the GitHub cap is 6 hours, so a generous number costs nothing.
    # A tight one costs a blocked `deploy-lore-production`, because a job killed
    # on the timeout reports as a failure the deploy gates on.
    #
    # 12 was set against a ~4m30s suite plus a `Setup` step that is 36s on a
    # cache hit and 2m20s on a miss (every dependency bump is a miss, since the
    # lockfile is the cache key). The suite has grown into it: a run at 11m53s
    # left 7 seconds of headroom, and a slow runner would have taken the deploy
    # down with it.
    #
    # The number to watch is `Test Project`, not this one. If that alone
    # approaches 8 minutes, the suite has genuinely regressed and raising this
    # again is the wrong move.
    timeout-minutes: 20
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

      emqx:
        image: emqx/emqx
        ports:
          - 11883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Test Project
        run: yarn test

      - name: Test Bun Providers
        run: yarn test:bun

  # ──────────────────────────────────────────────────────────────────────
  # Bay — the Go control plane. Nothing in the yarn pipeline compiles or
  # tests it, which is how a `.gitignore` pattern that swallowed the whole
  # `cmd/bay/` directory reached a commit unnoticed: the working tree built
  # fine because the files were there.
  #
  # Cross-compiles as well as builds: Bay is developed on macOS and only ever
  # runs on Linux, so a Linux-only compile error would otherwise surface on
  # the VPS rather than here.
  # ──────────────────────────────────────────────────────────────────────
  bay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/bay

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: apps/bay/go.mod
          cache-dependency-path: apps/bay/go.sum

      - name: Verify Formatting
        # `gofmt -l` lists misformatted files and exits 0 either way, so the
        # test has to be on its output.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      - name: Cross-compile for the targets Bay actually runs on
        run: |
          for target in amd64 arm64; do
            echo "→ linux/$target"
            GOOS=linux GOARCH=$target CGO_ENABLED=0 go build -o /dev/null ./cmd/bay
          done

  # ──────────────────────────────────────────────────────────────────────
  # Build + E2E. The long pole.
  # ──────────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    # Same reasoning as `test` above: a hang detector, not a budget. Observed
    # around 11m20s, and this job also gates `deploy-lore-production`.
    #
    # 25 rather than 20 since 2026-08-30, to keep the step cap below it with
    # room to spare after the Playwright step was re-sized. See the step.
    timeout-minutes: 25
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3mock:
        image: adobe/s3mock
        ports:
          - 19090:9090

      emqx:
        image: emqx/emqx
        ports:
          - 11883:1883
        env:
          EMQX_ALLOW_ANONYMOUS: "true"

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build Project
        run: yarn build

      # The browsers, keyed on the exact Playwright version rather than on the
      # lockfile: the lockfile churns constantly in a monorepo this size, and a
      # miss that only costs a re-download is not worth taking on every
      # dependency bump.
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          version="$(yarn playwright --version | tr -d '\n' | sed 's/.* //')"
          [ -n "$version" ] || { echo "could not resolve the Playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # `--with-deps` is deliberately absent, and this is the whole point of
      # the block. On `ubuntu-latest` every shared library chromium actually
      # needs is already on the image; the only thing the flag adds is nine
      # font packages — CJK, Cyrillic, Thai — and it pays for them by putting
      # `apt-get update` against `azure.archive.ubuntu.com` on the critical
      # path.
      #
      # On 2026-08-19 that mirror flapped for an afternoon and took the e2e job
      # of three consecutive pushes with it. The apt fetch alone ran 19s at
      # best and 12min at worst; at 12min the 15min job cap fired before the
      # suite had started, so the run was reported `cancelled` with no test
      # output, and every cancelled run skipped `deploy-lore-production`. Lore
      # sat two commits behind production for five hours because of a Ubuntu
      # mirror. The browser download itself was never the problem: it is ~9s
      # from `cdn.playwright.dev`, and it is what the cache above covers.
      #
      # The fonts bought nothing here. The suites render Latin text only, and
      # there is no `toHaveScreenshot`/`toMatchSnapshot` anywhere, so nothing
      # can observe a glyph. If a future runner image ever does drop a real
      # chromium dependency the failure is a missing `.so` at browser launch —
      # restore `--with-deps` then, but keep it off the critical path.
      #
      # Bounded so that if this ever stalls again it is reported as this step
      # failing, with the budget for the suite below still intact, instead of
      # silently eating the job.
      - name: Install Playwright
        timeout-minutes: 4
        run: yarn playwright install chromium

      # Bounded on the step, not just the job. Playwright's `globalTimeout`
      # covers the tests; it does not cover teardown, and teardown is where
      # this hangs — a failing run once printed its results and then sat for
      # five minutes holding orphaned wrangler and browser processes until the
      # job cap killed everything. That reads as "CI is slow" rather than
      # "two tests failed", and it costs the whole remaining budget.
      #
      # Slightly under half the job's 15, so a hang is reported as a failed
      # step with the test output intact, and the CLI suite below still gets
      # its turn.
      - name: Run E2E Tests
        # 11 rather than 7 since 2026-08-30. The suite grew by seven lore
        # specs in one batch of quests, and this is a HANG detector, not a
        # budget, so a legitimately longer suite hitting it means the detector
        # is mis-sized rather than that the suite is broken.
        #
        # ⚠️ Read the failure before raising it again. The run that forced
        # this printed complete results for shop, playground, docs and ssr and
        # was killed in the middle of LORE with no output, which is what a
        # capacity failure looks like. A hang looks different: results printed
        # for everything, then silence in teardown, which is the case the
        # original 7 was chosen for.
        #
        # The number to watch is the local wall time of `apps/lore`'s suite,
        # currently ~3.1m at 7 workers. CI gets one or two, and every test
        # that calls `registerAndVerify` + `createProjectViaWizard` pays about
        # 25s of setup before it asserts anything. That setup, not the
        # assertions, is what moves this number: prefer folding new
        # assertions into an existing spec's steps over adding a spec with
        # its own registration.
        timeout-minutes: 11
        run: yarn e2e

      - name: Run CLI E2E Tests
        timeout-minutes: 5
        run: yarn e2e-cli

  # ---------------------------------------------------------------------------
  # Cloudflare Workers deploy of the docs at `alepha.dev`.
  #
  # This replaced a `deploy-docs` job that published the same `dist/public` to
  # GitHub Pages. Pages is gone as a deploy target because it cannot host the
  # one thing the site needs: a same-origin `POST /api/sigil/ingest`, which is
  # where the visitor's IP becomes a salted hash and where the sigil credential
  # stays instead of shipping to every reader. A static host can offer neither,
  # so `alepha.dev` had no analytics at all.
  #
  # The cutover was a Worker *Route* (`alepha.dev/*`), not a Custom Domain, so
  # the apex DNS records were never touched — see the `platform()` block in
  # `apps/docs/alepha.config.ts` for why, and for how to roll back.
  # ---------------------------------------------------------------------------
  deploy-docs-production:
    # Doesn't require the e2e job — only that the codebase is lint/typecheck-
    # clean and tests pass.
    needs: [checks, test]
    # Deploying is a real side effect, so it must not fire for a proposed
    # change. Phrased as "not a PR" rather than copying
    # `deploy-lore-production`'s `push && ref == main`: docs also deploy on the
    # `workflow_run` (Release) trigger, and that has to keep working.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes the app's own secrets to this job. Without it `secrets.SIGIL_*`
    # resolve to empty and the deploy pushes nothing — the worker keeps whatever
    # it already had, so the failure is a config that silently stops tracking
    # `.env.production` rather than anything that goes red.
    environment: docs-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Delivered straight from `process.env` by the deploy, which reads the
      # app's `$env` declarations as the allowlist. Kept in the GitHub
      # environment by `alepha platform secrets apply`, because
      # `.env.production` is gitignored and CI has no other way to see them.
      APP_SECRET: ${{ secrets.APP_SECRET }}
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
      SIGIL_CONFIG: ${{ secrets.SIGIL_CONFIG }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # Build and deploy are split on purpose. `gen:llms` writes `llms.txt`,
      # `llms-full.txt` and the raw markdown into `dist/public` *after* the
      # bundle, and `alepha platform up` cleans `dist/` before building — so
      # letting it build would delete them. Build first, fill `dist/public`,
      # then deploy with `--prebuilt`, which skips the bundle and only
      # regenerates `wrangler.jsonc` before uploading.
      - name: Build Documentation
        working-directory: apps/docs
        run: yarn alepha build -t cloudflare && yarn alepha gen:llms

      - name: Deploy
        working-directory: apps/docs
        run: yarn alepha platform up --env production --prebuilt

  deploy-lore-production:
    needs: [checks, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lore-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The key is the whole enrolment: it authorises the reporting and names
      # the project, so nothing has to be kept in sync with it. SIGIL_CONFIG is
      # optional switches, and SIGIL_SINK is unset because Lore reports to the
      # default sink, which is itself. Absent, the module goes inert rather
      # than failing, so a missing one here costs telemetry and nothing else.
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}
      SIGIL_CONFIG: ${{ secrets.SIGIL_CONFIG }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Deploy
        working-directory: apps/lore
        run: yarn alepha platform up --env production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          # No SIGIL_SINK here on purpose. Lore IS the sink, and a Cloudflare
          # Worker cannot fetch its own hostname, so pointing Lore at an origin
          # would make every flush a failed subrequest. It still reports: the
          # key above enrols it, and `LoreSigilSinkProvider` routes its own
          # batches in process instead of over HTTP.
