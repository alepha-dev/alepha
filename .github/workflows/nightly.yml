name: Nightly

permissions:
  contents: read

# ────────────────────────────────────────────────────────────────────────
# Why coverage is nightly and not on every push
#
# `QualityService.record` upserts on `(projectId, branch, day)` - one row per
# branch per day, last push of the day wins. At ~19 pushes to `main` a day,
# eighteen of those writes were overwritten by the nineteenth before anyone
# read them, so the Quality tab has always rendered exactly one point per day.
# Running this once a day stores the same rows and takes ~2min of measured
# instrumentation off `verify`, which is on the critical path to the deploys.
#
# ⚠️ A separate coverage job existed before, on every push (33470c4a6), and was
# removed 1h40 later (ce4d041a8) because it ran the whole suite a SECOND time
# in parallel with the plain one: more expensive than the instrumentation it
# avoided, and two red X per broken test. That argument is about frequency, not
# about separation - once a day with nothing waiting on it is the opposite
# trade. Do not fold this back into `verify` without re-reading both commits.
#
# Measured on run 33428317573, same commit, both jobs on parallel runners:
# with coverage 736s, without 611s.
# ────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # 3am Paris time, DST included: `timezone` makes GitHub read the cron in
    # Europe/Paris instead of UTC. A cron on the hour may start 5-15min late,
    # since GitHub queues every `0 * * * *` in the world at once.
    - cron: "0 3 * * *"
      timezone: "Europe/Paris"
  # Manual runs, which is how this gets proven after a change to it rather
  # than by waiting until tomorrow morning.
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

# One job per product with a suite (#Q2777): each works inside its own folder
# and pushes to Lore project `alepha`, named in `LORE_PROJECT` on the job so no
# step can forget it (not a secret: a project slug is in every URL Lore
# serves). The jobs fail independently. Bay has no coverage step.
#
# ⚠️ Both products push into ONE project since #E94, and a quality run is one
# row per (project, branch, day): the second push of a day would overwrite the
# first. So Lore pushes under its own branch label, `lore/<branch>`, and the
# Quality tab draws the two as two lines.
jobs:
  # Every product's Verify, once a day (#Q3832). It deploys nothing: Verify's
  # `deploy` job wants a run named Verify and a `deploy` input, and a called
  # run has neither. `actions: read` because that job, skipped or not, calls
  # Deploy, whose `verified` job asks for it: a called job never gets more
  # than its caller grants, and the run fails at startup without it.
  verify:
    permissions:
      actions: read
      contents: read
      # Verify's deploy job asks for it (Deploy's agent-image job pushes to
      # ghcr.io, #Q3997), and a caller that grants less fails at startup.
      packages: write
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  framework:
    runs-on: ubuntu-latest
    env:
      LORE_PROJECT: alepha
    defaults:
      run:
        working-directory: framework
    # A hang detector, not a budget. Public-repo minutes are free, and this
    # job blocks nothing: a generous number costs nothing, a tight one costs a
    # missing data point.
    timeout-minutes: 30
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3:
        image: versity/versitygw:v1.8.0
        ports:
          - 19090:7070
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_REGION: eu-west-1
          VGW_QUIET: "true"
          ROOT_ACCESS_KEY: mock
          ROOT_SECRET_KEY: mock
        options: --tmpfs /data:size=4g

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Generate Docs
        run: yarn gen

      # ⚠️ `--coverage` is not only coverage. `TestCommand.reportArgs()` puts
      # six flags behind that one boolean, and two of them are the JSON test
      # reporter: `coverage/test-results.json` is where `QualityReportReader`
      # gets total, passed, failed, skipped and durationMs - five of the nine
      # numbers pushed below. Drop the flag and the push loses those too, not
      # just the four percentages.
      - name: Test With Coverage
        run: yarn alepha test --coverage

      # NOT `continue-on-error`, and that is the one deliberate difference from
      # the step this replaces.
      #
      # In `verify` the push had to be non-fatal: it was the last step of the
      # job both deploys gate on, so a failed push skipped the deploy - and it
      # deadlocked exactly once, because the endpoint it calls ships with Lore
      # and only that deploy could have created it.
      #
      # Nothing gates on this workflow, so that loop cannot form here, and the
      # inverse risk takes over: pushing IS the entire purpose of this job. A
      # swallowed failure is a green nightly that has silently stopped
      # recording, which is the failure nobody would notice for weeks.
      - name: Push Coverage To Lore
        run: yarn lore quality push
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

  # Lore's suite runs on SQLite, so it needs none of the services above, and
  # no `yarn gen`: Lore has no generators.
  lore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LORE_PROJECT: alepha
    defaults:
      run:
        working-directory: lore
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # The same flag and the same reason as the framework's step above.
      - name: Test With Coverage
        run: yarn alepha test --coverage

      # Not `continue-on-error` either, for the framework job's reason.
      - name: Push Coverage To Lore
        run: yarn lore quality push --branch "lore/${GITHUB_REF_NAME}"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

  # Lore's whole suite on Postgres (#Q3473). Verify runs only the specs
  # reaching Lore's raw SQL there, since the whole suite takes 18 to 27 min on
  # one runner; this catches what that subset misses, once a day with nothing
  # waiting on it. The Postgres setup is Verify's `lore-test-postgres`, whose
  # comments say why the server is started by hand with those flags.
  #
  # Six shards, like Verify's `lore-test` (#Q3998): on one runner this job
  # took 23 to 28 min and was the last of Nightly to finish. Each shard
  # starts its own server, so no shard shares a database with another.
  lore-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:15432/postgres
    defaults:
      run:
        working-directory: lore
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Start Postgres
        run: |
          docker run -d --name postgres -p 15432:5432 --shm-size=1g \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres -c max_locks_per_transaction=1024
          # The image's entrypoint initialises the cluster with a temporary
          # server, stops it, then starts the real one: a check over the Unix
          # socket can answer from the temporary server, which then shuts down
          # under the next step ("the database system is shutting down"). The
          # temporary server listens on no TCP port, so the check goes over
          # 127.0.0.1, and must pass three times in a row.
          ok=0
          for _ in $(seq 1 90); do
            if docker exec -e PGPASSWORD=postgres postgres psql -h 127.0.0.1 -U postgres -tAc 'select 1' >/dev/null 2>&1; then
              ok=$((ok + 1))
              if [ "$ok" -ge 3 ]; then exit 0; fi
            else
              ok=0
            fi
            sleep 1
          done
          docker logs postgres
          echo "Postgres was not ready after 90 s" >&2
          exit 1

      # Each of ~580 spec files builds Lore's ~90-table schema, three at a
      # time on four cores beside the server: a setup hook took past the
      # default 10 s, a different one each night. A hang detector here, not
      # a budget; a spec's own explicit timeout still wins.
      - name: Test Project on Postgres
        run: yarn alepha test --dialect postgres --shard ${{ matrix.shard }}/6
        env:
          VITEST_ARGS: --hookTimeout=60000 --testTimeout=60000

  # The Alepha CLI on Windows (#Q3726): the packed tarball installed into a
  # scaffolded project, then init, dev, test, build and run, as a Windows user
  # gets them. Nothing else in CI runs on Windows since 203e74c7f5, and
  # `cli.e2e.spec.ts` still carries its Windows handling (`alepha.cmd`, longer
  # timeouts, no detached spawn). Nightly only: nothing waits on it, and a
  # Windows runner is slow.
  #
  # The same build as Verify's `framework-e2e-cli`. Only `cli.e2e.spec.ts`:
  # the other specs need Docker, Redis or a service container, which a
  # Windows runner does not have.
  cli-windows:
    runs-on: windows-latest
    # A hang detector, not a budget, like the jobs above.
    timeout-minutes: 90
    defaults:
      run:
        working-directory: framework
        shell: bash
    steps:
      # Before the checkout: the runner's Git turns LF into CRLF otherwise,
      # and oxfmt and the spec would read other bytes than the Linux jobs.
      - name: Keep LF Line Endings
        run: git config --global core.autocrlf false
        working-directory: .

      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      # The tarball carries `dist/`.
      - name: Build Project
        run: yarn build

      - name: Run CLI E2E Tests on Windows
        timeout-minutes: 45
        run: yarn w e2e-cli test src/cli.e2e.spec.ts
