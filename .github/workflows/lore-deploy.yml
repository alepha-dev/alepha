name: Lore Deploy

permissions:
  contents: read

# Lore ships to lore.alepha.dev once Verify succeeds on a push to main. There
# is no human gate: read "Migration safety on D1" in apps/lore/CLAUDE.md before
# pushing a migration.
on:
  workflow_run:
    workflows: ["Lore Verify"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: lore-deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  LORE_PROJECT: lore

# Every `run` step works inside `lore/` (#Q2765). A step's own
# `working-directory` is relative to the repository root, so it names `lore/`.
defaults:
  run:
    working-directory: lore

jobs:
  deploy-lore-production:
    # ⚠️ Off until the repository variable LORE_DEPLOY is `true`. Until the
    # owner moves the `lore-production` secrets here and archives
    # alepha-dev/lore, that repository still deploys Lore, and two deployers
    # racing one Worker is the failure this gate prevents (#Q2765).
    if: >-
      vars.LORE_DEPLOY == 'true'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      # The restore point, in the log, before `alepha deploy` migrates (#Q2603).
      # Time Travel restores to any minute of the last 30 days anyway; the
      # bookmark makes that restore one copy-paste:
      #   wrangler d1 time-travel restore lore-production --bookmark=<it>
      - name: Time Travel bookmark
        working-directory: lore/apps/lore
        run: yarn wrangler d1 time-travel info lore-production

      # ⚠️ The Worker is `lore-production` (`infra({ name: "lore" })`).
      # Any other name provisions an empty D1 and moves lore.alepha.dev onto it.
      - name: Deploy
        working-directory: lore/apps/lore
        run: yarn alepha deploy --env production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Build lore (node + workerd)
        working-directory: lore/apps/lore
        run: yarn alepha build

      - name: Push lore artifact to Lore
        working-directory: lore/apps/lore
        run: yarn lore artifacts push
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
