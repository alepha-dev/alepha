name: Bay Release

permissions:
  contents: write
  # To redeploy alepha.dev once the release exists, so the Bay pages follow it.
  actions: write

concurrency:
  group: bay-release
  cancel-in-progress: false

# Builds the two binaries Bay ships, tags the commit `bay-<version>` and
# publishes a GitHub release carrying them and their SHA256SUMS. `install.sh`
# asks the GitHub API for the newest `bay-*` release, so the newest one is what
# a fresh install gets. No changelog beyond the commits that touched `bay/`.
#
# ⚠️ The tag carries the product (#Q2767): the framework tags bare versions in
# this same repository. Bay's versions continue from alepha-dev/bay, whose last
# release was 0.31.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a prefix (e.g. 0.32.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run: validate, test, build and checksum, but create no tag and no GitHub release"
        required: true
        type: boolean
        default: false

# Every `run` step works inside `bay/`, the Go module. A step's own
# `working-directory` is relative to the repository root.
defaults:
  run:
    working-directory: bay

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous `bay-*` tag, for the release notes.
          fetch-depth: 0

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '${VERSION}'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/bay-${VERSION}" >/dev/null; then
            echo "::error::Tag bay-${VERSION} already exists"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bay/go.mod
          cache-dependency-path: bay/go.sum

      - name: Test
        run: go test ./...

      - name: Build Bay binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$RUNNER_TEMP/artifacts/bay-linux-${arch}" \
              ./cmd/bay
          done

      - name: Checksum Bay binaries
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          sha256sum bay-linux-amd64 bay-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: Collect the release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          previous=$(git tag -l 'bay-*' --sort=-version:refname | head -1)
          range=${previous:+${previous}..}HEAD
          {
            echo "Bay ${VERSION}. Install or upgrade: \`curl -sSL https://alepha.dev/bay/install.sh | sudo sh\`"
            echo ""
            git log --no-merges --format='- %s (%h)' "$range" -- . | head -200
          } > "$RUNNER_TEMP/bay-notes.md"

      # Not the repository's "latest": that badge stays on the framework, and
      # `install.sh` finds Bay's releases by their prefix instead.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: bay-${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: Bay ${{ inputs.version }}
          body_path: ${{ runner.temp }}/bay-notes.md
          make_latest: "false"
          files: |
            ${{ runner.temp }}/artifacts/bay-linux-amd64
            ${{ runner.temp }}/artifacts/bay-linux-arm64
            ${{ runner.temp }}/artifacts/SHA256SUMS

      # alepha.dev pins its Bay pages to the newest `bay-*` tag (#Q2766), so
      # a release republishes them.
      - name: Redeploy alepha.dev
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Summary
        working-directory: ${{ runner.temp }}/artifacts
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            verb="Dry run: would have released"
          else
            verb="Released"
          fi
          {
            echo "### ${verb} Bay ${VERSION} (tag \`bay-${VERSION}\`)"
            echo ""
            echo '```'
            ls -l bay-linux-amd64 bay-linux-arm64 | awk '{print $5, $NF}'
            echo ""
            cat SHA256SUMS
            echo '```'
            echo ""
            cat "$RUNNER_TEMP/bay-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
