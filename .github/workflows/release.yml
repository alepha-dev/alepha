name: Release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: 'minor'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for proper versioning
          fetch-depth: 0
          # Use a token that can push to protected branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: yarn

      - name: Clean
        run: yarn clean

      - name: Build
        run: yarn build

      - name: Bump Version
        run: |
          yarn workspaces foreach --no-private --all version ${{ inputs.version_bump }}

      - name: Convert to JavaScript
        run: yarn convert js

      - name: Publish to NPM
        run: |
          yarn workspaces foreach --no-private -Apt exec npm publish --access=public

      - name: Clean
        run: yarn clean

      - name: Get New Version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/alepha/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"

      - name: Commit and Tag Release
        run: |
          git commit -am "release: ${{ steps.version.outputs.version }}"
          git tag -a ${{ steps.version.outputs.version }} -m "release: ${{ steps.version.outputs.version }}"

      - name: Push Changes and Tags
        run: |
          git push --follow-tags

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            Release ${{ steps.version.outputs.version }}

            **Version bump:** ${{ inputs.version_bump }}
          draft: false
          prerelease: false
