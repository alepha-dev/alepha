name: Release

permissions:
  contents: write
  id-token: write
  # ⚠️ Required for the ghcr push below, and it has to be spelled out:
  # naming ANY permission drops every unnamed scope to `none`, so a token that
  # otherwise looks fully privileged 403s on the registry without this line.
  packages: write

# One release at a time, and never cancel one.
#
# `cancel-in-progress: true` — what `ci.yml` uses, and right there — would be
# actively dangerous here: interrupting the job between `npm publish` and
# `git push` leaves a published version whose tag exists on no remote, which is
# the exact tear the step order further down is arranged to avoid. Two
# dispatches a minute apart would also both bump, racing to publish two
# versions nobody asked for.
concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: "minor"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history for proper versioning
          fetch-depth: 0
          # Use a token that can push to protected branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: yarn

      # `--no-private` here is NOT the registry guard. That is the identical
      # flag on `npm publish` far below, and it is the only thing keeping a
      # private workspace off the registry. Conflating the two cost a release.
      #
      # What this one encodes is the repository's version invariant: a
      # workspace declares a `version` if and only if it is published. Private
      # workspaces ship as a GitHub release asset (`bay`) or a Cloudflare
      # deploy (`lore`), never as an npm package, so a number in their
      # manifest is decoration, and decoration drifts. `@alepha/commerce`,
      # `payments-mollie` and `sigil` sat at 0.1.0, 0.20.6 and 0.20.1 while
      # `alepha` reached 0.26.0. They now carry no version at all.
      #
      # Dropping the flag to bump them anyway is what broke the first 0.27.0
      # attempt: `--all` also reaches the root workspace and the example apps,
      # and `yarn version` fails on a workspace with no version rather than
      # skipping it, so `foreach` aborts on the first one. `bay` still gets a
      # version in its binary, from the `alepha` number by way of the ldflags
      # further down, which is where it always came from.
      #
      # `scripts/check-conventions.ts` guards the invariant, so the next
      # violation surfaces in `yarn v` instead of here, in a release someone
      # dispatched by hand.
      - name: Bump Version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          yarn workspaces foreach --no-private --all version "${VERSION_BUMP}"

      - name: Get New Version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/alepha/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"

      # The file IS the release body — `action-gh-release` reads it through
      # `body_path` further down. It used to be piped into `$GITHUB_OUTPUT`
      # under an `EOF` delimiter, which put a commit message in charge of where
      # the value ended: one line reading exactly `EOF` truncates the notes, and
      # everything after it is parsed as more `key=value` output lines.
      - name: Generate Release Notes
        run: |
          # Straight to a file, so backticks survive the shell.
          yarn alepha gen changelog > /tmp/release_notes.txt

      # Prepend-only, and that is load-bearing rather than incidental: the new
      # section goes on top and `cat CHANGELOG.md >>` carries every existing one
      # through byte-for-byte. Nothing here ever regenerates an old section, and
      # nothing should - the 0.25.0 entries were written from French commit
      # subjects and translated by hand, and those subjects are in git history
      # forever. `alepha gen changelog --from=0.24.0 --to=0.25.0` still emits
      # the French today.
      #
      # The direction this cannot protect is the one above it: a French commit
      # subject written now flows straight into the next section, because that
      # is exactly what this step is for. `yarn check:conventions` reads
      # CHANGELOG.md for French and fails the build, so it surfaces in `yarn v`
      # rather than in the release notes.
      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Prepend new changelog entry (use cat to preserve backticks in commit hashes)
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            cat /tmp/release_notes.txt
            echo ""
          } > CHANGELOG.tmp
          cat CHANGELOG.md >> CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      # Local only — nothing leaves the runner until the artifacts exist.
      #
      # The push and the GitHub Release used to sit right here, ahead of the
      # build. A red `yarn build` then left a tag on `main` and a public release
      # for a version that never reached npm, and clearing that up meant
      # deleting a published release by hand. Everything irreversible now waits
      # until there is something to release.
      #
      # It stays ahead of `yarn copy` / `yarn build` so `git add -A` sees the
      # same tree it always has: the bump and the changelog, no build output.
      - name: Commit and Tag Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add -A
          git commit -m "release: ${VERSION}"
          git tag -a "${VERSION}" -m "release: ${VERSION}"

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build
        run: yarn build

      # Files that ship inside the npm tarball but are not tracked in the
      # package directory. They are listed in `files` and materialised here,
      # after the release commit, so `git add -A` above never picks them up.
      #
      # CHANGELOG.md is the root one, copied in: `packages/alepha` has no
      # changelog of its own, and the root file is outside the package
      # directory, so npm pack could never see it. The copy sits after the
      # "Update CHANGELOG.md" step, so the tarball carries the entry for the
      # version being released, not the previous one.
      - name: Copy package docs
        run: |
          cp packages/alepha/assets/agents-template.md packages/alepha/CLAUDE.md
          cp packages/alepha/assets/agents-template.md packages/alepha/AGENTS.md
          cp CHANGELOG.md packages/alepha/CHANGELOG.md

      # ──────────────────────────────────────────────────────────────────
      # Bay binaries.
      #
      # Filenames carry NO version. GitHub serves every asset at two URLs, and
      # the mutable one only works when the name is constant:
      #
      #   .../releases/download/<version>/bay-linux-amd64   immutable, auditable
      #   .../releases/latest/download/bay-linux-amd64      what `curl | sh` uses
      #
      # Put the version in the filename and you lose the second one. The version
      # is already carried by the release the asset hangs on — and, for the
      # binary, by `bay version`.
      # ──────────────────────────────────────────────────────────────────
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/bay/go.mod
          cache-dependency-path: apps/bay/go.sum

      - name: Build Bay binaries
        working-directory: apps/bay
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          for arch in amd64 arm64; do
            # CGO off so the binary is static and runs on any glibc/musl.
            # -trimpath keeps build paths out of it; -s -w drop the symbol table.
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$RUNNER_TEMP/artifacts/bay-linux-${arch}" \
              ./cmd/bay
          done

      - name: Checksum Bay binaries
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          # The installer downloads a binary and runs it as root — the highest
          # privilege operation in the whole system. Without this, a truncated
          # download and a tampered one are indistinguishable from a good one.
          sha256sum bay-linux-amd64 bay-linux-arm64 > SHA256SUMS
          cat SHA256SUMS

      # ──────────────────────────────────────────────────────────────────
      # Everything above is reversible: a failure leaves a dirty runner and
      # nothing else. From here on it is public.
      #
      # Last, so that every artifact — the JS packages and both Go binaries —
      # is known to build before any of it ships. A Go compile error after
      # `npm publish` would otherwise strand a published version.
      # ──────────────────────────────────────────────────────────────────
      - name: Publish to NPM
        run: |
          yarn workspaces foreach --no-private -Apt npm publish --tolerate-republish --access public

      # ──────────────────────────────────────────────────────────────────
      #
      # The push comes after `npm publish` on purpose. Of the two ways this can
      # tear, a published version whose tag has not been pushed is the mild one
      # — push the tag and it is whole. The other way round leaves a public
      # release pointing at a version nobody can install, and only deleting it
      # by hand fixes that.
      # ──────────────────────────────────────────────────────────────────
      - name: Push Changes and Tags
        run: |
          git push --follow-tags

      # ──────────────────────────────────────────────────────────────────
      # The self-hosted Lore image, `docker pull ghcr.io/alepha-dev/lore`.
      #
      # After the git push rather than between it and `npm publish`: a pushed
      # image tag is irreversible in the same way a published version is, and
      # slotting it into the npm/git window would widen the one tear this
      # ordering exists to keep narrow.
      #
      # It reuses the `yarn build` above. With `target: "docker"` in Lore's
      # config that step already leaves `apps/lore/dist` complete with its
      # generated Dockerfile, so there is no second build anywhere. The
      # config-driven OCI labels — `source` above all, which is what links the
      # published package to this repository — are `LABEL` lines inside that
      # file, so they survive a build the Alepha CLI did not run. Only the
      # three that describe THIS build are passed here.
      # ──────────────────────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⚠️ Neither is optional, and they fail in unhelpful ways when missing.
      # The default builder on a runner uses the `docker` driver, which
      # REFUSES a multi-platform build and says so in terms of the driver
      # rather than of platforms. And the generated Dockerfile is not
      # RUN-free: `mkdir -p /data && chown` prepares the volume, so building
      # for the other architecture executes a shell command under emulation
      # and needs the binfmt handlers QEMU registers.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # One buildx invocation for both architectures rather than two native
      # runners. Nothing is compiled: Vite bundles everything, so the image
      # has no dependency install, and the only thing emulation runs is the
      # two-command volume prep. Two native jobs would also be the harder
      # build here: the version commit is only pushed at the very end, so a
      # second job would have nothing to check out and `dist` would have to
      # travel as an artifact.
      #
      # The `docker` job in `ci.yml` runs this same two-platform build on
      # every push and PR, so it is not first exercised on release day.
      #
      # Two tags, both fixed. Nothing floating: Lore's version IS the
      # framework's, so a `:0` tag would move across unrelated framework
      # majors.
      - name: Build and Push the Lore Image
        working-directory: apps/lore/dist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "ghcr.io/alepha-dev/lore:${VERSION}" \
            --tag "ghcr.io/alepha-dev/lore:latest" \
            --push .

      # One step, not two: the release used to be created before the build and
      # have its assets bolted on afterwards, because that avoided reordering a
      # working pipeline. The reorder happened, so the split has no reason left
      # — and a release that is born complete never exists in a half state.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.txt
          draft: false
          prerelease: false
          files: |
            ${{ runner.temp }}/artifacts/bay-linux-amd64
            ${{ runner.temp }}/artifacts/bay-linux-arm64
            ${{ runner.temp }}/artifacts/SHA256SUMS

      # ──────────────────────────────────────────────────────────────────
      # Lore, last and never blocking.
      #
      # Four steps, all `continue-on-error`: a Lore failure must never redden
      # a release that has already reached npm, which is the posture `ci.yml`
      # states for its own Lore pushes. They sit after the GitHub Release for
      # the same reason the release sits after `npm publish`: nothing here is
      # worth tearing a release over.
      #
      # Three artifact pushes first, then the publish, so the release's
      # artifacts tab is already populated the moment it flips to published.
      # That is presentation rather than a constraint: the join is
      # `artifacts.tag = releases.tag` with no foreign key, and publishing
      # blocks no later push.
      #
      # Each push runs INSIDE its app: `alepha lore artifacts push` packs that
      # app's `dist/` and reads its `package.json`, and `CliProvider` reads
      # `alepha.config.ts` from `process.cwd()` only, so each of the three
      # configs registers `lore(...)` itself. The publish needs neither and
      # runs from the root, whose config already does.
      #
      # ⚠️ Only `apps/docs` and `apps/examples/shop` name a project in their
      # config. `apps/lore` registers a bare `lore()` on purpose, so its push
      # needs `--project` on the step or it dies on `No Lore project named`
      # and `continue-on-error` turns that into a warning nobody reads. That
      # is not hypothetical: it is what happened to Lore's own 0.28.0
      # artifact, which was never pushed.
      #
      # `--tag` is the version, byte for byte: `releases.tag` preserves case
      # so the artifact and the release meet on the same string. A version
      # with no Lore release exits 0 with a log line, and a re-run of this job
      # finds it already published and exits 0 again.
      # ──────────────────────────────────────────────────────────────────
      - name: Push docs artifact to Lore
        continue-on-error: true
        working-directory: apps/docs
        run: >-
          yarn alepha lore artifacts push
          --app docs
          --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Push lore artifact to Lore
        continue-on-error: true
        working-directory: apps/lore
        run: >-
          yarn alepha lore artifacts push
          --project alepha
          --app lore
          --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Push shop artifact to Lore
        continue-on-error: true
        working-directory: apps/examples/shop
        run: >-
          yarn alepha lore artifacts push
          --app shop
          --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish the Lore release
        continue-on-error: true
        run: yarn alepha lore releases publish --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
