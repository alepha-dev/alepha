name: Release

permissions:
  contents: write
  id-token: write

# One release at a time, and never cancel one.
#
# `cancel-in-progress: true`  -  what `verify.yml` uses, and right there  -  would be
# actively dangerous here: interrupting the job between `npm publish` and
# `git push` leaves a published version whose tag exists on no remote, which is
# the exact tear the step order further down is arranged to avoid. Two
# dispatches a minute apart would also both bump, racing to publish two
# versions nobody asked for.
concurrency:
  group: release
  cancel-in-progress: false

# Where every `lore` command in this workflow reports, named once so no step
# can forget. See the same block in `verify.yml` and `deploy-latest.yml`:
# this is the line that replaces four `continue-on-error` steps each relying on
# whichever `alepha.config.ts` their working directory happened to hold. One of
# them held none, and Lore's own 0.28.0 artifact was never pushed because of it.
env:
  LORE_PROJECT: alepha

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: "minor"
      # Finishes a release that tore AFTER its push: the tag exists and npm
      # has the version, but a later step failed. 0.30.0 died at the image
      # build this way (#Q2492). "Re-run failed jobs" cannot finish one: it
      # replays the workflow file of the dispatching commit, the broken one,
      # and bumps again onto a tag that already exists.
      #
      # With a tag here the job checks that tag out, skips the bump, the
      # changelog, the commit, npm and the push, takes the release notes from
      # the tag's CHANGELOG.md, and runs every other step as usual. Each of
      # those is safe to repeat (see the comment above the Lore publish), and
      # the workflow file is the one on the dispatched branch, so the fix that
      # unblocks the release is the one that runs.
      resume_tag:
        description: "Resume an existing release tag (skips bump, npm and push); version_bump is ignored"
        required: false
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on a normal release, which checks out the dispatched branch.
          ref: ${{ inputs.resume_tag }}
          # Fetch full history for proper versioning
          fetch-depth: 0
          # Use a token that can push to protected branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.x"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: yarn

      # `--no-private` here is NOT the registry guard. That is the identical
      # flag on `npm publish` far below, and it is the only thing keeping a
      # private workspace off the registry. Conflating the two cost a release.
      #
      # What this one encodes is the repository's version invariant: a
      # workspace declares a `version` if and only if it is published. Private
      # workspaces (the docs, the showcase, the examples) never ship as an npm
      # package, so a number in their manifest is decoration, and decoration
      # drifts. `@alepha/commerce`,
      # `payments-mollie` and `sigil` sat at 0.1.0, 0.20.6 and 0.20.1 while
      # `alepha` reached 0.26.0. They now carry no version at all.
      #
      # Dropping the flag to bump them anyway is what broke the first 0.27.0
      # attempt: `--all` also reaches the root workspace and the example apps,
      # and `yarn version` fails on a workspace with no version rather than
      # skipping it, so `foreach` aborts on the first one.
      #
      # `scripts/check-conventions.ts` guards the invariant, so the next
      # violation surfaces in `yarn v` instead of here, in a release someone
      # dispatched by hand.
      - name: Bump Version
        if: inputs.resume_tag == ''
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          yarn workspaces foreach --no-private --all version "${VERSION_BUMP}"

      - name: Get New Version
        id: version
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: |
          VERSION=$(node -p "require('./packages/alepha/package.json').version")
          if [ -n "$RESUME_TAG" ] && [ "$VERSION" != "$RESUME_TAG" ]; then
            echo "::error::Tag ${RESUME_TAG} carries version ${VERSION}, not a release commit"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Released version: $VERSION"

      # The gate on what ships (#Q2589). 0.31.0 was published at 47/66, because
      # the only Lore call was the publish at the very end, which never looked
      # at progress. This fails while the open Lore release carrying the tag has
      # unfinished quests (shelved ones excluded), and passes with a log line
      # when no release carries it.
      #
      # It sits after the bump only because the bump is what names the version:
      # nothing above is committed, pushed or published, so a red run here
      # leaves the repository and npm untouched. Skipped on a resume, whose
      # version is already on npm.
      - name: Check the Lore release is complete
        if: inputs.resume_tag == ''
        run: yarn lore releases check --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      # The file IS the release body  -  `action-gh-release` reads it through
      # `body_path` further down. It used to be piped into `$GITHUB_OUTPUT`
      # under an `EOF` delimiter, which put a commit message in charge of where
      # the value ended: one line reading exactly `EOF` truncates the notes, and
      # everything after it is parsed as more `key=value` output lines.
      #
      # On a resume the tag's commit already holds the section, so it is read
      # back out of CHANGELOG.md: the generator would diff the tag against
      # itself.
      - name: Generate Release Notes
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
        run: |
          if [ -n "$RESUME_TAG" ]; then
            awk -v head="## [${RESUME_TAG}]" \
              'index($0, head) == 1 { found = 1; next } /^## \[/ && found { exit } found' \
              CHANGELOG.md > /tmp/release_notes.txt
            if [ ! -s /tmp/release_notes.txt ]; then
              echo "::error::CHANGELOG.md has no section for ${RESUME_TAG}"
              exit 1
            fi
          else
            # Straight to a file, so backticks survive the shell.
            yarn alepha gen changelog > /tmp/release_notes.txt
          fi

      # Prepend-only, and that is load-bearing rather than incidental: the new
      # section goes on top and `cat CHANGELOG.md >>` carries every existing one
      # through byte-for-byte. Nothing here ever regenerates an old section, and
      # nothing should - the 0.25.0 entries were written from French commit
      # subjects and translated by hand, and those subjects are in git history
      # forever. `alepha gen changelog --from=0.24.0 --to=0.25.0` still emits
      # the French today.
      #
      # The direction this cannot protect is the one above it: a French commit
      # subject written now flows straight into the next section, because that
      # is exactly what this step is for. `yarn check:conventions` reads
      # CHANGELOG.md for French and fails the build, so it surfaces in `yarn v`
      # rather than in the release notes.
      - name: Update CHANGELOG.md
        if: inputs.resume_tag == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Prepend new changelog entry (use cat to preserve backticks in commit hashes)
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            cat /tmp/release_notes.txt
            echo ""
          } > CHANGELOG.tmp
          cat CHANGELOG.md >> CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      # Local only  -  nothing leaves the runner until the artifacts exist.
      #
      # The push and the GitHub Release used to sit right here, ahead of the
      # build. A red `yarn build` then left a tag on `main` and a public release
      # for a version that never reached npm, and clearing that up meant
      # deleting a published release by hand. Everything irreversible now waits
      # until there is something to release.
      #
      # It stays ahead of `yarn copy` / `yarn build` so `git add -A` sees the
      # same tree it always has: the bump and the changelog, no build output.
      - name: Commit and Tag Release
        if: inputs.resume_tag == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add -A
          git commit -m "release: ${VERSION}"
          git tag -a "${VERSION}" -m "release: ${VERSION}"

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      # This job installs no Bun (every Verify job does, through
      # `.github/actions/setup`), so no workspace here may build with it. Loom,
      # whose build is `bun build --compile`, was the one that did: it made
      # the 0.29.0 release die in this step on `bun: not found`, and it has
      # since left the repository for ~/git/loom.
      - name: Build
        run: yarn build

      # Files that ship inside the npm tarball but are not tracked in the
      # package directory. They are listed in `files` and materialised here,
      # after the release commit, so `git add -A` above never picks them up.
      #
      # CHANGELOG.md is the root one, copied in: `packages/alepha` has no
      # changelog of its own, and the root file is outside the package
      # directory, so npm pack could never see it. The copy sits after the
      # "Update CHANGELOG.md" step, so the tarball carries the entry for the
      # version being released, not the previous one.
      - name: Copy package docs
        run: |
          cp packages/alepha/assets/agents-template.md packages/alepha/CLAUDE.md
          cp packages/alepha/assets/agents-template.md packages/alepha/AGENTS.md
          cp CHANGELOG.md packages/alepha/CHANGELOG.md

      # ──────────────────────────────────────────────────────────────────
      # Everything above is reversible: a failure leaves a dirty runner and
      # nothing else. From here on it is public.
      #
      # Last, so that every artifact is known to build before any of it ships.
      # Bay's binaries left with Bay (#E72): github.com/alepha-dev/bay
      # releases them itself.
      # ──────────────────────────────────────────────────────────────────
      - name: Publish to NPM
        if: inputs.resume_tag == ''
        run: |
          yarn workspaces foreach --no-private -Apt npm publish --tolerate-republish --access public --provenance

      # ──────────────────────────────────────────────────────────────────
      #
      # The push comes after `npm publish` on purpose. Of the two ways this can
      # tear, a published version whose tag has not been pushed is the mild one
      #  -  push the tag and it is whole. The other way round leaves a public
      # release pointing at a version nobody can install, and only deleting it
      # by hand fixes that.
      # ──────────────────────────────────────────────────────────────────
      - name: Push Changes and Tags
        if: inputs.resume_tag == ''
        run: |
          git push --follow-tags

      # One step, not two: the release used to be created before the build and
      # have its assets bolted on afterwards, because that avoided reordering a
      # working pipeline. The reorder happened, so the split has no reason left
      #  -  and a release that is born complete never exists in a half state.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.txt
          draft: false
          prerelease: false

      # ──────────────────────────────────────────────────────────────
      # The docs rebuild and the Lore release, last.
      #
      # `docs` is rebuilt here for workerd and deployed by `deploy
      # --prebuilt` at the very end (#Q2576).
      #
      # ⚠️ The docs rebuild sits HERE, at the very end, and cannot move earlier:
      # `alepha build --runtime=workerd` cleans `dist/` and replaces it.
      #
      # ⚠️ `gen:llms` follows EVERY docs build, node and workerd alike. It writes
      # the `llms.txt` files and the raw markdown into `dist/public`, which
      # `alepha build` does not produce, so a build deployed without it serves
      # an `alepha.dev` with no `llms.txt` at all. The docs `build` script runs
      # it, which covers `yarn build` above; the workerd rebuild below calls
      # `alepha build` directly, so it runs it itself.
      #
      # The rebuild needs no Cloudflare credentials: the build emits
      # `wrangler.jsonc` from env vars and never calls the API.
      #
      # `ui` and `shop` are deliberately absent. Neither is versioned by this
      # release - `ui` is a showcase and `shop` an example - and CI keeps a
      # `latest` of shop's workerd build in `deploy-shop-production`.
      #
      # None of these steps is `continue-on-error`. A swallowed step is how
      # 0.28.0 reached npm with no Lore artifact of its own: `No Lore project
      # named`, a warning annotation, a green run, and nobody the wiser until
      # someone went looking months later. A failure here reddens the release
      # run, which is honest rather than dangerous BECAUSE of where these
      # steps sit: npm, the tag and the GitHub Release are all done above.
      # Nothing is torn by going red, and re-running the job publishes again
      # cleanly: the publish exits 0 on an already-published release.
      #
      # The publish runs from the root and reports to the workflow-level
      # `LORE_PROJECT` at the top of this file. `--tag` is the version, byte
      # for byte: `releases.tag` preserves case. A version with no Lore release
      # exits 0 with a log line.
      # ──────────────────────────────────────────────────────────────
      - name: Rebuild docs for workerd
        working-directory: apps/docs
        run: yarn alepha build --runtime=workerd && yarn alepha gen:llms

      - name: Publish the Lore release
        run: yarn lore releases publish --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      # ──────────────────────────────────────────────────────────────
      # `alepha.dev`, and ONLY here (#Q2480).
      #
      # It used to deploy from `deploy-latest.yml` on every green push to
      # `main`, so the site documented code no one could install yet: an agent
      # reading `llms.txt` was told about APIs its `node_modules` did not have.
      # The docs now move with the npm version, and a docs-only fix waits for
      # the next release, or a hand-dispatched patch release.
      #
      # Last, after every push and the publish: a red deploy then tears
      # nothing, and re-running the job redeploys the same build.
      # ──────────────────────────────────────────────────────────────
      # `alepha-docs-production` (`infra({ project: "alepha" })`), the
      # Worker Lore Deploy created for alepha.dev, taken over with its Custom
      # Domain (#Q2576). `--prebuilt`: the workerd build above carries the
      # llms.txt files `gen:llms` wrote after it, and a fresh build would drop
      # them.
      - name: Deploy docs
        working-directory: apps/docs
        run: yarn alepha deploy --env production --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
