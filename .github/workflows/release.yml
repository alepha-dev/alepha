name: Release
run-name: Release${{ inputs.dry_run && ' (dry run)' || '' }}

# ONE release for the whole repository (#Q2776): the framework's packages,
# `@alepha/lore` with the Lore image, and Bay's binaries, all under one bare
# `x.y.z` tag and one GitHub release. Lore and Bay take the framework's
# version: they shipped on their own between #E72 and this, never again.
#
# ⚠️ **Tag-driven: a release writes nothing to `main` (#Q3640).** The version
# is the latest release tag plus the bump, written into the published
# workspaces on this runner only, and the one thing pushed is the bare tag.
# `main` is protected (#E150): nothing reaches it except a pull request with
# its checks green, and the built-in token cannot bypass that. So there is no
# release commit, no CHANGELOG.md (the Lore release is the changelog), and no
# dispatch of Verify or the deploys: the commit being tagged already passed
# Verify and was deployed when it landed on `main`.
#
# The `version` fields committed on `main` are therefore NOT the released
# version and are no longer maintained: they hold the last version released
# before this, which `alepha init` from a checkout still writes as a usable
# `^` range. The tag is the version.

permissions:
  contents: write
  id-token: write
  # The Lore image, pushed to ghcr.io/alepha-dev/lore.
  packages: write

# One release at a time, and never cancel one.
#
# `cancel-in-progress: true`  -  what `verify.yml` uses on a branch, and right there  -  would be
# actively dangerous here: interrupting the job between `npm publish` and
# the tag push leaves a published version whose tag exists on no remote, which is
# the exact tear the step order further down is arranged to avoid. Two
# dispatches a minute apart would also both bump, racing to publish two
# versions nobody asked for.
concurrency:
  group: release
  cancel-in-progress: false

# Where every `lore` command in this workflow reports, named once so no step
# can forget. See the same block in `verify.yml` and `deploy.yml`:
# this is the line that replaces four `continue-on-error` steps each relying on
# whichever `alepha.config.ts` their working directory happened to hold. One of
# them held none, and Lore's own 0.28.0 artifact was never pushed because of it.
env:
  LORE_PROJECT: alepha

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: "minor"
      # Everything up to the first publish, and nothing after it (#Q2948):
      # the version, the Lore release check, the release notes, the local
      # tag, every build, Bay's tests and binaries, the Lore image and the
      # docs build all run; npm, the tag push, the image push, the GitHub
      # release, the Lore artifacts and release, and the docs deploy are all
      # skipped. The run summary lists what would have shipped. The runner is
      # thrown away, so the local tag goes with it.
      dry_run:
        description: "Dry run: build and check everything, publish nothing"
        required: false
        type: boolean
        default: false
      # Finishes a release that tore AFTER its push: the tag exists and npm
      # has the version, but a later step failed. 0.30.0 died at the image
      # build this way (#Q2492). "Re-run failed jobs" cannot finish one: it
      # replays the workflow file of the dispatching commit, the broken one,
      # and bumps again onto a tag that already exists.
      #
      # With a tag here the job checks that tag out, takes its version from
      # the tag, skips the Lore release check, npm and the tag push, reads the
      # release notes from the Lore release as Lore holds it, and runs every
      # other step as usual. Each of those is safe to repeat (see the comment
      # above the Lore publish), and the workflow file is the one on the
      # dispatched branch, so the fix that unblocks the release is the one
      # that runs.
      resume_tag:
        description: "Resume an existing release tag (skips bump, npm and push); version_bump is ignored"
        required: false
        type: string
        default: ""

# Every `run` step works inside `framework/`: the repository holds the
# framework, Lore and Bay side by side (#Q2765), and this workflow is the
# framework's. A step's own `working-directory` is relative to the repository
# root, so it names `framework/` too.
defaults:
  run:
    working-directory: framework

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty on a normal release, which checks out the dispatched branch.
          ref: ${{ inputs.resume_tag }}
          # Every tag, to find the latest release, and the history `git
          # describe` reads.
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: yarn

      # The version is the latest release tag plus the bump, never a
      # `package.json` (#Q3640): those on `main` are not maintained any more.
      # The latest tag by version order, not by `git describe`, so a tag on a
      # commit `main` does not contain still counts. A resume takes its tag.
      - name: Work out the version
        id: version
        working-directory: .
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          if [ -n "$RESUME_TAG" ]; then
            VERSION="$RESUME_TAG"
          else
            LATEST=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "$LATEST" ]; then
              echo "::error::No x.y.z release tag to bump from"
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
            case "$VERSION_BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            if git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
              echo "::error::Tag ${VERSION} already exists"
              exit 1
            fi
            echo "Bumping ${LATEST} (${VERSION_BUMP}) to ${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Released version: $VERSION"

      # On the runner only: these edits are never committed (#Q3640). They are
      # what `npm publish` packs, and what `workspace:*` resolves to inside
      # each published tarball, so every package names its siblings at this
      # version. Run on a resume too, because the tag's commit carries no
      # released version of its own.
      #
      # `--no-private` here is NOT the registry guard. That is the identical
      # flag on `npm publish` far below, and it is the only thing keeping a
      # private workspace off the registry. Conflating the two cost a release.
      #
      # What this one encodes is the repository's version invariant: a
      # workspace declares a `version` if and only if it is published. Private
      # workspaces (the docs, the showcase, the examples) never ship as an npm
      # package, so a number in their manifest is decoration, and decoration
      # drifts. `scripts/check-conventions.ts` guards the invariant, so the
      # next violation surfaces in `yarn v` instead of here, and `yarn
      # version` fails on a workspace with no version rather than skipping it.
      #
      # Lore and its client take the framework's version, so the one tag names
      # all three products. `apps/lore` is what the image is tagged with;
      # `@alepha/lore` is the npm package. Bay has no manifest: its version is
      # stamped into the binary at build time.
      - name: Set the version on the runner
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          yarn workspaces foreach --no-private --worktree version "${VERSION}"
          cd ../lore
          yarn workspace @alepha/lore version "${VERSION}"
          yarn workspace lore version "${VERSION}"

      # Local, and before every build: `alepha build` reads the tag on HEAD as
      # the version it bakes into each bundle and serves on `/version`
      # (#Q3639), so the Lore image and alepha.dev report the release, not
      # `git describe`. Pushed only once everything is published, further
      # down. A resume checked the tag out, so HEAD carries it already.
      - name: Tag the release locally
        if: inputs.resume_tag == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag -a "${VERSION}" -m "release: ${VERSION}"

      # The gate on what ships (#Q2589). 0.31.0 was published at 47/66, because
      # the only Lore call was the publish at the very end, which never looked
      # at progress. This fails while the open Lore release carrying the tag
      # (in project `alepha`, which tracks the framework, Lore and Bay since
      # #E94) has unfinished quests, shelved ones excluded, and passes with a
      # log line when no release carries it.
      #
      # It sits after the bump only because the bump is what names the version:
      # nothing above is committed, pushed or published, so a red run here
      # leaves the repository and npm untouched. Skipped on a resume, whose
      # version is already on npm. A dry run keeps it: it only reads.
      - name: Check the Lore release is complete
        if: inputs.resume_tag == ''
        run: yarn lore releases check --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      # The file IS the release body  -  `action-gh-release` reads it through
      # `body_path` further down. It used to be piped into `$GITHUB_OUTPUT`
      # under an `EOF` delimiter, which put a commit message in charge of where
      # the value ended.
      #
      # The Lore release is the changelog (#E150): its epics, then the quests
      # of each area that belong to no epic, the same text alepha.dev/changelog
      # shows. A resume reads it `--frozen`, since its Lore release may already
      # be published, and drops the title line the frozen form carries.
      #
      # ⚠️ A real release needs its Lore release: no notes, no release. A dry
      # run carries on with a placeholder instead, so the builds below are
      # still exercised for a version Lore has no release of yet.
      - name: Generate Release Notes
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          RESUME_TAG: ${{ inputs.resume_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          if [ -n "$RESUME_TAG" ]; then
            notes() {
              yarn lore releases changelog --tag "$VERSION" --frozen \
                | awk 'NR == 1 && /^# / { next } { print }'
            }
          else
            notes() { yarn lore releases changelog --tag "$VERSION"; }
          fi
          if ! notes > /tmp/release_notes.txt || [ ! -s /tmp/release_notes.txt ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::No Lore release notes for ${VERSION}: the dry run goes on without them"
              echo "_No Lore release carries ${VERSION} yet._" > /tmp/release_notes.txt
            else
              echo "::error::The Lore release ${VERSION} gave no release notes"
              exit 1
            fi
          fi

      - name: Clean
        run: yarn clean

      # `yarn gen` runs the docs' `gen:tree`, which builds alepha.dev's
      # changelog page from the published Lore releases (#Q3638).
      - name: Generate Docs
        run: yarn gen
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

      # This job installs no Bun (every Verify job does, through
      # `.github/actions/setup`), so no workspace here may build with it. A
      # workspace whose build was `bun build --compile` made the 0.29.0
      # release die in this step on `bun: not found`; it has since left the
      # repository.
      - name: Build
        run: yarn build

      # A file that ships inside the npm tarball but is not tracked in the
      # package directory: listed in `files`, materialised here. The tarball
      # carries no CHANGELOG.md any more (#E150): the release notes are the
      # Lore release, on alepha.dev/changelog and the GitHub release.
      - name: Copy package docs
        run: |
          cp packages/alepha/assets/agents-template.md packages/alepha/AGENTS.md

      # Lore's own build: `@alepha/lore` (its `bin`, sigil and client) for npm,
      # and `apps/lore` for the image below.
      - name: Build Lore
        working-directory: lore
        run: yarn build

      # Bay, built and tested before anything ships: the binaries go onto the
      # GitHub release below, with their checksums.
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: bay/go.mod
          cache-dependency-path: bay/go.sum

      - name: Test Bay
        working-directory: bay
        run: go test ./...

      - name: Build Bay binaries
        working-directory: bay
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/bay"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$RUNNER_TEMP/bay/bay-linux-${arch}" \
              ./cmd/bay
          done
          cd "$RUNNER_TEMP/bay" && sha256sum bay-linux-amd64 bay-linux-arm64 > SHA256SUMS && cat SHA256SUMS

      # The image is built here, before anything is public, and published
      # after the tag: an image that does not build stops the release while
      # it is still reversible.
      #
      # ⚠️ It is the REAL build, attestations included (#Q3363): the SBOM and
      # the provenance live in the image index, so the image is pushed as it
      # is built, to a registry on this runner, and the publish step below
      # copies that one index to ghcr. A dry run therefore exercises the whole
      # attested path, and the build Verify's `lore-docker` runs on every change is this
      # one (`image:release`, then `docker-attestations.ts`).
      - name: Start a registry on the runner
        run: docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2

      # amd64 and arm64 (`image.platforms`, #Q3858): the arm64 `RUN` line
      # needs the binfmt handlers. Runner setup, not a second build (#F1338).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build the Lore image
        working-directory: lore/apps/lore
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: yarn image:release --tag "127.0.0.1:5000/alepha-dev/lore:${VERSION}"

      - name: Check the Lore image's attestations
        working-directory: lore
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/docker-attestations.ts --image "127.0.0.1:5000/alepha-dev/lore:${VERSION}"

      # ──────────────────────────────────────────────────────────────────
      # Everything above is reversible: a failure leaves a dirty runner and
      # nothing else. From here on it is public, and a dry run skips every
      # step that publishes (`dry_run`, #Q2948).
      #
      # What npm would receive, package by package, in place of the publish.
      # ──────────────────────────────────────────────────────────────────
      - name: List what npm would receive (dry run)
        if: inputs.dry_run
        run: |
          yarn workspaces foreach --no-private -Wpt pack --dry-run
          yarn workspace @alepha/lore pack --dry-run

      # ──────────────────────────────────────────────────────────────────
      #
      # Last, so that every artifact is known to build before any of it ships.
      #
      # ⚠️ The framework's packages by `-W` (this worktree), then `@alepha/lore`
      # by name. `-A` reached every public workspace of the repository, Lore's
      # included, which is how a release would publish a package nobody
      # versioned with it. npm trusted publishing names THIS file for every one
      # of them, `@alepha/lore` included.
      # ──────────────────────────────────────────────────────────────────
      - name: Publish to NPM
        if: inputs.resume_tag == '' && inputs.dry_run != true
        run: |
          yarn workspaces foreach --no-private -Wpt npm publish --tolerate-republish --access public --provenance
          yarn workspace @alepha/lore npm publish --tolerate-republish --access public --provenance

      # ──────────────────────────────────────────────────────────────────
      #
      # The tag push comes after `npm publish` on purpose. Of the two ways
      # this can tear, a published version whose tag has not been pushed is
      # the mild one  -  push the tag and it is whole. The other way round
      # leaves a public release pointing at a version nobody can install, and
      # only deleting it by hand fixes that.
      #
      # The tag alone (#Q3640): `main` is protected, and the commit being
      # tagged is already on it. Nothing is dispatched afterwards either: that
      # commit passed Verify and was deployed when it landed on `main`.
      # ──────────────────────────────────────────────────────────────────
      - name: Push the tag
        if: inputs.resume_tag == '' && inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git push origin "refs/tags/${VERSION}"

      # One step, not two: the release used to be created before the build and
      # have its assets bolted on afterwards, because that avoided reordering a
      # working pipeline. The reorder happened, so the split has no reason left
      #  -  and a release that is born complete never exists in a half state.
      - name: Log in to GitHub Container Registry
        if: inputs.dry_run != true
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry-to-registry copy of the index the gate built, never a
      # second build: `<version>` and `latest` are ONE digest, attestations
      # included, from one command. Measured: `imagetools create` from a
      # plain-HTTP loopback registry keeps the index digest unchanged.
      # Safe to repeat on a resume: the gate rebuilt the index, and both tags
      # are written again.
      - name: Push the Lore image
        if: inputs.dry_run != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/alepha-dev/lore:${VERSION}" \
            --tag "ghcr.io/alepha-dev/lore:latest" \
            "127.0.0.1:5000/alepha-dev/lore:${VERSION}"
          docker buildx imagetools inspect "ghcr.io/alepha-dev/lore:${VERSION}"

      # Bay's binaries ride on the one release: `bay/install.sh` takes the
      # newest release that carries one.
      - name: Create GitHub Release
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.txt
          draft: false
          prerelease: false
          files: |
            ${{ runner.temp }}/bay/bay-linux-amd64
            ${{ runner.temp }}/bay/bay-linux-arm64
            ${{ runner.temp }}/bay/SHA256SUMS

      # ──────────────────────────────────────────────────────────────
      # The docs rebuild and the Lore release, last.
      #
      # `docs` is rebuilt here for workerd and deployed by `deploy
      # --prebuilt` at the very end (#Q2576).
      #
      # ⚠️ The docs rebuild sits HERE, at the very end, and cannot move earlier:
      # `alepha build --runtime=workerd` cleans `dist/` and replaces it.
      #
      # ⚠️ `gen:llms` follows EVERY docs build, node and workerd alike. It writes
      # the `llms.txt` files and the raw markdown into `dist/public`, which
      # `alepha build` does not produce, so a build deployed without it serves
      # an `alepha.dev` with no `llms.txt` at all. The docs `build` script runs
      # it, which covers `yarn build` above; the workerd rebuild below calls
      # `alepha build` directly, so it runs it itself.
      #
      # The rebuild needs no Cloudflare credentials: the build emits
      # `wrangler.jsonc` from env vars and never calls the API.
      #
      # `ui` and `shop` are deliberately absent. Neither is versioned by this
      # release - `ui` is a showcase and `shop` an example - and CI keeps a
      # `latest` of shop's workerd build in `deploy-shop-production`.
      #
      # None of these steps is `continue-on-error`. A swallowed step is how
      # 0.28.0 reached npm with no Lore artifact of its own: `No Lore project
      # named`, a warning annotation, a green run, and nobody the wiser until
      # someone went looking months later. A failure here reddens the release
      # run, which is honest rather than dangerous BECAUSE of where these
      # steps sit: npm, the tag and the GitHub Release are all done above.
      # Nothing is torn by going red, and re-running the job publishes again
      # cleanly: the publish exits 0 on an already-published release.
      #
      # The publish runs once, in project `alepha` (`LORE_PROJECT` at the top
      # of this file), which holds the framework's, Lore's and Bay's work since
      # #E94. `--tag` is the version, byte for byte: `releases.tag` preserves
      # case. No release of that version exits 0 with a log line.
      # ──────────────────────────────────────────────────────────────
      # Lore's build and image, recorded in project `alepha` before the release
      # is published, so the release lists them.
      - name: Push the Lore artifact to Lore
        if: inputs.dry_run != true
        working-directory: lore/apps/lore
        run: |
          yarn lore artifacts push --tag "$VERSION"
          yarn lore artifacts push-image --tag "$VERSION" --image "ghcr.io/alepha-dev/lore:$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish the Lore release
        if: inputs.dry_run != true
        run: yarn lore releases publish --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      # After the publish, and it runs `gen:tree` again first (#Q3784): the
      # changelog page lists only PUBLISHED Lore releases, and the one `yarn
      # copy` built at the top of the job predates this one's publish. Without
      # it, the alepha.dev a release deploys shows every version but its own
      # until the next Deploy of the docs. A dry run publishes nothing, so its
      # rebuild lists the previous release, as the deployed site does today.
      - name: Rebuild docs for workerd
        working-directory: docs
        run: yarn alepha gen:tree && yarn alepha build --runtime=workerd && yarn alepha gen:llms
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

      # ──────────────────────────────────────────────────────────────
      # `alepha.dev` at each release. `deploy.yml` also deploys it from `main`,
      # with the framework section pinned to the latest release tag (#Q2766),
      # so between releases it never shows an unreleased framework page.
      #
      # It used to deploy from `deploy-latest.yml` (now `deploy.yml`) on every green push to
      # `main`, so the site documented code no one could install yet: an agent
      # reading `llms.txt` was told about APIs its `node_modules` did not have.
      # The docs now move with the npm version, and a docs-only fix waits for
      # the next release, or a hand-dispatched patch release.
      #
      # Last, after every push and the publish: a red deploy then tears
      # nothing, and re-running the job redeploys the same build.
      # ──────────────────────────────────────────────────────────────
      # Through Lore Deploy (#Q2701): `lore()` pushes `dist/` as `latest` to
      # the `docs/production` copy of project `alepha` and Lore deploys it
      # onto `alepha-docs-production`, minting the sigil and sealing the
      # secrets itself. `--prebuilt`: the workerd build above carries the
      # llms.txt files `gen:llms` wrote after it, and a fresh build would
      # drop them. Only `LORE_API_KEY`: the Cloudflare credential is the
      # host's, held by Lore.
      - name: Deploy docs
        if: inputs.dry_run != true
        working-directory: docs
        run: yarn alepha deploy --env production --prebuilt
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

      # The same build under the release's own tag, so every version of
      # alepha.dev stays in Lore as an artifact to roll back to; `latest` is
      # the one tag the deploy above replaces.
      - name: Archive docs as a versioned artifact
        if: inputs.dry_run != true
        working-directory: docs
        run: yarn lore artifacts push --app docs --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      # What a real run would have shipped, on the run page. Last, so it only
      # appears once every build above has passed.
      - name: Summary (dry run)
        if: inputs.dry_run
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Dry run: would have released ${VERSION}"
            echo ""
            echo "Nothing was published. A real run would have:"
            echo ""
            echo "- published the framework's packages and \`@alepha/lore\` ${VERSION} to npm"
            echo "- pushed the tag \`${VERSION}\` on the commit it built, and nothing to \`main\`"
            echo "- copied the attested index (SBOM and provenance) to \`ghcr.io/alepha-dev/lore:${VERSION}\` and \`:latest\`, one digest"
            echo "- created the GitHub release with Bay's binaries"
            echo "- pushed the Lore artifacts, published Lore release ${VERSION} and deployed alepha.dev"
            echo ""
            echo "#### Bay binaries"
            echo '```'
            cat "$RUNNER_TEMP/bay/SHA256SUMS"
            echo '```'
            echo ""
            echo "#### Release notes"
            echo ""
            cat /tmp/release_notes.txt
          } >> "$GITHUB_STEP_SUMMARY"
