name: Release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: 'minor'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Fetch full history for proper versioning
          fetch-depth: 0
          # Use a token that can push to protected branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.x"
          cache: "yarn"
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: yarn

      - name: Bump Version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          yarn workspaces foreach --no-private --all version "${VERSION_BUMP}"

      - name: Get New Version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/alepha/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"

      - name: Generate Release Notes
        id: release_notes
        run: |
          # Write changelog content directly to file to preserve backticks
          yarn alepha gen changelog > /tmp/release_notes.txt

          # Output for GitHub Release body (uses file content safely)
          {
            echo "notes<<EOF"
            cat /tmp/release_notes.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Prepend new changelog entry (use cat to preserve backticks in commit hashes)
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            cat /tmp/release_notes.txt
            echo ""
          } > CHANGELOG.tmp
          cat CHANGELOG.md >> CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit and Tag Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add -A
          git commit -m "release: ${VERSION}"
          git tag -a "${VERSION}" -m "release: ${VERSION}"

      - name: Push Changes and Tags
        run: |
          git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Build
        run: yarn build

      - name: Copy agent templates
        run: |
          cp packages/alepha/assets/agents-template.md packages/alepha/CLAUDE.md
          cp packages/alepha/assets/agents-template.md packages/alepha/AGENTS.md

      - name: Publish to NPM
        run: |
          yarn workspaces foreach --no-private -Apt npm publish --tolerate-republish --access public
