name: Release

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: 'minor'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history for proper versioning
          fetch-depth: 0
          # Use a token that can push to protected branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "yarn"
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: yarn

      - name: Bump Version
        run: |
          yarn workspaces foreach --no-private --all version ${{ inputs.version_bump }}

      - name: Get New Version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/alepha/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Released version: $VERSION"

      - name: Generate Release Notes
        id: release_notes
        run: |
          VERSION=${{ steps.version.outputs.version }}
          DATE=$(date +%Y-%m-%d)
          CONTENT=$(yarn alepha changelog)

          # Output for GitHub Release body (no header)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Output for CHANGELOG.md (with header)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## [$VERSION] - $DATE" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        run: |
          # Prepend new changelog entry at the beginning
          echo "${{ steps.release_notes.outputs.changelog }}" > CHANGELOG.tmp
          cat CHANGELOG.md >> CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit and Tag Release
        run: |
          git add -A
          git commit -m "release: ${{ steps.version.outputs.version }}"
          git tag -a ${{ steps.version.outputs.version }} -m "release: ${{ steps.version.outputs.version }}"

      - name: Push Changes and Tags
        run: |
          git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false

      - name: Clean
        run: yarn clean

      - name: Build
        run: yarn build

      - name: Convert to JavaScript
        run: yarn convert js

      - name: Publish to NPM
        run: |
          yarn workspaces foreach --no-private -Apt exec npm publish --access=public
