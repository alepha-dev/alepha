name: Bay CI

on:
  push:
    paths:
      - "bay/**"
      - ".github/workflows/bay-ci.yml"
  pull_request:
    paths:
      - "bay/**"
      - ".github/workflows/bay-ci.yml"

concurrency:
  group: bay-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every `run` step works inside `bay/`, the Go module (#Q2765).
defaults:
  run:
    working-directory: bay

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: bay/go.mod
          cache-dependency-path: bay/go.sum

      - name: Verify Formatting
        # `gofmt -l` lists misformatted files and exits 0 either way, so the
        # test has to be on its output.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install Pebble
        # Let's Encrypt's test CA. Without it the ACME issuance test in
        # internal/tlsconf skips, and the one path that fails silently for 90
        # days goes untested. Same version as the Dockerfile.
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test
        # The runner already has Docker. BAY_REQUIRE_DOCKER turns a missing
        # daemon into a failure, so the Docker runner's tests can never report
        # `ok` without having run.
        env:
          BAY_REQUIRE_DOCKER: "1"
        run: go test ./...

      - name: Cross-compile for the targets Bay actually runs on
        run: |
          for target in amd64 arm64; do
            echo "→ linux/$target"
            GOOS=linux GOARCH=$target CGO_ENABLED=0 go build -o /dev/null ./cmd/bay
          done
