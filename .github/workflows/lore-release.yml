name: Lore Release

permissions:
  contents: write
  id-token: write
  packages: write

concurrency:
  group: lore-release
  cancel-in-progress: false

env:
  LORE_PROJECT: lore

# One version for Lore and its client: `apps/lore` (what /version reports and
# the image is tagged with) and `@alepha/lore` (the npm package) move together.
# The changelog is Lore's own release feature: the quests attached to the
# release in the Lore project, frozen when it is published.
#
# ⚠️ The git tag is `lore-<version>` (#Q2767). The framework tags bare
# versions in this same repository, and its release reads the newest bare tag
# as its changelog base; a bare Lore tag would become that base. The Lore
# release inside Lore keeps the bare version: that is project `lore`'s own
# namespace.
#
# ⚠️ npm trusted publishing names this file: `@alepha/lore`'s publisher on
# npmjs.com is alepha-dev/alepha with workflow `lore-release.yml`. Renaming it
# breaks the publish with a 404 from npm.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - minor
          - patch
          - major
        default: "minor"
      dry_run:
        description: "Dry run: build and check everything, publish nothing (no npm, no tag, no image push, no GitHub or Lore release)"
        required: true
        type: boolean
        default: false

# Every `run` step works inside `lore/`. A step's own `working-directory` is
# relative to the repository root.
defaults:
  run:
    working-directory: lore

jobs:
  release:
    runs-on: ubuntu-26.04

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.x"
          cache: "yarn"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: yarn

      - name: Bump Version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          yarn workspace @alepha/lore version "${VERSION_BUMP}"
          yarn workspace lore version "${VERSION_BUMP}"

      - name: Get New Version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/@alepha/lore/package.json').version")
          LORE=$(node -p "require('./apps/lore/package.json').version")
          if [ "$VERSION" != "$LORE" ]; then
            echo "::error::@alepha/lore is ${VERSION} but lore is ${LORE}: they release together"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/lore-${VERSION}" >/dev/null; then
            echo "::error::Tag lore-${VERSION} already exists"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Before anything irreversible, dry runs included: the Lore release
      # carrying this version must have every quest completed (shelved ones
      # do not count). `publish` at the end refuses too, but by then npm and
      # the tag are public (#Q2600).
      - name: Check the Lore release is complete
        run: yarn lore releases check --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      # The commits since the previous Lore tag that touched `lore/`, for the
      # GitHub release. Taken before the release commit exists, so it is not
      # listed in its own notes.
      - name: Collect the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git tag -l 'lore-*' --sort=-version:refname | head -1)
          range=${previous:+${previous}..}HEAD
          {
            echo "Lore ${VERSION}: \`@alepha/lore@${VERSION}\` on npm, \`ghcr.io/alepha-dev/lore:${VERSION}\`."
            echo ""
            git log --no-merges --format='- %s (%h)' "$range" -- . | head -200
          } > "$RUNNER_TEMP/lore-notes.md"

      - name: Commit and Tag Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add apps/lore/package.json packages/@alepha/lore/package.json ../yarn.lock
          git commit -m "release(lore): ${VERSION}"
          git tag -a "lore-${VERSION}" -m "release(lore): ${VERSION}"

      - name: Build
        run: yarn build

      # ── Everything above stays on the runner. From here on a real run
      # publishes, and a dry run (`dry_run`) only checks what it would publish.

      - name: List what npm would receive (dry run)
        if: inputs.dry_run
        run: yarn workspace @alepha/lore pack --dry-run

      - name: Publish @alepha/lore to npm
        if: ${{ !inputs.dry_run }}
        run: yarn workspace @alepha/lore npm publish --tolerate-republish --access public

      - name: Push Changes and Tags
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built in a dry run too: an image that does not build is exactly what a
      # rehearsal is for.
      - name: Build the Lore Image
        working-directory: lore/apps/lore
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          yarn alepha image --tag "ghcr.io/alepha-dev/lore:${VERSION}"
          docker tag "ghcr.io/alepha-dev/lore:${VERSION}" "ghcr.io/alepha-dev/lore:latest"

      - name: Push the Lore Image
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "ghcr.io/alepha-dev/lore:${VERSION}"
          docker push "ghcr.io/alepha-dev/lore:latest"

      # Not the repository's "latest": that badge stays on the framework.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: lore-${{ steps.version.outputs.version }}
          name: Lore ${{ steps.version.outputs.version }}
          body_path: ${{ runner.temp }}/lore-notes.md
          make_latest: "false"

      - name: Push lore artifact to Lore (node + workerd)
        if: ${{ !inputs.dry_run }}
        working-directory: lore/apps/lore
        run: yarn lore artifacts push --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Record the Lore image in Lore
        if: ${{ !inputs.dry_run }}
        working-directory: lore/apps/lore
        run: >-
          yarn lore artifacts push-image
          --tag "$VERSION"
          --image "ghcr.io/alepha-dev/lore:$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish the Lore release
        if: ${{ !inputs.dry_run }}
        run: yarn lore releases publish --tag "$VERSION"
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            verb="Dry run: would have released"
          else
            verb="Released"
          fi
          {
            echo "### ${verb} Lore ${VERSION}"
            echo ""
            echo "- \`@alepha/lore@${VERSION}\` to npm"
            echo "- \`ghcr.io/alepha-dev/lore:${VERSION}\` and \`:latest\`"
            echo "- git tag \`lore-${VERSION}\`, the GitHub release, and the Lore release \`${VERSION}\` (project lore)"
            echo ""
            cat "$RUNNER_TEMP/lore-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
