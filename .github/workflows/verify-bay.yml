name: Verify Bay

on:
  # Branches only: with no `branches` filter a tag push runs this too, and
  # GitHub skips the `paths` filter for tags.
  push:
    branches:
      - main
    paths:
      - "bay/**"
      - ".github/workflows/verify-bay.yml"
  # Every pull request into main, with no `paths` filter (#Q3633): `gate`
  # below is a required check, and a workflow a `paths` filter skips never
  # reports one, which leaves the pull request waiting forever. The `changes`
  # job applies the same list instead, and skips the real jobs when the pull
  # request touches none of it. A pull request is how every change reaches
  # main, so a branch push alone runs nothing: `push` is for main only.
  pull_request:
    branches:
      - main
  # `verify-all.yml`, by hand.
  workflow_call:

# Namespaced by event, so a Verify All on a branch never cancels that
# branch's push run, nor the other way round.
concurrency:
  group: verify-bay-${{ github.event_name }}-${{ github.ref }}
  # A newer push supersedes a branch run, never a main one (#Q3687): with
  # pull requests merging every few minutes, cancelling on main left no
  # run to finish, and the deploy that follows a green one never ran.
  # GitHub keeps the main run going and only the newest one waiting.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every `run` step works inside `bay/`, the Go module (#Q2765).
defaults:
  run:
    working-directory: bay

jobs:
  # Whether this pull request touches this workflow's part of the tree (#Q3633).
  # Any other event runs everything. The list is the `push` trigger's `paths`.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^(bay/|\.github/workflows/verify-bay\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No file of this workflow's part of the tree changed: its jobs skip."
          fi

  check:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: bay/go.mod
          cache-dependency-path: bay/go.sum

      - name: Verify Formatting
        # `gofmt -l` lists misformatted files and exits 0 either way, so the
        # test has to be on its output.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Install Pebble
        # Let's Encrypt's test CA. Without it the ACME issuance test in
        # internal/tlsconf skips, and the one path that fails silently for 90
        # days goes untested. Same version as the Dockerfile.
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Test
        # The runner already has Docker. BAY_REQUIRE_DOCKER turns a missing
        # daemon into a failure, so the Docker runner's tests can never report
        # `ok` without having run.
        env:
          BAY_REQUIRE_DOCKER: "1"
        run: go test ./...

      - name: Cross-compile for the targets Bay actually runs on
        run: |
          for target in amd64 arm64; do
            echo "→ linux/$target"
            GOOS=linux GOARCH=$target CGO_ENABLED=0 go build -o /dev/null ./cmd/bay
          done

  # The one check the `main` ruleset requires of this workflow (#Q3633). It
  # always runs, so a pull request that skipped every job still reports, and
  # it fails when any job failed or was cancelled. A skipped job is a pass.
  gate:
    name: gate (bay)
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled." >&2
          exit 1
      - run: echo "Green."
