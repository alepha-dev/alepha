name: Verify Lore

permissions:
  contents: read

on:
  # Lore builds on the framework's source and its e2e builds Bay, so a change
  # to either runs this too: that is why the three share one repository.
  push:
    branches:
      - "**"
    paths:
      - "lore/**"
      - "framework/**"
      - "bay/**"
      - ".github/workflows/verify-lore.yml"
      - ".github/actions/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".nvmrc"
  pull_request:
    branches:
      - main
    # The same list as `push`.
    paths:
      - "lore/**"
      - "framework/**"
      - "bay/**"
      - ".github/workflows/verify-lore.yml"
      - ".github/actions/**"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - ".nvmrc"
  # By hand, and by Release after it pushes the release commit (#Q2948): a
  # push made with `GITHUB_TOKEN` triggers no workflow, and a dispatch is the
  # one event it may. A green dispatch on `main` deploys, like a push, when a
  # person started it: Release's own dispatch, made with `GITHUB_TOKEN`,
  # fires no `workflow_run`, so Release dispatches the deploys itself (#Q2953).
  workflow_dispatch:
  # `verify-all.yml`, by hand. A called run is filed under "Verify All", so it
  # never triggers `deploy-lore.yml`.
  workflow_call:

# Namespaced by event, so a dispatch on `main` and a push to it never cancel
# each other.
concurrency:
  group: verify-lore-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Lore's work is tracked in project `alepha`, with the framework's and Bay's
# (#E94): one project, the product told apart by area.
env:
  LORE_PROJECT: alepha

# CI is the gate: a green `yarn v` is not. Every branch push runs this graph.
# Every `run` step works inside `lore/` (#Q2765). A step's own
# `working-directory` is relative to the repository root, so it names `lore/`.
defaults:
  run:
    working-directory: lore

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint Project
        run: yarn lint

      # `yarn lint` fixes in place; a diff after it means a commit that was
      # never linted.
      - name: Lint Left Nothing To Fix
        run: git diff --exit-code

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: i18n Catalog Check
        run: yarn check:i18n

      - name: DB Migrations Check
        run: yarn check:migrations

      - name: Conventions Check
        run: yarn check:conventions

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test Project
        run: yarn alepha test --shard ${{ matrix.shard }}/2

  # Lore on Postgres (#Q3473). Every app keeps migrations/postgres/, and SQL
  # nothing applies only looks supported, so this job applies Lore's to an
  # empty database, then runs the specs that reach Lore's raw SQL on Postgres
  # through `alepha test --dialect postgres`.
  #
  # Only those specs, not the suite: the whole suite on one runner took 18 to
  # 27 min and doubled Verify Lore, which every deploy waits on, while the
  # Drizzle query builder underneath is the framework's and its Postgres specs
  # run in Verify Framework. The whole suite runs on Postgres in Nightly.
  #
  # ⚠️ NOT blocking, on purpose: `continue-on-error` keeps a red run from
  # failing Verify Lore, so it never holds a deploy back. Lore's raw SQL is
  # still SQLite-only in places (#E141); make the job blocking (drop
  # `continue-on-error`) when E141 lands and this job is green.
  test-postgres:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    continue-on-error: true
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:15432/postgres
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Started by hand, not as a service container: a service cannot pass
      # server flags. Every spec creates a schema of Lore's ~90 tables and
      # drops it at stop, in parallel, and DROP SCHEMA ... CASCADE takes a lock
      # per object: at the default 64 the run dies of "out of shared memory".
      # The larger lock table lives in shared memory, which Docker caps at
      # 64 MB by default; without `--shm-size` the server crashes mid-run.
      - name: Start Postgres
        run: |
          docker run -d --name postgres -p 15432:5432 --shm-size=1g \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres -c max_locks_per_transaction=1024
          until docker exec postgres pg_isready -U postgres; do sleep 1; done

      # A drizzle `--> statement-breakpoint` is a SQL comment, so psql runs
      # each migration file as it is, in order, and stops at the first error.
      # The container's own psql: the runner image need not ship a client.
      - name: Apply migrations/postgres
        run: |
          docker exec postgres psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE lore_migrations"
          for file in apps/lore/migrations/postgres/*/migration.sql; do
            echo "Applying $file"
            docker exec -i postgres psql -U postgres -d lore_migrations -v ON_ERROR_STOP=1 -q < "$file"
          done

      # The specs naming a module that writes raw SQL (`sql\``, `sql.raw`,
      # `.execute(`), plus those reaching the uncovered ones through their
      # controller: project counts and recency (home-open-counts,
      # owns-project-query-count, quest-count, open-error-counter) and
      # UptimeReadService (uptime-controller). Vitest takes each word as a
      # path filter, so `automation-` picks up a new automation spec unasked;
      # a spec for a new raw-SQL module elsewhere needs adding here.
      - name: Test Raw SQL on Postgres
        run: yarn alepha test --dialect postgres
        env:
          VITEST_ARGS: >-
            apps/lore/test/automation-
            apps/lore/test/guarded-statements.spec.ts
            apps/lore/test/sigil-self-report.spec.ts
            apps/lore/test/home-open-counts.spec.ts
            apps/lore/test/owns-project-query-count.spec.ts
            packages/@lore/deploy/test/SigilIngest
            packages/@lore/deploy/test/sigil-
            packages/@lore/deploy/test/insights-controller.spec.ts
            packages/@lore/deploy/test/lore-analytics.spec.ts
            packages/@lore/deploy/test/uptime-retention.spec.ts
            packages/@lore/deploy/test/uptime-controller.spec.ts
            packages/@lore/deploy/test/open-error-counter.spec.ts
            packages/@lore/remember/test/folio-
            packages/@lore/plan/test/WorkAutomationSelections.spec.ts
            packages/@lore/plan/test/release-default.spec.ts
            packages/@lore/plan/test/quest-count.spec.ts

  e2e-lore:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Lore
        run: yarn w lore build

      - name: Setup Playwright
        uses: ./.github/actions/playwright
        with:
          working-directory: lore

      - name: Run E2E Tests
        timeout-minutes: 20
        run: yarn w e2e web --shard=${{ matrix.shard }}/6

  e2e-cli:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Project
        run: yarn build

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Bay end-to-end builds the real Bay, from `bay/`, against this Lore.
          go-version-file: bay/go.mod
          cache-dependency-path: bay/go.sum

      - name: Run CLI E2E Tests
        timeout-minutes: 10
        run: yarn e2e-cli

  docker:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # The build Release runs, on every push (folio #F1338, #Q3363): the
      # attested image pushed to a registry on the runner, its attestations
      # asserted on the index, then the image pulled back for the smoke and
      # the size checks. A fixed port: the daemon pushes, not this shell.
      - name: Start a registry on the runner
        run: docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2

      - name: Build the image
        run: yarn w lore build

      - name: Build and push the attested image
        run: yarn w lore image:release --tag=127.0.0.1:5000/alepha-dev/lore:ci

      - name: Check the attestations on the index
        run: node scripts/docker-attestations.ts --image 127.0.0.1:5000/alepha-dev/lore:ci

      - name: Pull the image back
        run: docker pull 127.0.0.1:5000/alepha-dev/lore:ci

      - name: Smoke test the image
        run: bash scripts/docker-smoke.sh 127.0.0.1:5000/alepha-dev/lore:ci

      - name: Check the image size budget
        run: node scripts/docker-size.ts --image 127.0.0.1:5000/alepha-dev/lore:ci
