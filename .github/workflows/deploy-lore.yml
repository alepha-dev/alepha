name: Deploy Lore

permissions:
  contents: read

# "Lore Deploy" (`lore-deploy.yml`) until #Q2946.
#
# Lore ships to lore.alepha.dev once Verify Lore (`verify-lore.yml`) succeeds
# on `main`: on a push, or on the Release commit it verifies after a Release.
# There is no human gate: read "Migration safety on D1" in
# lore/apps/lore/CLAUDE.md before pushing a migration.
#
# `workflow_dispatch` ships main as it stands, without waiting for Verify Lore
# (#Q2707): for a hotfix whose branch was already green, never for a migration
# Verify Lore has not run on main. See "The workflow" in lore/CLAUDE.md.
# `deploy-all.yml` calls this file the same way.
on:
  workflow_run:
    # By NAME: renaming Verify Lore without this line stops every deploy,
    # silently. A run called by `verify-all.yml` is filed under "Verify All"
    # and never lands here.
    workflows: ["Verify Lore"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
  # `deploy-all.yml`. A called run sees the caller's event, `workflow_dispatch`,
  # and its ref, so the dispatch half of the gate below covers it.
  workflow_call:

concurrency:
  group: deploy-lore-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

# Project `alepha` holds Lore's work and its sigil since #E94.
env:
  LORE_PROJECT: alepha

# Every `run` step works inside `lore/` (#Q2765). A step's own
# `working-directory` is relative to the repository root, so it names `lore/`.
defaults:
  run:
    working-directory: lore

jobs:
  deploy-lore-production:
    # The repository variable LORE_DEPLOY is the kill switch: anything but
    # `true` stops every Lore deploy. It gated the move from alepha-dev/lore,
    # which is gone (#Q2765).
    # A dispatch deploys main only: a branch never ships to production. A
    # `pull_request` run never ships either, and the head repository check
    # keeps a fork's branch named `main` out (#Q2946).
    if: >-
      vars.LORE_DEPLOY == 'true'
      && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && contains(fromJSON('["push", "workflow_run"]'), github.event.workflow_run.event))
        || (github.event_name == 'workflow_dispatch'
          && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SIGIL_KEY: ${{ secrets.SIGIL_KEY }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      # The restore point, in the log, before `alepha deploy` migrates (#Q2603).
      # Time Travel restores to any minute of the last 30 days anyway; the
      # bookmark makes that restore one copy-paste:
      #   wrangler d1 time-travel restore lore-production --bookmark=<it>
      - name: Time Travel bookmark
        working-directory: lore/apps/lore
        run: yarn wrangler d1 time-travel info lore-production

      # ⚠️ The Worker is `lore-production` (`infra({ name: "lore" })`).
      # Any other name provisions an empty D1 and moves lore.alepha.dev onto it.
      - name: Deploy
        working-directory: lore/apps/lore
        run: yarn alepha deploy --env production
        env:
          GITHUB_CLIENT_ID: ${{ secrets.APP_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.APP_GITHUB_CLIENT_SECRET }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}

      - name: Build lore (node + workerd)
        working-directory: lore/apps/lore
        run: yarn alepha build

      - name: Push lore artifact to Lore
        working-directory: lore/apps/lore
        run: yarn lore artifacts push
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}
