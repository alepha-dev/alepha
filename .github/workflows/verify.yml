name: Verify

permissions:
  contents: read

# ────────────────────────────────────────────────────────────────────────
# Every product's checks, in one workflow: the framework, Lore, Bay and the
# docs site run as parallel job chains, each closed by the `gate` job the
# `main` ruleset requires.
#
# Verify only verifies (#Q3869). It runs every product on every run, with no
# detection of what a change touches: `alepha-dev` has 60 concurrent hosted
# jobs since 2026-11-18, a full run is about ten minutes with no job waiting
# for a runner, and a filter that guesses wrong costs more than the jobs it
# saves. It deploys nothing by itself: Deploy (`deploy.yml`) does, on the push
# to `main`.
#
# A change runs this twice: on its pull request, then in the merge queue on
# top of `main`. The push to `main` that follows is the commit the queue
# tested, and it starts Deploy, not a third Verify.
#
# Four workflows in all: Verify (this one), Deploy, Release and Nightly.
# ────────────────────────────────────────────────────────────────────────
on:
  # A pull request is how every change reaches main, so a branch push alone
  # runs nothing. No `paths` filter either (#Q3633): a gate is a required
  # check, and a workflow a `paths` filter skips never reports one, which
  # leaves a pull request waiting forever.
  pull_request:
    branches:
      - main
  # The merge queue (#Q3688): a pull request is tested again on top of main
  # and of every pull request queued ahead of it, and merges only if that is
  # green too. Two pull requests green alone can be red together (four
  # migrations on one snapshot, 2026-11-15). This is the run Deploy looks for
  # before it ships a push to `main`.
  merge_group:
    types: [checks_requested]
  # By hand, on any ref. `product` narrows the run to one product, and
  # `deploy`, from `main` only, calls Deploy once every gate is green:
  #
  #   gh workflow run verify.yml --ref <branch>
  #   gh workflow run verify.yml --ref <branch> -f product=framework
  #   gh workflow run verify.yml --ref main -f deploy=all
  workflow_dispatch:
    inputs:
      product:
        description: "What to verify"
        type: choice
        options:
          - all
          - framework
          - lore
          - bay
          - docs
        default: all
      deploy:
        description: "What to deploy once the gates are green (from main only)"
        type: choice
        options:
          - none
          - all
          - lore
          - framework
          - docs
        default: none
  # Nightly, every product. No `deploy` input here on purpose: a called run
  # has only the inputs declared below, so it can never reach the deploy job.
  workflow_call:
    inputs:
      product:
        description: "What to verify: all, framework, lore, bay or docs"
        type: string
        default: all

concurrency:
  # Namespaced by event, so a dispatch and a pull request on the same ref
  # never cancel each other, and per ref, so two pull requests never do either.
  group: verify-${{ github.event_name }}-${{ github.ref }}
  # A newer push supersedes a branch run, never a main one: a dispatch on
  # `main` may be on its way to a deploy, and a deploy is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Where a `lore` command reports. Not a secret: a project slug is in every URL
# Lore serves; `LORE_API_KEY` is the secret, and it stays on the steps that
# need it. It is declared once, at the top, because it used to come from
# whichever `alepha.config.ts` a step's directory held, and the 0.28.0 release
# shipped without Lore's artifact when one held none.
#
# ⚠️ It reaches the suites too (a spec container merges over `process.env`):
# dropping it is a change to the environment the tests run in, not a tidy-up.
env:
  LORE_PROJECT: alepha

jobs:
  # ⚠️ Every product job carries the same `if`: its product, or `all`. An
  # event with no input (a pull request, a merge queue group) reads as `all`.
  # A job with no `if` would run on a dispatch narrowed to another product.

  # ══════════════════════════════════════════════════════════════════════
  # The framework, in `framework/`. Together these jobs are `yarn v`, split so
  # a red one says which half without waiting for the other.
  # ══════════════════════════════════════════════════════════════════════

  # ──────────────────────────────────────────────────────────────────────
  # The static half of `yarn v`: lint, typecheck and every `check:*`.
  #
  # ⚠️ The service containers are kept, and kept UNPROVEN. Nothing in these
  # steps obviously wants postgres, but `check:migrations` boots each app's
  # server entry through `loadAlephaFromServerEntryFile`, and whether that
  # connects has never been tested: this half has always run with the
  # containers already up. Dropping them is worth ~16s and is a deliberate
  # experiment, not a tidy-up.
  # ──────────────────────────────────────────────────────────────────────
  framework-checks:
    if: contains(fromJSON('["all", "framework"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    # A hang detector, not a budget. Public-repo minutes are free and the
    # GitHub cap is 6 hours, so a generous number costs nothing while a tight
    # one costs a blocked deploy.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: framework
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3:
        image: versity/versitygw:v1.8.0
        ports:
          - 19090:7070
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_REGION: eu-west-1
          VGW_QUIET: "true"
          ROOT_ACCESS_KEY: mock
          ROOT_SECRET_KEY: mock
        options: --tmpfs /data:size=4g

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        # The one job of Verify that saves the node_modules cache, and one of
        # the three that check the lockfile (see the setup action).
        with:
          save-cache: "true"
          check-lockfile: "true"

      - name: Clean
        run: yarn clean

      - name: Generate Docs
        run: yarn gen

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: DB Migrations Check
        run: yarn check:migrations

      - name: Conventions Check
        run: yarn check:conventions

      - name: Docs Check
        run: yarn check:docs

  # ──────────────────────────────────────────────────────────────────────
  # The unit and integration suite, sharded six ways with
  # `alepha test --shard i/6` (#Q2479).
  #
  # ⚠️ Six is where this job stopped being the critical path, measured on run
  # #1691: ~89s of fixed setup per shard and ~1192s of shardable work. Past
  # six the extra shards finish early and wait, and each costs another draw
  # from a flake distribution this repository knows is environmental.
  # Vitest shards by sha1 of the spec's path into equal COUNTS, not by
  # duration, which balances well over ~870 spec files.
  #
  # Coverage is NOT measured here. It lives in `nightly.yml`, which carries
  # the reasoning: read it before moving coverage back.
  # ──────────────────────────────────────────────────────────────────────
  framework-test:
    if: contains(fromJSON('["all", "framework"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: framework
    strategy:
      # A failing shard must not cancel its siblings: the point of running
      # the suite is to learn everything that is broken.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3:
        image: versity/versitygw:v1.8.0
        ports:
          - 19090:7070
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_REGION: eu-west-1
          VGW_QUIET: "true"
          ROOT_ACCESS_KEY: mock
          ROOT_SECRET_KEY: mock
        options: --tmpfs /data:size=4g

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      # No `--coverage`: that flag is Nightly's, and it also turns on the JSON
      # test reporter. Nothing in this job reads either report.
      - name: Test Project
        run: yarn alepha test --shard ${{ matrix.shard }}/6

      # Here rather than in `framework-checks`, because two of the six bun
      # specs want the service containers above. On one shard only:
      # `bun test` takes no `--shard`.
      - name: Test Bun Providers
        if: matrix.shard == 1
        run: yarn test:bun

  # ──────────────────────────────────────────────────────────────────────
  # The MQTT contract suite on a real broker (#E88): `yarn test:broker`, the
  # cases the shards run on `@alepha/mqtt`'s memory broker, here on
  # Mosquitto, so the fake cannot drift from reality.
  #
  # Mosquitto is started by a step rather than under `services:`: a service
  # container starts before the checkout, so it cannot mount
  # `scripts/mosquitto.conf`, and Mosquitto 2 without a config listens on
  # localhost inside its container only.
  # ──────────────────────────────────────────────────────────────────────
  framework-mqtt-broker:
    if: contains(fromJSON('["all", "framework"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # The image and config of the `mosquitto` service in compose.yml; keep
      # the two in step.
      - name: Start Mosquitto
        run: |
          docker run -d --name mosquitto -p 11883:1883 \
            -v "$PWD/scripts/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            --health-cmd "mosquitto_pub -h 127.0.0.1 -t health -m ok" \
            --health-interval 1s --health-timeout 5s --health-retries 30 \
            eclipse-mosquitto:2.0.22
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mosquitto)" = healthy ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs mosquitto
          exit 1

      - name: MQTT Contract (Mosquitto)
        timeout-minutes: 5
        run: yarn test:broker

  # ──────────────────────────────────────────────────────────────────────
  # Build + E2E. Each job builds only what it tests: an app needs no package
  # built, since every framework package's `exports` points at `src/` and
  # `alepha build` compiles the framework from source into the app's `dist/`.
  # `framework-e2e-cli` is the exception and keeps `yarn build`: it packs the
  # workspace, and the tarball carries each package's `dist/`.
  #
  # The suites are bounded on the STEP, not just the job: Playwright's
  # `globalTimeout` covers the tests but not teardown, and teardown is where
  # this hangs.
  #
  # No service containers: every app these jobs build is SQLite or nothing.
  # ──────────────────────────────────────────────────────────────────────
  framework-e2e-apps:
    if: contains(fromJSON('["all", "framework"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: framework
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      # The three apps the step below runs that do not build themselves.
      - name: Build Project
        run: yarn workspaces foreach -Wpt --include '{ui,shop,ssr}' run build

      - name: Setup Playwright
        uses: ./.github/actions/playwright
        with:
          working-directory: framework

      # ui, examples/shop, examples/ssr, and examples/ai, oidc and totp (which
      # build themselves in their `start:e2e`).
      #
      # ⚠️ **`--exclude alepha-monorepo` is load-bearing.** The root workspace
      # has an `e2e` script of its own, `foreach -Wpt run e2e`, so dropping
      # the flag runs every suite a second time, both copies at once: the
      # first version of this job died on `EADDRINUSE` after 11 minutes that
      # way. Yarn's recursion guard is keyed on the workspace AND the script
      # name, so it does not cover a shell calling the script.
      - name: Run E2E Tests
        timeout-minutes: 20
        run: yarn workspaces foreach -Wpt --exclude alepha-monorepo run e2e

  # The accessibility scan of the showcase (#Q3349): axe on every route of
  # `apps/ui` in light, dark and both colour-blind token sets. Its own job and
  # Playwright config (`playwright.a11y.config.ts`), off the critical path of
  # `framework-e2e-apps`. It blocks the framework deploy, on purpose, against
  # `apps/ui/e2e/a11y-baseline.ts`: a finding missing from it fails, and so
  # does an entry no finding matches any more.
  #
  # Three shards (#Q3870): the scan alone took 5.5 to 7 min. It is one spec
  # file, which Playwright gives whole to one shard unless the config is
  # `fullyParallel`: `playwright.a11y.config.ts` sets it, for this. Each test
  # is one page checked against its own baseline entries, so a shard needs
  # nothing from another.
  framework-e2e-a11y:
    if: contains(fromJSON('["all", "framework"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: framework
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Build Showcase
        run: yarn workspaces foreach -Wpt --include ui run build

      - name: Setup Playwright
        uses: ./.github/actions/playwright
        with:
          working-directory: framework

      - name: Run Accessibility Scan
        timeout-minutes: 22
        run: yarn w ui e2e:a11y --shard=${{ matrix.shard }}/3

  # `yarn pack`s the workspace and installs the tarball into a throwaway
  # project, so a failure here means a packaging bug rather than a UI one.
  #
  # Two legs (#Q3884). Vitest already runs the six spec files side by side,
  # so the suite lasts as long as its longest file, `infra.e2e.spec.ts`
  # (180 s on run 44310177164, against 146 s for the next): it runs alone,
  # and the five others together. Not `--shard`: that splits by a hash of
  # the path, and nothing would keep the long file by itself.
  framework-e2e-cli:
    name: framework-e2e-cli (${{ matrix.leg }})
    if: contains(fromJSON('["all", "framework"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: framework
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: infra
            files: src/infra.e2e.spec.ts
          - leg: rest
            files: --exclude '**/infra.e2e.spec.ts'
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      # The tarball carries `dist/`, so the build has to have happened. The
      # packages only (#Q3884): the specs pack `alepha`, `@alepha/*` and
      # `create-alepha`, and `yarn build` also built nine apps nobody here
      # reads, most of its 2 min 43. `package:docs` is the other half of
      # `yarn build`: the docs `alepha docs` prints from the tarball.
      - name: Build Packages
        run: yarn alepha package:docs && yarn workspaces foreach -Wpt --include '{alepha,create-alepha,@alepha/*}' run build

      # `image.e2e.spec.ts` builds, runs and pushes a scaffolded project's
      # images with `alepha image` (#Q3361), on the runner's Docker.
      - name: Run CLI E2E Tests
        timeout-minutes: 10
        run: yarn e2e-cli ${{ matrix.files }}

  # ══════════════════════════════════════════════════════════════════════
  # Lore, in `lore/`.
  # ══════════════════════════════════════════════════════════════════════

  lore-checks:
    if: contains(fromJSON('["all", "lore"]'), inputs.product || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lore
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          check-lockfile: "true"

      - name: Lint Project
        run: yarn lint

      # `yarn lint` fixes in place; a diff after it means a commit that was
      # never linted.
      - name: Lint Left Nothing To Fix
        run: git diff --exit-code

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: i18n Catalog Check
        run: yarn check:i18n

      - name: DB Migrations Check
        run: yarn check:migrations

      - name: Conventions Check
        run: yarn check:conventions

  # Six shards since #Q3870, from two. With no job waiting for a runner, a
  # Verify run is as long as its longest job, and that was this one: 8.6 and
  # 10.5 min for the two shards on run 44303211730, about a minute of it
  # setup. Vitest shards by sha1 of the spec's path into equal counts.
  lore-test:
    if: contains(fromJSON('["all", "lore"]'), inputs.product || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lore
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test Project
        run: yarn alepha test --shard ${{ matrix.shard }}/6

  # ──────────────────────────────────────────────────────────────────────
  # Lore on Postgres (#Q3473): Lore's migrations/postgres applied to an empty
  # database, then the specs that reach Lore's raw SQL, through
  # `alepha test --dialect postgres`. Only those specs: the whole suite took
  # 18 to 27 min on one runner, and runs on Postgres in Nightly.
  #
  # ⚠️ NOT blocking, on purpose: `continue-on-error` keeps a red run from
  # failing the Lore gate, so it never holds a deploy back. Lore's raw SQL is
  # still SQLite-only in places (#E141); drop `continue-on-error` when E141
  # lands and this job is green.
  #
  # Three shards (#Q3870): not blocking is not the same as not waited for.
  # `gate (lore)` needs this job, and at 9.4 min whole it was the second
  # longest of the run. Each shard starts its own Postgres.
  # ──────────────────────────────────────────────────────────────────────
  lore-test-postgres:
    if: contains(fromJSON('["all", "lore"]'), inputs.product || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: lore
    env:
      POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:15432/postgres
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      # Started by hand, not as a service container: a service cannot pass
      # server flags. Every spec creates and drops a schema of Lore's ~90
      # tables in parallel, and DROP SCHEMA ... CASCADE takes a lock per
      # object: at the default 64 the run dies of "out of shared memory". The
      # larger lock table lives in shared memory, which Docker caps at 64 MB
      # by default; without `--shm-size` the server crashes mid-run.
      - name: Start Postgres
        run: |
          docker run -d --name postgres -p 15432:5432 --shm-size=1g \
            -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres -c max_locks_per_transaction=1024
          until docker exec postgres pg_isready -U postgres; do sleep 1; done

      # A drizzle `--> statement-breakpoint` is a SQL comment, so psql runs
      # each migration file as it is, in order, and stops at the first error.
      - name: Apply migrations/postgres
        run: |
          docker exec postgres psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE lore_migrations"
          for file in apps/lore/migrations/postgres/*/migration.sql; do
            echo "Applying $file"
            docker exec -i postgres psql -U postgres -d lore_migrations -v ON_ERROR_STOP=1 -q < "$file"
          done

      # The specs naming a module that writes raw SQL (`sql\``, `sql.raw`,
      # `.execute(`), plus those reaching the uncovered ones through their
      # controller. Vitest takes each word as a path filter, so `automation-`
      # picks up a new automation spec unasked; a spec for a new raw-SQL
      # module elsewhere needs adding here.
      - name: Test Raw SQL on Postgres
        run: yarn alepha test --dialect postgres --shard ${{ matrix.shard }}/3
        env:
          VITEST_ARGS: >-
            apps/lore/test/automation-
            apps/lore/test/guarded-statements.spec.ts
            apps/lore/test/sigil-self-report.spec.ts
            apps/lore/test/home-open-counts.spec.ts
            apps/lore/test/owns-project-query-count.spec.ts
            packages/@lore/ship/test/SigilIngest
            packages/@lore/ship/test/sigil-
            packages/@lore/ship/test/insights-controller.spec.ts
            packages/@lore/ship/test/lore-analytics.spec.ts
            packages/@lore/ship/test/uptime-retention.spec.ts
            packages/@lore/ship/test/uptime-controller.spec.ts
            packages/@lore/ship/test/open-error-counter.spec.ts
            packages/@lore/remember/test/folio-
            packages/@lore/plan/test/WorkAutomationSelections.spec.ts
            packages/@lore/plan/test/release-default.spec.ts
            packages/@lore/plan/test/quest-count.spec.ts
            packages/@lore/chat/test/chat-

  lore-e2e:
    if: contains(fromJSON('["all", "lore"]'), inputs.product || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lore
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Lore
        run: yarn w lore build

      - name: Setup Playwright
        uses: ./.github/actions/playwright
        with:
          working-directory: lore

      - name: Run E2E Tests
        timeout-minutes: 20
        run: yarn w e2e web --shard=${{ matrix.shard }}/6

  lore-e2e-cli:
    if: contains(fromJSON('["all", "lore"]'), inputs.product || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: lore
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Project
        run: yarn build

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # The Bay end-to-end builds the real Bay, from `bay/`, against this Lore.
          go-version-file: bay/go.mod
          cache-dependency-path: bay/go.sum

      - name: Run CLI E2E Tests
        timeout-minutes: 10
        run: yarn e2e-cli

  # The build Release runs, on every change (folio #F1338, #Q3363): the
  # attested image pushed to a registry on the runner, its attestations
  # asserted on the index, then the image pulled back for the smoke and the
  # size checks. A fixed port: the daemon pushes, not this shell.
  lore-docker:
    if: contains(fromJSON('["all", "lore"]'), inputs.product || 'all')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: lore
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Start a registry on the runner
        run: docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2

      # The image is amd64 and arm64 (`image.platforms`, #Q3858): the
      # Dockerfile's `RUN` line runs under emulation for arm64. Runner setup,
      # not a build: the build stays `alepha image` (folio #F1338).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build the image
        run: yarn w lore build

      - name: Build and push the attested image
        run: yarn w lore image:release --tag=127.0.0.1:5000/alepha-dev/lore:ci

      - name: Check the attestations on the index
        run: node scripts/docker-attestations.ts --image 127.0.0.1:5000/alepha-dev/lore:ci

      - name: Pull the image back
        run: docker pull 127.0.0.1:5000/alepha-dev/lore:ci

      - name: Smoke test the image
        run: bash scripts/docker-smoke.sh 127.0.0.1:5000/alepha-dev/lore:ci

      - name: Check the image size budget
        run: node scripts/docker-size.ts --image 127.0.0.1:5000/alepha-dev/lore:ci

      # The agent image (#Q3997), built for both platforms as Release builds
      # it, and its CLI asked for its version: an agent image that does not
      # build, or whose claude does not run, stops here rather than at a
      # release.
      - name: Build the agent image
        working-directory: lore/images/agent
        run: docker buildx build --platform linux/amd64,linux/arm64 --push -t 127.0.0.1:5000/alepha-dev/lore-agent:ci .

      - name: Run the agent image's claude
        run: docker run --rm --read-only --tmpfs /tmp 127.0.0.1:5000/alepha-dev/lore-agent:ci claude --version

      # The same smoke on the arm64 variant, under QEMU: an index that lists
      # arm64 is no proof that the arm64 image boots. Last, because the pull
      # moves the local tag to the arm64 image the size check must not read.
      - name: Pull the arm64 image back
        run: docker pull --platform linux/arm64 127.0.0.1:5000/alepha-dev/lore:ci

      - name: Smoke test the arm64 image
        env:
          DOCKER_DEFAULT_PLATFORM: linux/arm64
        run: bash scripts/docker-smoke.sh 127.0.0.1:5000/alepha-dev/lore:ci

  # ══════════════════════════════════════════════════════════════════════
  # Bay, the Go module in `bay/`.
  # ══════════════════════════════════════════════════════════════════════

  bay-check:
    if: contains(fromJSON('["all", "bay"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bay
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          # Read from go.mod so the version lives in exactly one place.
          go-version-file: bay/go.mod
          cache-dependency-path: bay/go.sum

      # `gofmt -l` lists misformatted files and exits 0 either way, so the
      # test has to be on its output.
      - name: Verify Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # Let's Encrypt's test CA. Without it the ACME issuance test in
      # internal/tlsconf skips, and the one path that fails silently for 90
      # days goes untested. Same version as the Dockerfile.
      - name: Install Pebble
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1 \
            github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The runner already has Docker. BAY_REQUIRE_DOCKER turns a missing
      # daemon into a failure, so the Docker runner's tests can never report
      # `ok` without having run.
      - name: Test
        env:
          BAY_REQUIRE_DOCKER: "1"
        run: go test ./...

      - name: Cross-compile for the targets Bay actually runs on
        run: |
          for target in amd64 arm64; do
            echo "→ linux/$target"
            GOOS=linux GOARCH=$target CGO_ENABLED=0 go build -o /dev/null ./cmd/bay
          done

  # ══════════════════════════════════════════════════════════════════════
  # alepha.dev, the site in `docs/`, documenting the three products from
  # their own folders (#Q2766): the site as the working tree has it, every
  # section from this commit.
  # ══════════════════════════════════════════════════════════════════════

  docs-check:
    if: contains(fromJSON('["all", "docs"]'), inputs.product || 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup
        with:
          check-lockfile: "true"

      # `gen:docs` then `gen:tree`: the framework's generated reference and
      # the tree of all three products. `gen:tree` reads the changelog from
      # the published Lore releases (#Q3638); a fork's pull request has no
      # secret, and builds the page from the sample instead.
      - name: Generate Docs
        run: yarn gen
        env:
          LORE_API_KEY: ${{ secrets.LORE_API_KEY }}

      - name: Lint Site
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Test Site
        run: yarn test

      - name: Build Site
        run: yarn build

      - name: Setup Playwright
        uses: ./.github/actions/playwright
        with:
          working-directory: docs

      - name: Run E2E Tests
        timeout-minutes: 15
        run: yarn e2e

  # ══════════════════════════════════════════════════════════════════════
  # The gates: the four checks the `main` ruleset and the merge queue require
  # (#Q3633), by these exact names. Each always runs, so a dispatch narrowed
  # to one product still reports the other three, and fails when any job of
  # its product failed or was cancelled. A skipped job is a pass.
  #
  # ⚠️ A new job joins its product's gate `needs`, or nothing waits for it.
  # ══════════════════════════════════════════════════════════════════════

  gate-framework:
    name: gate (framework)
    needs:
      - framework-checks
      - framework-test
      - framework-mqtt-broker
      - framework-e2e-apps
      - framework-e2e-a11y
      - framework-e2e-cli
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled." >&2
          exit 1
      - run: echo "Green."

  gate-lore:
    name: gate (lore)
    needs:
      - lore-checks
      - lore-test
      - lore-test-postgres
      - lore-e2e
      - lore-e2e-cli
      - lore-docker
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled." >&2
          exit 1
      - run: echo "Green."

  gate-bay:
    name: gate (bay)
    needs: [bay-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled." >&2
          exit 1
      - run: echo "Green."

  gate-docs:
    name: gate (docs)
    needs: [docs-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A job failed or was cancelled." >&2
          exit 1
      - run: echo "Green."

  # ══════════════════════════════════════════════════════════════════════
  # Verify, then deploy, by hand (#Q3869): `-f deploy=<target>` on a dispatch
  # from `main` calls Deploy once every gate is green. Nothing else reaches
  # this job: not a pull request, not a merge queue group, not Nightly's call
  # (whose run carries Nightly's name and has no `deploy` input). A push to
  # `main` starts Deploy by itself.
  #
  # ⚠️ `!cancelled()` is load-bearing (#Q3843). Without a status function
  # GitHub applies `success()`, which skips a job when ANY job upstream of it
  # was skipped, however far back: a dispatch narrowed to one product skips
  # the others' jobs, and this one with them.
  #
  # ⚠️ `actions: read` because Deploy's `verified` job asks for it, and a
  # called job never gets more than its caller grants: without it the whole
  # run fails at startup, on every event.
  # ══════════════════════════════════════════════════════════════════════

  deploy:
    needs: [gate-framework, gate-lore, gate-bay, gate-docs]
    if: >-
      !cancelled()
      && github.workflow == 'Verify'
      && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && inputs.deploy != '' && inputs.deploy != 'none'
      && needs.gate-framework.result == 'success'
      && needs.gate-lore.result == 'success'
      && needs.gate-bay.result == 'success'
      && needs.gate-docs.result == 'success'
    # A called workflow gets no more than this: Deploy's agent-image job
    # pushes to ghcr.io (#Q3997).
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ inputs.deploy }}
    secrets: inherit
