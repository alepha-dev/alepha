name: Verify

permissions:
  contents: read

on:
  # Every branch, because that is how the work is actually done here: an agent
  # works in a worktree on a `claude/**` branch, pushes it, and watches CI.
  # Until 2026-09-09 this was `main` alone, so a branch push ran NOTHING and
  # the only way to prove a branch green was to open a PR - which the working
  # agreement in CLAUDE.md forbids an agent from doing unprompted. A branch
  # could therefore only be proven by merging it.
  #
  # ⚠️ **Nothing here deploys.** This workflow verifies and stops; the deploys
  # live in `deploy-latest.yml`, which triggers on this one succeeding and
  # refuses anything whose head branch is not `main`. That is what makes a
  # branch push safe to run. Before this split the guards were in-file and
  # said `github.event_name != 'pull_request'`, which is TRUE for a push to
  # any branch - on a widened trigger that would have shipped docs, ui and
  # shop to production from every agent worktree.
  push:
    branches:
      - "**"
  # Kept, though same-repo branches no longer need it: a pull_request run is
  # the only way a FORK's code is ever tested, and this repository is public.
  # The cost is that a PR opened by hand from a local branch runs CI twice.
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

concurrency:
  # Namespaced by event, because `github.ref` for a `workflow_run` is the
  # DEFAULT BRANCH: a Release follow-up used to land in the push-to-main group
  # and cancel that run mid-test, and the push run is the only one that goes on
  # to the deploys. Lore (deployed from here then) silently did not ship, and
  # the evidence was a run marked `cancelled` that reads exactly like
  # "superseded by a newer push".
  # Two Releases in a row still supersede each other: both land in the
  # `workflow_run` group, on the same ref.
  #
  # Per branch, so two agents pushing two branches never cancel each other -
  # only a newer push to the SAME branch does.
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ **Nothing in this workflow runs a `lore` command any more** - those went
# to `deploy-latest.yml` with the deploy jobs, then left with Lore's own
# deploy (#E72), and this variable is inherited by the test jobs alone now.
#
# It stays because removing it is a change to the environment the suite runs
# in, not a tidy-up (a spec container merges over `process.env`, so a value
# set for every job reaches the code under test). The spec written to blank
# it left with Lore for github.com/alepha-dev/lore (#E72); dropping the
# variable is still its own change, with its own run to prove it.
#
# The paragraphs below are the history of why it is declared once at the top.
#
# It used to come from `lore({ project: "alepha" })` in `alepha.config.ts`,
# which meant it came from whichever directory a step happened to run in.
# Lore's own config named no project, so its artifact push died on
# `No Lore project named`, `continue-on-error` swallowed it, and the 0.28.0
# release shipped green without Lore's own artifact. A workflow-level default
# is the shape that cannot do that again.
#
# Not a secret: a project slug is in every URL Lore serves. `LORE_API_KEY` is
# the secret, and it stays on the individual steps that need it.
env:
  LORE_PROJECT: alepha

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # The static half of `yarn v`: lint, typecheck and every `check:*`.
  #
  # This job and `test` below are the job that used to be called `verify`,
  # split in two on 2026-09-09. Together they are still exactly `yarn v` minus
  # its build and e2e half, so a red one here is the same red you would have
  # got locally - it just says which half, without waiting for the other. The
  # split is also the shape sharding needs: `test` can fan out across runners
  # without dragging these seven cheap steps through every one of them.
  #
  # Measured on run 34291618784, where this was all one job: these steps are
  # 117s of it and `yarn alepha test` is 870s.
  #
  # ⚠️ The service containers are kept, and kept UNPROVEN. Nothing in these
  # steps obviously wants postgres, but `check:migrations` boots each app's
  # server entry through `loadAlephaFromServerEntryFile`, and whether that
  # connects has never been tested: this half has always run with the
  # containers already up. Dropping them is worth ~16s and is a deliberate
  # experiment, not a tidy-up to smuggle into a split.
  # ──────────────────────────────────────────────────────────────────────
  checks:
    runs-on: ubuntu-latest
    # A hang detector, not a budget. Public-repo minutes are free and the
    # GitHub cap is 6 hours, so a generous number costs nothing while a tight
    # one costs a blocked deploy: a job killed on the timeout reports as the
    # failure the deploys gate on.
    timeout-minutes: 30
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3:
        image: versity/versitygw:v1.8.0
        ports:
          - 19090:7070
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_REGION: eu-west-1
          VGW_QUIET: "true"
          ROOT_ACCESS_KEY: mock
          ROOT_SECRET_KEY: mock
        options: --tmpfs /data:size=4g

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      - name: Prepare
        run: yarn copy

      - name: Lint Project
        run: yarn lint

      - name: TypeScript Check
        run: yarn typecheck

      - name: Dependencies Check
        run: yarn check:deps

      - name: DB Migrations Check
        run: yarn check:migrations

      - name: Conventions Check
        run: yarn check:conventions

      - name: Docs Check
        run: yarn check:docs

  # ──────────────────────────────────────────────────────────────────────
  # The unit and integration suite - `yarn v`'s longest single step, and the
  # other half of the old `verify` job.
  #
  # Sharded six ways, with `alepha test --shard i/6`, which reaches vitest as
  # `vitest run --shard=i/6` (#Q2479; it used to ride `VITEST_ARGS`).
  #
  # ⚠️ **Six is the ceiling, and it is not a round number - it is where this
  # job stops being the critical path.** Measured on run #1691, which ran
  # this at four: the shards came in at 5.7 / 6.5 / 6.2 / 6.2min against
  # 20.3min unsharded, which splits into ~89s of fixed setup per shard and
  # ~1192s of shardable work. So six lands at ~4.8min and eight at ~4.0min -
  # and `e2e-apps` sits at 6.2min, unsharded, with a floor it cannot leave
  # while every e2e job rebuilds the world. Past six the extra shards finish
  # early and wait.
  #
  # Raising it again is therefore the wrong lever twice over: it buys no wall
  # clock, and it costs 89s of setup per added shard plus one more draw from
  # a flake distribution this repository knows is environmental. The lever
  # that was left, the full `yarn build` in the three e2e jobs, was pulled on
  # 2026-09-22 (see the e2e header below): on run 35762516839 `e2e-apps` fell
  # to 4.5min and these shards became the critical path again, with
  # `e2e-cli`, so this ceiling argument needs re-measuring before it is
  # quoted again.
  #
  # ⚠️ Vitest shards by sha1 of the spec's path, sorted, sliced into equal
  # COUNTS - not by duration, and not per project. With 868 spec files that
  # balances well (the four shards above spread 0.8min); it would not for a
  # handful of files, and vitest refuses outright when the shard count
  # exceeds the file count.
  #
  # Coverage is NOT measured here. It lives in `coverage.yml`, nightly, and
  # that file carries the reasoning: Lore keeps one quality row per branch per
  # day, so eighteen of the ~19 pushes a day were overwritten before anyone
  # read them, and the instrumentation was costing ~2min on the critical path
  # to the deploys to produce them. Read `coverage.yml` before moving it back.
  # ──────────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A failing shard must not cancel its siblings. The point of running the
      # suite is to learn everything that is broken, and `fail-fast: true`
      # (the default) turns four shards into "the first one to fail", which is
      # strictly less than the single job this replaced told you.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      redis:
        image: redis
        ports:
          - 16379:6379

      postgres:
        image: postgres
        ports:
          - 15432:5432
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

      s3:
        image: versity/versitygw:v1.8.0
        ports:
          - 19090:7070
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_REGION: eu-west-1
          VGW_QUIET: "true"
          ROOT_ACCESS_KEY: mock
          ROOT_SECRET_KEY: mock
        options: --tmpfs /data:size=4g

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      # `yarn copy` minus its `yarn lint`, which is `checks`' job. The lint half
      # is oxlint (19s) then oxfmt (6s), measured on run 35669284608, and every
      # runner but `checks` repeated it for nothing.
      #
      # oxfmt stays: the generators write unformatted pages (`docs/framework`,
      # every package README) and the committed copies are the formatted ones,
      # so without it the suite would run on a tree `yarn v` never sees.
      #
      # ⚠️ **`--exclude alepha-monorepo` is load-bearing**, for the reason the
      # `e2e-apps` step spells out: the root has a `copy` script of its own,
      # and it is `foreach run copy && yarn lint`, so `-A` without the exclude
      # runs every generator twice, concurrently, and the lint after all.
      - name: Prepare
        run: yarn workspaces foreach -Apt --exclude alepha-monorepo run copy && yarn oxfmt

      # No `--coverage`. That flag is what `coverage.yml` runs nightly, and it
      # carries five of the nine numbers Lore stores, not four: it also turns
      # on the JSON test reporter. Nothing in this job reads either report.
      - name: Test Project
        run: yarn alepha test --shard ${{ matrix.shard }}/6

      # Here rather than in `checks`, because two of the six bun specs are
      # `BunPostgresProvider` and `BunRedisProvider`: they want the service
      # containers above. It costs 3s, so it rides with the suite it belongs
      # to rather than buying `checks` a reason to keep the containers.
      #
      # On one shard only: `bun test` takes no `--shard`, so without this the
      # same six specs would run four times and a failure would report four
      # times over.
      - name: Test Bun Providers
        if: matrix.shard == 1
        run: yarn test:bun

  # ──────────────────────────────────────────────────────────────────────
  # Build + E2E, as two jobs. The long pole of the workflow, and the half
  # of `yarn v` the two jobs above skip.
  #
  # One job until 2026-09-09, where `yarn e2e` ran every app's suite through
  # `foreach -p` and then `yarn e2e-cli` after it. Measured on run
  # 34291618784: 653s for the suites, of which **lore alone was 10.8 minutes**
  # (171 tests, 2 workers) and every other app finished inside 2.1 minutes.
  # Lore's suite then got a sharded job of its own, until Lore left for
  # github.com/alepha-dev/lore (#E72).
  #
  # Each builds its own rather than sharing one through an artifact, and that
  # is arithmetic, not laziness: a serialised build job costs its own ~82s of
  # setup before anything can start, which is more than the download saves.
  # Two builds in parallel are cheaper than one in front.
  #
  # ⚠️ **And each builds only what it tests.** Until 2026-09-22 every e2e job
  # ran `yarn build`, every workspace, 164s of a 6.5min `e2e-apps` on run
  # 35669284608. An app does not need a single package built: every
  # framework package's `exports` points at `src/`, the `alepha` bin is
  # `src/bin/index.ts`, and `alepha build` compiles the framework from source
  # into the app's own `dist/`. `e2e-cli` is the exception and keeps
  # `yarn build`: it runs `yarn pack`, and the tarball carries each
  # package's `dist/`.
  #
  # The suites are bounded on the STEP, not just the job. Playwright's
  # `globalTimeout` covers the tests but not teardown, and teardown is where
  # this hangs: a failing run once printed its results and then sat five
  # minutes holding orphaned wrangler and browser processes until the job cap
  # killed everything, which reads as "CI is slow" rather than "two tests
  # failed".
  #
  # No service containers on any of them, deliberately. Only `vitest.config.ts`
  # points at those, and that is `test` above: every app these jobs build is
  # SQLite or nothing (shop injects `:memory:`, docs injects no
  # `DATABASE_URL` at all, and `alepha/orm` picks SQLite unless the URL starts
  # with `d1:`). Nothing here references REDIS_URL or S3_ENDPOINT, and
  # `node dist` does not read `.env`, so the containers were unreachable
  # rather than merely unused.
  # ──────────────────────────────────────────────────────────────────────
  e2e-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      # See `test` above: the generators and oxfmt, not `yarn lint`.
      - name: Prepare
        run: yarn workspaces foreach -Apt --exclude alepha-monorepo run copy && yarn oxfmt

      # The four apps the step below runs, and nothing else. Their suites
      # read their own `dist/` only.
      - name: Build Project
        run: yarn workspaces foreach -Apt --include '{docs,ui,shop,ssr}' run build

      - name: Setup Playwright
        uses: ./.github/actions/playwright

      # `yarn e2e`: docs, ui, examples/shop and examples/ssr.
      #
      # ⚠️ **`--exclude alepha-monorepo` is load-bearing and is NOT tidy-up.**
      # `-A` includes the repository root, the root workspace has an `e2e`
      # script of its own, and that script is `foreach -Apt run e2e` with no
      # exclusions - so dropping this flag makes the step run every suite a
      # second time, both copies at once. That is not a theoretical risk: it
      # is what the first version of this job did.
      # Two concurrent `docs` runs then raced for the same derived port and
      # the step died on `EADDRINUSE` after 11 minutes, which reads as a
      # flaky port allocator rather than as a recursive foreach.
      #
      # Yarn's own recursion guard does not cover this. It is keyed on the
      # workspace AND the script name, so it saves `yarn e2e` (root `e2e`
      # calling root `e2e`) and saves nothing here, where the caller is a
      # shell rather than the script being called. A root `e2e:apps` script
      # was tried first for exactly that reason and recursed the same way.
      - name: Run E2E Tests
        timeout-minutes: 20
        run: yarn workspaces foreach -Apt --exclude alepha-monorepo run e2e

  # Its own job for the reason it was already its own step: `e2e-cli` packs
  # the workspace with `yarn pack` and installs the tarball into a throwaway
  # project, so a failure here means a packaging bug rather than a UI one.
  # No Playwright - it drives the CLI, not a browser.
  e2e-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Clean
        run: yarn clean

      # See `test` above: the generators and oxfmt, not `yarn lint`.
      - name: Prepare
        run: yarn workspaces foreach -Apt --exclude alepha-monorepo run copy && yarn oxfmt

      # The tarball carries `dist/`, so the build has to have happened:
      # `apps/e2e-cli/src/cli.e2e.spec.ts` fails with a named error rather
      # than a mysterious one when it has not.
      - name: Build Project
        run: yarn build

      # `cli.e2e.spec.ts` serves the node build under Deno and fails without
      # it, on purpose: a skipped test is how a green run lies. `v2.x` rather
      # than a pin: only the current Deno is supported, and a new release that
      # breaks the node slice is exactly what the test is there to notice.
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run CLI E2E Tests
        timeout-minutes: 10
        run: yarn e2e-cli
