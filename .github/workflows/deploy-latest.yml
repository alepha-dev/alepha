name: Deploy latest

permissions:
  contents: read

# ---------------------------------------------------------------------------
# The deploy half, split out of `ci.yml` on 2026-09-09. `verify.yml` is the
# other half and this file is downstream of it: nothing here decides whether
# the code is good, only where it goes.
#
# **Why a second file at all.** An agent works in a worktree, pushes a
# `claude/**` branch and watches CI. When the deploys lived in the same
# workflow they still ran as jobs and were skipped by an `if:` - correct, but
# four grey nodes on every branch run, and one edit away from not being
# skipped. Downstream, with the branch filter below, no run is created at all
# unless Verify ran on main.
#
# ⚠️ **Three things about `workflow_run` that are not obvious, and two of them
# have already cost this repository a silent missed deploy:**
#
#  1. It fires on FAILURE as well as success. Every job below checks
#     `conclusion == 'success'` itself; there is no workflow-level gate.
#  2. `github.ref` is the DEFAULT BRANCH, not the branch that ran. Never gate
#     on it and never check out from it - use `workflow_run.head_branch` and
#     `workflow_run.head_sha`, which is what every job below does.
#  3. The file that runs is always the DEFAULT BRANCH's copy of this one. That
#     is a feature: deploy logic cannot be edited from a branch, so a branch
#     cannot teach itself to deploy.
#
# ⚠️ **Per-deploy gating could not survive the split.** A `workflow_run` gate
# is atomic - Verify passed or it did not. ui and shop used to need only
# `[checks, test]` and could ship while e2e was still running. They now wait
# for all of Verify, which costs them a minute or two and is arguably more
# honest.
#
# ⚠️ **The docs at `alepha.dev` are not deployed from here (#Q2480).** They
# document the framework, and a project installs the last npm version, not
# `main`. A site that moved with every push described APIs nobody could
# install yet, so `release.yml` deploys it, with the version it publishes.
# ---------------------------------------------------------------------------
on:
  workflow_run:
    workflows: ["Verify"]
    types:
      - completed
    # ⚠️ This filter reads the head branch of the TRIGGERING run, not
    # `github.ref` (which point 2 above says is always the default branch). It
    # is the only place `workflow_run` will tell you the real branch before a
    # run exists, and that is the point: without it every `claude/**` push
    # created a Deploy latest run that skipped all four jobs in four seconds,
    # filed under `main` because of point 2, and left a grey line in the run
    # list next to the Verify it belonged to. Those runs decided nothing.
    # With it, no run is created at all.
    #
    # The `head_branch == 'main'` checks on the jobs below stay. They are not
    # redundant: the filter keeps the history clean, the job conditions keep
    # the deploy correct, and only one of them survives someone adding a
    # second trigger to this block.
    branches:
      - main

concurrency:
  # ⚠️ Keyed on the HEAD BRANCH, never on `github.ref` - see point 2 above.
  # `github.ref` is the default branch for every `workflow_run`, so a group
  # built from it would put every branch's deploy in one bucket and cancel
  # them against each other.
  group: deploy-latest-${{ github.event.workflow_run.head_branch }}
  # Deliberately NOT cancel-in-progress. A deploy that is halfway through
  # `platform up` has already run migrations; cancelling it leaves the
  # database ahead of the Worker. A superseded deploy is wasteful, an
  # interrupted one is a broken production.
  cancel-in-progress: false

# Where a `lore` command in this workflow would report, named once so no step
# can forget. None runs here since Lore's own deploy left with Lore for
# github.com/alepha-dev/lore (#E72); the variable stays so this file,
# `verify.yml` and `release.yml` keep naming the same project.
#
# It used to come from `lore({ project: "alepha" })` in `alepha.config.ts`,
# which meant it came from whichever directory a step happened to run in.
# Lore's own config named no project, so its artifact push died on
# `No Lore project named`, `continue-on-error` swallowed it, and the 0.28.0
# release shipped green without Lore's own artifact. A workflow-level default
# is the shape that cannot do that again.
#
# Not a secret: a project slug is in every URL Lore serves. `LORE_API_KEY` is
# the secret, and it stays on the individual steps that need it.
env:
  LORE_PROJECT: alepha

jobs:
  # ---------------------------------------------------------------------------
  # The component showcase at `ui.alepha.dev`, and the shop demo at
  # `shop.alepha.dev`, deployed with `alepha platform up` (#Q2576).
  #
  # They went through Lore Deploy from #E1 until Lore left this repository
  # (#E72). `platform({ project: "alepha" })` gives them the names Lore had
  # given their Workers (`alepha-<app>-production`), so the first `up` took
  # each Worker and its Custom Domain over instead of colliding with it.
  # Cloudflare credentials are repository secrets; each app's own secrets live
  # in its GitHub environment and reach the Worker through the job env.
  # ---------------------------------------------------------------------------
  deploy-ui-production:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ui-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # `alepha-ui-production` (`platform({ project: "alepha" })`), the Worker
      # Lore Deploy created, taken over with its Custom Domain (#Q2576).
      - name: Deploy
        working-directory: apps/ui
        run: yarn alepha platform up --env production

  deploy-shop-production:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: shop-production

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-tags: true

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare
        run: yarn copy

      # A demo: its data is disposable. Secrets come from the `shop-production`
      # environment and are resolved from the job env by `platform up`.
      - name: Deploy
        working-directory: apps/examples/shop
        run: yarn alepha platform up --env production
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
