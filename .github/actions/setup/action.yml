name: Setup
description: Setup Node.js with Yarn

# What an install produces is cached, not what it downloads (#Q3883): every
# `node_modules` folder and Yarn's install state, keyed on the lockfile. A hit
# skips both the 1.15 GB Yarn download cache and the install, which together
# were 54 s of every job. A miss is the old path, unchanged.
inputs:
  save-cache:
    description: >-
      Save the node_modules cache when this job had to install. One job per
      workflow sets it: a new lockfile is a miss in every job at once, and
      each would otherwise tar 1.4 GB to learn another job already had.
    required: false
    default: "false"
  check-lockfile:
    description: >-
      Fail when yarn.lock is out of step with a package.json. An install does
      this by itself, and a cache hit skips the install: a checks job asks
      for it, so a stale lockfile stays red.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Node first, then corepack, and that order is the fix.
    #
    # `corepack enable` used to run BEFORE this step, against whatever Node the
    # runner image happened to boot with. Node 26 — the version installed right
    # here — ships no corepack at all, so the only reason `yarn` resolved
    # afterwards was that the image's older Node had left a shim on PATH.
    # Nothing declared that, nothing tested it, and the day the image stopped
    # bundling corepack every job would have failed at `yarn` with no clue why.
    #
    # `cache: "yarn"` is deliberately NOT set. setup-node's caching runs the
    # package manager to find its cache directory, which would put a `yarn` call
    # back in front of the corepack install and reintroduce exactly the
    # dependency being removed. The cache is done by hand below instead.
    - name: Prepare Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "26.x"

    # Pinned, like every action in this repository. `corepack@latest` would let
    # the toolchain that installs our dependencies change without a commit,
    # which is the same fragility this step exists to remove, one level up.
    #
    # `--force` because Node versions that DO bundle corepack own
    # `/usr/local/bin/corepack`, and npm refuses to overwrite a binary it did
    # not place there. Harmless on Node 26, which bundles none.
    - name: Install Corepack
      run: |
        npm install -g --force corepack@0.36.0
        corepack enable
      shell: bash

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: "1.3.14"

    # A lockfile-only install, then a diff: `--immutable` refuses to combine
    # with `--mode=update-lockfile`, and CI turns immutable on by itself, hence
    # the variable. It links nothing and downloads nothing a complete lockfile
    # already names.
    #
    # ⚠️ Before the cache restore, on purpose: this run writes
    # `.yarn/install-state.gz` with no link data in it, and the restore (or
    # the install, on a miss) has to be what leaves that file behind.
    #
    # When it runs, this is the first `yarn` invocation, so it is where
    # corepack downloads the version `packageManager` names.
    - name: Lockfile is up to date
      if: inputs.check-lockfile == 'true'
      env:
        YARN_ENABLE_IMMUTABLE_INSTALLS: "false"
      run: |
        fresh() {
          if ! git diff --exit-code -- yarn.lock; then
            echo "::error title=Stale yarn.lock::yarn.lock is out of step with a package.json. Run yarn install and commit the lockfile."
            exit 1
          fi
          exit 0
        }
        log="$RUNNER_TEMP/yarn-install.log"
        for attempt in 1 2 3; do
          if yarn install --mode=update-lockfile 2>&1 | tee "$log"; then
            fresh
          fi
          if ! grep -qF 'handler was attached after the promise settled' "$log"; then
            exit 1
          fi
          echo "::warning title=Yarn onCancel crash::yarn crashed in its HTTP retry path (attempt $attempt of 3)"
          if [ "$attempt" -lt 3 ]; then
            delay=$((5 * attempt * attempt))
            echo "waiting ${delay}s before retrying"
            sleep "$delay"
          fi
        done
        exit 1
      shell: bash

    # ⚠️ The paths are spelled per product folder, never `**/node_modules`:
    # that glob also matches every nested folder INSIDE a node_modules, which
    # the archive would then hold twice. A workspace sits one or two levels
    # under `apps/` or `packages/`; the step after the install fails the job
    # that saves if a `node_modules` ever appears anywhere else, because a
    # folder missing from a restore is a wrong version resolved in silence.
    #
    # No `restore-keys`: a near miss would restore an old tree, then need the
    # download cache and an install on top, which is slower than a miss.
    #
    # Restore only. Every cache written from a pull request is private to it,
    # so what a new pull request finds is what a job on `main` saved.
    - name: Restore node_modules
      id: modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          docs/node_modules
          framework/node_modules
          framework/apps/*/node_modules
          framework/apps/*/*/node_modules
          framework/packages/*/node_modules
          framework/packages/*/*/node_modules
          lore/node_modules
          lore/apps/*/node_modules
          lore/apps/*/*/node_modules
          lore/packages/*/node_modules
          lore/packages/*/*/node_modules
          .yarn/install-state.gz
        key: ${{ runner.os }}-${{ runner.arch }}-node26-modules-v1-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}

    # Everything below runs on a miss only.

    # Asked of yarn rather than hardcoded to `~/.yarn/berry/cache`: the folder
    # is a yarn setting, and a path that silently stops matching turns into a
    # cache that never hits — slower every run, and green, so nobody looks.
    - name: Resolve the Yarn cache folder
      if: steps.modules.outputs.cache-hit != 'true'
      id: yarn-cache
      run: |
        folder="$(yarn config get cacheFolder)"
        [ -n "$folder" ] || { echo "could not resolve the Yarn cache folder"; exit 1; }
        echo "folder=$folder" >> "$GITHUB_OUTPUT"
      shell: bash

    # Keyed on the lockfile, with a prefix fallback so a dependency bump warms
    # from the previous install rather than downloading the whole tree again.
    - name: Cache Yarn downloads
      if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-cache.outputs.folder }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: ${{ runner.os }}-yarn-

    # Retried on exactly one failure: Yarn dying with "The `onCancel` handler
    # was attached after the promise settled". That is got's retry path inside
    # Yarn, not our lockfile. A registry request that errors after its promise
    # already settled schedules a retry on a timer, the retry attaches a cancel
    # handler to the settled promise, and the throw from inside the timer kills
    # the process.
    #
    # The backoff is the point, and it is what this step was missing. On main
    # at 7c6277edf all three attempts crashed inside four seconds, each about
    # 1.3s into the Resolution step: with no delay between them, three attempts
    # are one attempt under the same conditions. Sleeping 5s then 15s gives the
    # race three genuinely different moments, which is the only thing a retry
    # can buy against a timing bug.
    #
    # `enableHardenedMode` used to be forced on in .yarnrc.yml, which sent
    # every job to the registry for the whole lockfile and handed the race
    # seventeen chances per Verify run. That flag is gone; see .yarnrc.yml for
    # why Yarn's own default is the right setting.
    #
    # Any other failure still fails on the first attempt. A blanket retry would
    # turn a real resolution error into three slow identical ones.
    #
    # ⚠️ The lockfile check above carries the same loop: change both.
    - name: Install Dependencies
      if: steps.modules.outputs.cache-hit != 'true'
      run: |
        log="$RUNNER_TEMP/yarn-install.log"
        for attempt in 1 2 3; do
          if yarn install 2>&1 | tee "$log"; then
            exit 0
          fi
          if ! grep -qF 'handler was attached after the promise settled' "$log"; then
            exit 1
          fi
          echo "::warning title=Yarn onCancel crash::yarn crashed in its HTTP retry path (attempt $attempt of 3)"
          if [ "$attempt" -lt 3 ]; then
            delay=$((5 * attempt * attempt))
            echo "waiting ${delay}s before retrying"
            sleep "$delay"
          fi
        done
        exit 1
      shell: bash

    - name: Every node_modules folder is one the cache covers
      if: steps.modules.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      run: |
        covered='^(node_modules|(docs|framework|lore)/node_modules|(framework|lore)/(apps|packages)/[^/]+(/[^/]+)?/node_modules)$'
        missed=$(find . -name node_modules -type d -prune | sed 's#^\./##' | grep -vE "$covered" || true)
        if [ -n "$missed" ]; then
          echo "::error title=node_modules outside the cache::Add these to the paths of both cache steps in .github/actions/setup/action.yml: $(echo $missed)"
          exit 1
        fi
      shell: bash

    # ⚠️ The same paths and key as the restore above, to the letter: the two
    # are one cache only while they match.
    - name: Save node_modules
      if: steps.modules.outputs.cache-hit != 'true' && inputs.save-cache == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          node_modules
          docs/node_modules
          framework/node_modules
          framework/apps/*/node_modules
          framework/apps/*/*/node_modules
          framework/packages/*/node_modules
          framework/packages/*/*/node_modules
          lore/node_modules
          lore/apps/*/node_modules
          lore/apps/*/*/node_modules
          lore/packages/*/node_modules
          lore/packages/*/*/node_modules
          .yarn/install-state.gz
        key: ${{ steps.modules.outputs.cache-primary-key }}
