# Bay's checks, on the platform Bay ships for.
#
# A task that runs once and exits, never a daemon. Reached through
# `./test-linux.sh`, never directly, because Docker being down has to be a
# loud, explained failure rather than a stack trace.
services:
  bay-test:
    # No build args, and that is deliberate: the Go version is pinned in the
    # Dockerfile, and ci.sh asserts at run time that it matches go.mod. A
    # checked duplicate beats a required variable.
    build:
      context: .
    # The Docker runner's tests drive the host's daemon (below), and the
    # containers they start publish on the daemon's loopback. Sharing the
    # daemon's network namespace is what lets the tests reach 127.0.0.1:<port>;
    # under Docker Desktop that is the VM's namespace, which is where the ports
    # are published.
    network_mode: host
    environment:
      # No daemon is a failure here, never a skip: see requireDocker.
      BAY_REQUIRE_DOCKER: "1"
      # A bind mount names a path on the daemon's side. This directory is
      # mounted at the same path on both sides, so what a test writes is what
      # the daemon mounts. See daemonTempDir.
      BAY_DOCKER_TESTDIR: /tmp/bay-docker-tests
    volumes:
      # Read-only on purpose. The container runs as root, and this is the only
      # host path it can see, so a test run can never leave root-owned files in
      # the working tree. Everything Go writes (build cache, module cache) lives
      # inside the container.
      - .:/src:ro
      # The host's Docker socket, for the Docker runner's tests. Root-equivalent
      # on the host, like Bay's own use of it: this container is a test task
      # that runs Bay's own code and exits, nothing else.
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/bay-docker-tests:/tmp/bay-docker-tests
