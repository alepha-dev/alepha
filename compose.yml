services:

  redis:
    restart: always
    image: redis:latest
    ports:
      - "16379:6379"

  postgres:
    restart: always
    image: postgres:latest
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  s3mock:
    restart: always
    image: adobe/s3mock:latest
    ports:
      - "19090:9090"
    # S3Mock has no in-memory mode: every object lands on its filesystem store.
    # Left in the container's writable layer it reached ~40 GB in two weeks,
    # filled Docker's virtual disk, and put postgres into a "No space left on
    # device" crash loop — every DB-backed test failed. The image still ships a
    # `root=/s3mockroot` env from 2.x, but the property has since been renamed,
    # so without the variable below the store silently falls back to a temp dir
    # inside the layer.
    #
    # The heap cap is disk hygiene too, not tuning: S3Mock serves objects
    # through streams it only closes on GC, and a deleted-but-open file keeps
    # its tmpfs pages. At the default heap, GC is rare enough that each
    # bucket-suite run pinned ~13-26 MB of deleted objects (measured 34→61 held
    # fds over five runs); at 64 MB the constant GC closes them and five runs
    # leave ~44 KB. The whole suite, 48 MB multipart upload included, passes
    # against this heap.
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      JAVA_TOOL_OPTIONS: -Xmx64m
    # RAM-backed and hard-capped: leftover objects cost bounded memory, never
    # disk, and are wiped by a container restart (a restart:always container
    # outlives its writable layer's cleanup forever; a tmpfs does not survive a
    # Docker restart). The bucket suite drains its containers in afterAll
    # (`emptyBuckets` in packages/alepha/src/bucket/__tests__/shared.ts), so a
    # run leaves the store roughly empty and the cap is a backstop, not a
    # countdown. If it ever fills anyway, bucket tests alone fail (postgres is
    # untouched) — `docker compose -p alepha up -d s3mock` recreates the store.
    volumes:
      - type: tmpfs
        target: /s3mockroot
        tmpfs:
          size: 4gb

  emqx:
    restart: always
    image: emqx/emqx:latest
    ports:
      - "11883:1883"
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
      # Pin the Erlang node name. Left to itself the entrypoint builds it from
      # `hostname -f`, which fails inside the compose network ("Temporary
      # failure in name resolution") and yields `emqx@` — an empty host that
      # kills the kernel on boot, so the container restart-loops and every MQTT
      # test fails with the broker simply absent.
      EMQX_NODE__NAME: "emqx@127.0.0.1"

  # A local npm registry, for rehearsing a release before it is irreversible.
  #
  # `yarn v` proves the monorepo is green, but it proves it against the
  # workspace: in here `node_modules/.bin/alepha` points at
  # `packages/alepha/src/bin/index.ts` — raw TypeScript, type-stripped by node.
  # What npm ships is `dist/bin/index.js`, because `publishConfig` rewrites
  # `main`, `types`, `bin` and the whole `exports` map at publish time. Nothing
  # in the pipeline runs that second artifact, so a broken `exports` subpath or
  # a `files` entry left behind is only discovered by whoever installs it.
  #
  # Publish here, install from here into a directory outside the workspace, and
  # the artifact is the one npm would have served. Config in
  # `scripts/verdaccio.yaml` — read the comment there before changing it, the
  # missing `proxy` on our own packages is deliberate.
  verdaccio:
    restart: always
    image: verdaccio/verdaccio:latest
    ports:
      - "14873:4873"
    volumes:
      - ./scripts/verdaccio.yaml:/verdaccio/conf/config.yaml:ro

  # Bay's checks, on the platform Bay ships for.
  #
  # The odd one out in this file: everything above is a daemon that stays up
  # while you develop, this is a task that runs once and exits. Hence the
  # profile — without it, `docker compose up` would start a test run alongside
  # the databases and sit there having "failed" to stay alive.
  #
  # Reached through `yarn w bay test:linux`, never directly, because Docker
  # being down has to be a loud, explained failure rather than a stack trace.
  bay-test:
    profiles: ["tools"]
    # No build args, and that is deliberate. Compose interpolates the WHOLE file
    # before it looks at profiles, so a `${VAR:?}` here would make a plain
    # `docker compose up` — the everyday command that starts postgres and redis
    # — fail on a variable belonging to a service it was never going to start.
    #
    # The Go version is therefore pinned in the Dockerfile, and ci.sh asserts at
    # run time that it matches go.mod. A checked duplicate beats a required
    # variable that breaks everything else.
    build:
      context: ./apps/bay
    volumes:
      # Read-only on purpose. The container runs as root, and this is the only
      # host path it can see — so there is no way for a test run to leave
      # root-owned files in the working tree. Everything Go writes (build cache,
      # module cache) lives inside the container.
      - ./apps/bay:/src:ro
