services:

  redis:
    restart: always
    image: redis:latest
    ports:
      - "16379:6379"

  postgres:
    restart: always
    image: postgres:latest
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  s3mock:
    restart: always
    image: adobe/s3mock:latest
    ports:
      - "19090:9090"

  emqx:
    restart: always
    image: emqx/emqx:latest
    ports:
      - "11883:1883"
    environment:
      EMQX_ALLOW_ANONYMOUS: "true"
